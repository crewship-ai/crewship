<!-- @dsCard height=320 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;700&display=swap">
<style>
  html, body { margin: 0; background: var(--surface); }
  .cv { position: relative; width: 960px; height: 320px; background: var(--surface); overflow: hidden; }
  .cv svg { position: absolute; left: 0; top: 0; }
  .deep { fill: var(--deep); }
  .deck { fill: var(--deck); }
  .signal { fill: var(--signal); }
  .panel { fill: var(--panel); }
  .line { fill: var(--line); }
  .dot { fill: var(--surface); fill-opacity: .35; }
  .name { position: absolute; left: 48px; top: 136px; width: 864px; font: 700 64px/.95 "IBM Plex Sans", Arial, sans-serif; color: var(--ink); margin: 0; }
  .tag { position: absolute; left: 48px; top: 272px; width: 440px; font: 400 14px/1.3 "IBM Plex Sans", Arial, sans-serif; color: var(--ink-muted); margin: 0; }
</style>
<div class="cv">
  <!--
    blocks: deep 432×112, deck 208×112, signal 160×112, panel 160×112 on a line hairline
    arrangement: top band, a strip of unequal flush bands (name too wide for the 440px zone)
    pattern: dot grid at space-4 pitch over deep — README: technical, mono, 4px grid
    steps/radii: space-4 (16) pitch, space-6 (24) insets; square band, flush like the app header
  -->
  <svg width="960" height="320" viewBox="0 0 960 320" aria-hidden="true">
    <rect class="deep" x="0" y="0" width="432" height="112"></rect>
    <rect class="deck" x="432" y="0" width="208" height="112"></rect>
    <rect class="signal" x="640" y="0" width="160" height="112"></rect>
    <rect class="line" x="800" y="0" width="160" height="112"></rect>
    <rect class="panel" x="801" y="0" width="159" height="111"></rect>
    <g>
      <circle class="dot" cx="48" cy="32" r="2"></circle><circle class="dot" cx="64" cy="32" r="2"></circle><circle class="dot" cx="80" cy="32" r="2"></circle><circle class="dot" cx="96" cy="32" r="2"></circle><circle class="dot" cx="112" cy="32" r="2"></circle><circle class="dot" cx="128" cy="32" r="2"></circle><circle class="dot" cx="144" cy="32" r="2"></circle><circle class="dot" cx="160" cy="32" r="2"></circle>
      <circle class="dot" cx="48" cy="48" r="2"></circle><circle class="dot" cx="64" cy="48" r="2"></circle><circle class="dot" cx="80" cy="48" r="2"></circle><circle class="dot" cx="96" cy="48" r="2"></circle><circle class="dot" cx="112" cy="48" r="2"></circle><circle class="dot" cx="128" cy="48" r="2"></circle><circle class="dot" cx="144" cy="48" r="2"></circle><circle class="dot" cx="160" cy="48" r="2"></circle>
      <circle class="dot" cx="48" cy="64" r="2"></circle><circle class="dot" cx="64" cy="64" r="2"></circle><circle class="dot" cx="80" cy="64" r="2"></circle><circle class="dot" cx="96" cy="64" r="2"></circle><circle class="dot" cx="112" cy="64" r="2"></circle><circle class="dot" cx="128" cy="64" r="2"></circle><circle class="dot" cx="144" cy="64" r="2"></circle><circle class="dot" cx="160" cy="64" r="2"></circle>
      <circle class="dot" cx="48" cy="80" r="2"></circle><circle class="dot" cx="64" cy="80" r="2"></circle><circle class="dot" cx="80" cy="80" r="2"></circle><circle class="dot" cx="96" cy="80" r="2"></circle><circle class="dot" cx="112" cy="80" r="2"></circle><circle class="dot" cx="128" cy="80" r="2"></circle><circle class="dot" cx="144" cy="80" r="2"></circle><circle class="dot" cx="160" cy="80" r="2"></circle>
    </g>
  </svg>
  <p class="name">Template Crewship<br>Design System</p>
  <p class="tag">Noční moře, jedna signální oranžová, klidná technika.</p>
</div>
