pages:
- slug: demo-sales
  name: Missed inquiries
  description: Ava asked for a quote for 50 storage boxes. Her inquiry has been waiting
    for 26 hours.
  owner: crew/engineering
  panels:
  - id: about
    schema: status.v1
    title: The story
    icon: people
    owner: crew/engineering
    producer: script/demo-fixture
    sla: 168h
    span: 12
    actions:
    - id: check
      kind: call
      label: Check inquiries
      routine: demo-sales-check
    - id: resolve
      kind: call
      label: Review reply
      routine: demo-sales-resolve
    - id: draft
      kind: call
      label: Draft with AI
      routine: demo-sales-draft
    demo:
      items:
      - name: Local sample data
        state: ok
        label: Ready to check
  - id: records
    schema: table.v1
    title: Sample records
    icon: clock
    owner: crew/engineering
    producer: routine/demo-sales-check
    sla: 168h
    span: 12
    skip_seed_run: true
  - id: finding
    schema: narrative.v1
    title: What the check found
    icon: clock
    owner: crew/engineering
    producer: routine/demo-sales-check
    sla: 168h
    span: 12
    skip_seed_run: true
  - id: draft
    schema: narrative.v1
    title: Agent draft
    icon: clock
    owner: crew/engineering
    producer: routine/demo-sales-draft
    sla: 168h
    span: 12
    skip_seed_run: true
  - id: outcome
    schema: narrative.v1
    title: Decision and result
    icon: clock
    owner: crew/engineering
    producer: routine/demo-sales-resolve
    sla: 168h
    span: 12
    skip_seed_run: true
  - id: resolved-records
    schema: table.v1
    title: Records after the decision
    icon: database
    owner: crew/engineering
    producer: routine/demo-sales-resolve
    sla: 168h
    span: 12
    skip_seed_run: true
  - id: proposal
    schema: narrative.v1
    title: Prepared proposal
    icon: clock
    owner: crew/engineering
    producer: routine/demo-sales-resolve
    sla: 168h
    span: 12
    skip_seed_run: true
