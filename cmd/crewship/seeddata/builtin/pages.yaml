# Demo pages for `crewship seed`.
#
# Four pages, and the split between them is the point: ONE PRODUCER DOOR EACH.
# `operations` is fed by a script through the CLI, `watch` by a routine through
# the dispatcher, `from-a-container` by an agent through its sidecar, and
# `from-outside` by a webhook token held by something that cannot run the
# binary. Each carries its own block comment below explaining the door it
# demonstrates and why its panels are shaped the way they are.
#
# `operations/services` additionally carries the half of the feature the other
# three do not: a `wake:` gate, an `on_failure:` route, an `actions:` button and
# `public: true`. PRD §0 calls the panel a sensor rather than a display, and a
# demo with no gate anywhere never shows that.
#
# `operations` is five panels — one per schema — each on its own tab, every
# one carrying a `demo` payload the seeder pushes itself. Seeding the spec
# without pushing data would leave five panels reading "never produced", which
# is the state the freshness contract uses to mean "nobody wired this up" —
# exactly the wrong first impression, and indistinguishable from a broken seed.
#
# ONE PANEL PER TAB IS UNUSUAL, AND DELIBERATE HERE. Tabs exist because a page
# past about six panels becomes a scroll (tabs.go), so a real page groups
# several panels under one tab. This page is a CATALOGUE of the five payload
# shapes, and the thing a reader wants is to look at exactly one shape at a
# time; the tab bar is what gives them that.
#
# Its producers are all `script/…` deliberately, and that kind is the only one
# where BOTH a script and a human may write the same panel: mayProduce
# (pages_authz.go) admits a `script` push from the page owner or a workspace
# admin, because — in that file's own words — "script/watch-services.sh is a
# name, not a principal". So the seeder fills the page at seed time, the shipped
# producer (examples/pages/operations.sh) overwrites it with live measurements of
# whatever host it runs on, and anyone in the owning crew can hand-write a panel
# without either of them. Three writers, one panel, no grants.
#
# Every panel measures something a portable shell script can actually read —
# `free`, `uptime`, `df`, one HTTP probe. That is what lets the demo payloads
# below and the real producer agree on what each panel MEANS, rather than the
# seed describing a world no script could reproduce.
#
# `watch` is the opposite half of the same feature and is why the seed does not
# stop at a snapshot. Its panels declare `routine/page-watch`, and a routine
# producer is one the seeding owner CANNOT write: mayProduce admits an owner
# push for `script` and `webhook` and refuses every other kind, so these panels
# have no `demo` payload and could not use one. They fill when the routine runs,
# which is what seedPageProducerRoutines makes happen — a panel written by its
# own declared producer, through the dispatcher, exactly as it would be in a
# real workspace.
#
# Owners are seeded crews (crews.yaml). Panels owned by DIFFERENT crews on one
# page is the point, not decoration: it is what makes the sealed placeholder
# visible to anyone who logs in as a member of only one of them.
pages:
  - slug: operations
    name: Operations
    description: How the machine this runs on is doing — five shapes of data, each on its own tab.
    # Handed to ops, not kept by the account that ran the seed. That one line is
    # what lets anyone in ops correct a panel by hand — isPageOwner counts crew
    # members — instead of the page belonging to whoever happened to seed it.
    owner: crew/ops
    panels:
      # ── Services ─────────────────────────────────────────────────────────
      # status.v1 first, and first is not arbitrary: "is it working" outranks
      # every number on the page, and this is the panel a wake gate watches.
      - id: services
        schema: status.v1
        title: Is it running?
        icon: container
        tab: Services
        owner: crew/ops
        producer: script/operations.sh
        sla: 5m
        span: 12

        # ── The sensor half ───────────────────────────────────────────────
        # This is the claim the whole feature rests on (PRD §0): a panel is a
        # sensor, not a display. A cheap script pushes a number, a threshold on
        # that number wakes an agent, and a human finds an issue rather than a
        # red square nobody was looking at.
        #
        # `for: 5m` is what keeps one bad scrape from waking anybody. The
        # producer pushes `critical` only when the API stops answering or a disk
        # passes 90 %, so this does not fire on a quiet machine — which is the
        # point: a demo gate that fired every few minutes would teach people to
        # ignore it.
        #
        # NO `writes:`, deliberately. A gate may name a panel where the answer
        # goes, but naming one is a declaration and not a grant — the woken
        # agent still needs produce authority on that panel, which on this page
        # nobody has (every panel here declares a script producer). The full
        # write-back loop is on the `from-a-container` page, where the target
        # declares `producer: agent/riley` and the push therefore lands.
        wake:
          - when: any(state == "critical")
            for: 5m
            agent: crew/ops

        # An SLA lapse is a different event from a threshold: nothing crossed,
        # the producer simply stopped. One issue per lapse, closed when data
        # comes back.
        on_failure:
          issue: crew/ops

        # ── The action half ───────────────────────────────────────────────
        # A button on a panel that runs a routine. This is the interactivity the
        # design admits: it is not a query the panel makes — the page still
        # holds no datasource — it is a deed a human asks for, dispatched
        # through the same governed path a schedule uses.
        #
        # No `confirm:` on purpose. Friction is calibrated to blast radius
        # (§8 rule 7), and this probe reads a public endpoint and writes
        # nothing; a dialog in front of it would be the rubber stamp that rule
        # is about.
        actions:
          - id: recheck
            kind: call
            label: Run the feed probe
            routine: feed-watch-probe

        # Opts THIS ONE panel into a published link. Nothing is published yet —
        # publication is a runtime act a human performs with
        # `crewship page publish operations`, and a page with no public panel is
        # refused. So this line is what makes the demo publishable at all, and
        # the panels beside it stay private when it is.
        public: true

        demo:
          items:
            - name: api
              state: ok
              label: 200 OK · 41 ms
            - name: disk /
              state: ok
              label: 38 % used
            - name: memory
              state: warning
              label: 11 % free — close to the ceiling
            - name: load
              state: ok
              label: 0.42 across 4 cores

      # ── Memory ───────────────────────────────────────────────────────────
      - id: memory
        schema: metric.v1
        title: Free memory
        icon: memory
        tab: Memory
        owner: crew/ops
        producer: script/operations.sh
        sla: 5m
        span: 4
        demo:
          value: 1840
          unit: MB
          delta: -260
          # More free memory is the good direction, so a falling value is bad.
          # Without this the arrow renders muted, because only the payload knows
          # which way is up on this particular number.
          delta_good: up
          sparkline: [3120, 2980, 2740, 2610, 2455, 2210, 2100, 1955, 1840]

      # ── Load ─────────────────────────────────────────────────────────────
      - id: load
        schema: series.v1
        title: Load average
        icon: cpu
        tab: Load
        owner: crew/engineering
        producer: script/operations.sh
        sla: 5m
        span: 8
        demo:
          unit: load
          # Four names on nine ticks. A tick this producer does not want named
          # is null — the renderer decides how many of the named ones it can
          # draw, because only it knows the width.
          labels: ["-40m", null, null, "-20m", null, null, "-10m", null, "now"]
          series:
            - name: 1m
              values: [0.31, 0.44, 0.39, 0.62, 0.55, 0.48, 0.51, 0.46, 0.42]
            - name: 5m
              values: [0.28, 0.33, 0.36, 0.45, 0.49, 0.47, 0.48, 0.45, 0.44]

      # ── Disks ────────────────────────────────────────────────────────────
      - id: disks
        schema: table.v1
        title: Filesystems
        icon: disk
        tab: Disks
        owner: crew/engineering
        producer: script/operations.sh
        sla: 15m
        span: 12
        demo:
          columns:
            - key: mount
              label: Mount point
            - key: size
              label: Size
              align: right
            - key: free
              label: Free
              align: right
            - key: used
              label: Used
              align: right
            - key: fs
              label: Filesystem
          rows:
            - mount: /
              size: "218G"
              free: "134G"
              used: 38
              fs: ext4
            - mount: /srv
              size: "1.8T"
              free: "612G"
              used: 66
              fs: ext4
            # A cell nobody could read is null — an em dash on screen. An empty
            # string would claim we measured emptiness, which is a different and
            # wrong statement.
            - mount: /mnt/backup
              size: "3.6T"
              free: null
              used: null
              fs: nfs

      # ── Review ───────────────────────────────────────────────────────────
      - id: review
        schema: narrative.v1
        title: What follows from this
        icon: alert
        tab: Review
        owner: crew/ops
        producer: script/operations.sh
        sla: 15m
        span: 12
        demo:
          verdict: Memory is filling, everything else is quiet
          blocks:
            - kind: paragraph
              text: >-
                Free memory fell from 3120 to 1840 MB over forty minutes, and it is
                falling evenly. Load and the disks did not move, so this does not look
                like pressure from outside — more like something holding what it
                should be releasing.
            - kind: list
              text: >-
                What this page knows: the state of four things, free memory, the load
                average over the last forty minutes, and three filesystems.
            - kind: list
              text: >-
                What it does not know: which process is holding that memory. Somebody
                has to look.
            - kind: paragraph
              text: >-
                A script wrote this, not an agent. Had an agent written it the same
                schemas would apply — which is why there is no field here for a link
                or an image.

  # ── The sidecar door ─────────────────────────────────────────────────────
  #
  # This page exists to show the ONE door the other three demo pages cannot:
  # a producer running INSIDE a crew container. It declares
  # `producer: agent/riley`, and that word is what makes the door work — the
  # sidecar stamps the acting agent's id onto every push and never a run id, so
  # `mayProduceUnattended` (internal/api/pages_internal.go) admits it on the
  # `agent` arm. A panel declaring `script/…` is REFUSED on that door however
  # much of a script is sitting in the container.
  #
  # The `report` panel therefore has NO demo payload and cannot have one: the
  # seeding account is not riley, and an owner push to an agent-produced panel
  # is refused. It opens on "never produced" — which is the honest state, and
  # is what the page is teaching. The `how` panel next to it IS seeded, because
  # it declares a script producer, and mixing the two kinds on one page is
  # itself the lesson: authority is decided per panel, not per page.
  - slug: from-a-container
    name: From a container
    description: >-
      The only page an agent fills from inside a crew container, through the
      sidecar. The panel below stays empty until riley pushes — which is correct,
      not broken.
    owner: crew/ops
    panels:
      - id: how
        schema: narrative.v1
        title: How data gets here
        icon: container
        owner: crew/ops
        producer: script/explain.sh
        sla: 168h
        span: 12
        demo:
          verdict: A sidecar on localhost, and no token inside the agent
          blocks:
            - kind: paragraph
              text: >-
                An agent inside a container has no CLI token, and no crewship binary
                either — the sandbox image ships curl, jq and git and nothing else. It
                publishes by calling its own sidecar on loopback, and the sidecar
                attaches the identity from the token it holds, not the agent.
            - kind: list
              text: >-
                PUT to localhost:9119/pages/from-a-container/report, the body is the
                payload, and the token rides on file descriptor 3 so it never appears
                in the process table.
            - kind: list
              text: >-
                The panel beside this one declares producer agent/riley. Had it
                declared a script, this door would refuse it — the producer kind and
                the door are independent, but the server admits only the principal the
                panel names.
            - kind: paragraph
              text: >-
                This panel declares a script instead, so the seed filled it. Two
                producer kinds on one page is deliberate: authority is decided per
                panel, never per page.

      - id: report
        schema: status.v1
        title: What the agent reports
        icon: cpu
        owner: crew/ops
        producer: agent/riley
        sla: 6h
        span: 12

  # ── The webhook door ─────────────────────────────────────────────────────
  #
  # The door for a producer that cannot run the binary: a cron on somebody
  # else's box, a CI step, a Trigger.dev job, a PLC gateway. Nothing about it
  # needs a routine, an agent or a container.
  #
  # These panels DO carry demo payloads, because §7.1 rule 4 admits an owner
  # push for `webhook` exactly as it does for `script` — the token is a
  # principal, the declaration is only a label. So the seed fills the page and
  # whatever token a human later mints takes over.
  - slug: from-outside
    name: From outside
    description: >-
      Filled by a system outside this workspace, with one POST to a token bound to
      a single panel. No routine, no agent, no CLI — mint the token with
      `crewship page webhook create`.
    owner: crew/ops
    panels:
      - id: build
        schema: status.v1
        title: Last build
        icon: deploy
        owner: crew/engineering
        producer: webhook/ci
        sla: 6h
        span: 12
        demo:
          items:
            - name: build #412
              state: ok
              label: passed in 2 m 14 s
            - name: tests
              state: ok
              label: 1284 green
            - name: deploy
              state: warning
              label: waiting for approval

      - id: how-the-token-works
        schema: narrative.v1
        title: How data gets here
        icon: network
        owner: crew/ops
        producer: script/explain.sh
        sla: 168h
        span: 12
        demo:
          verdict: One token, one panel
          blocks:
            - kind: paragraph
              text: >-
                Mint a token with crewship page webhook create and it is bound to
                exactly one panel. It is stored hashed and shown once. A leaked token
                writes that one panel and nothing else.
            - kind: list
              text: >-
                It narrows itself: it works only while the human who issued it still
                holds what they granted from. If they leave the crew or are demoted,
                the token stops working with nobody lifting a finger.
            - kind: list
              text: >-
                Revoke it immediately with crewship page webhook revoke. Revoked
                tokens stay in the listing, because the question after an incident is
                "was it used afterwards", and a deleted row cannot answer it.
            - kind: paragraph
              text: >-
                Only a human may mint one, and only the page's owner or a workspace
                admin. An agent cannot — otherwise it could widen its own reach.

  # ── The routine-produced half ────────────────────────────────────────────
  #
  # No `demo:` on either panel, and that is not an omission. A panel declaring
  # `routine/…` is one the seeding OWNER may not write (pages_authz.go
  # mayProduce admits an owner push only for `script` and `webhook`), so a demo
  # payload here would be authored, shipped, and refused with a 403 the seeder
  # would print and step over. These panels are filled by the routine, by the
  # dispatcher, as their own declared producer — which is the whole point of
  # having them.
  #
  # The SLA is long on purpose. The seed ships ZERO scheduled routines
  # (routines.go's header states it), so nothing re-runs page-watch by itself;
  # a 60s SLA would have this page reading "stale" a minute after the demo was
  # set up, which says the feature is broken when what happened is that nobody
  # wired a schedule.
  - slug: watch
    name: Watch
    description: A page neither a human nor the seed wrote — the routine page-watch put it here when it ran.
    # Also ops, though here it buys only spec editing: these panels are
    # routine-produced, and no amount of page ownership lets a human push to one.
    owner: crew/ops
    panels:
      - id: wiring
        schema: status.v1
        title: How this page is wired
        icon: calendar
        owner: crew/ops
        producer: routine/page-watch
        sla: 6h
        span: 12

      - id: entry
        schema: narrative.v1
        title: What the watch wrote
        icon: alert
        owner: crew/ops
        producer: routine/page-watch
        sla: 6h
        span: 12
