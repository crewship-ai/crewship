# Real-world work for a freshly seeded Crewship workspace.
#
# One coherent scenario: a small team preparing the public Crewship site and
# release operations. Every issue is safe to repeat, names its evidence and
# output, and exercises delegation, review, escalation, or a real public source.
issues:
  - crew_slug: engineering
    assignee: alex
    title: Rebuild the Crewship home page — delegate research and implementation
    description: |-
      Create an accessible, self-contained reference implementation of the
      public Crewship home page at /crew/shared/site-rebuild/index.html.

      Start from the live page at https://crewship.ai and coordinate the work:
      1. Delegate to Sam: inventory the visible sections, headings, calls to
         action, navigation targets, and page metadata. Save evidence and a
         concise content map to /crew/shared/site-rebuild/content-audit.md.
      2. Delegate to Robin: implement the responsive HTML/CSS using the content
         map. No external JavaScript, trackers, fonts, or copied proprietary
         assets; use semantic HTML and local CSS only.

      When both assignments return, review the page at mobile and desktop
      widths, verify keyboard navigation and heading order, and write
      /crew/shared/site-rebuild/acceptance.md. The goal is a faithful training
      replica, not a deployment and not a pixel-perfect copy.
    priority: high
    project: Website Experience
    target_state: TODO
    comment: >-
      Demo path: start this issue to exercise a LEAD agent creating two
      assignments, waiting for both results, and integrating the shared output.

  - crew_slug: engineering
    assignee: sam
    title: Audit the live Crewship home page content and metadata
    description: |-
      Fetch https://crewship.ai with curl using a 20-second timeout and save the
      response to /crew/shared/site-audit/home.html. Produce
      /crew/shared/site-audit/content.md with:
      - final URL, HTTP status, content type, title, and meta description;
      - navigation labels and destinations;
      - H1/H2 heading outline in document order;
      - primary calls to action and their destinations;
      - broken same-site links found by HEAD/GET checks.

      Keep the raw response as evidence, make no requests outside crewship.ai,
      and report blocked or redirected URLs instead of inventing content.
    priority: medium
    project: Website Experience

  - crew_slug: engineering
    assignee: robin
    title: Recreate the Crewship docs landing page as an accessible static page
    description: |-
      Use https://docs.crewship.ai as the visual and information reference.
      Build /crew/shared/docs-replica/index.html as one self-contained HTML file
      with responsive CSS and no third-party assets or scripts.

      Preserve the information hierarchy, search affordance, primary
      navigation, and representative documentation cards. Do not copy logos or
      illustrations; replace them with accessible text or CSS shapes. Include a
      visible note that this is a training replica. Verify keyboard focus,
      reduced-motion behaviour, colour contrast, and layouts at 390 px and
      1440 px. Record checks in /crew/shared/docs-replica/verification.md.
    priority: high
    project: Website Experience
    target_state: TODO

  - crew_slug: engineering
    assignee: sam
    title: Build a deterministic parser for the Crewship release feed
    description: |-
      Download https://github.com/crewship-ai/crewship/releases.atom and build
      /crew/shared/release-tools/parse_releases.py using only the Python
      standard library. The script must accept an Atom file path and write a
      JSON array containing the five newest entries with exactly these keys:
      version, published_at, title, and url.

      Save one real feed response as releases.atom, run the parser twice, and
      prove both JSON outputs are byte-identical. Handle an empty feed and
      malformed XML with a non-zero exit and a useful stderr message. Add
      unittest coverage and a short README with the exact commands used.
    priority: high
    project: Release Operations
    target_state: TODO

  - crew_slug: engineering
    assignee: robin
    title: Build a release dashboard from the normalized Crewship feed
    description: |-
      Read /crew/shared/release-tools/releases.json and create
      /crew/shared/release-dashboard/index.html: a self-contained, responsive
      release dashboard with a latest-release summary, a searchable version
      list, published dates, and source links.

      Render an honest empty state when the JSON contains no entries and an
      explicit error state when it is invalid. Keep data embedded locally so
      opening the file makes no network requests. Add a short verification
      note covering keyboard use, 390 px layout, and malformed input.
    priority: medium
    project: Release Operations

  - crew_slug: quality
    assignee: jordan
    title: Coordinate the website release gate and issue a go or no-go verdict
    description: |-
      Coordinate a release-readiness review of the files under
      /crew/shared/site-rebuild and /crew/shared/docs-replica.

      Delegate the detailed accessibility and functional pass to Casey. Ask
      Alex for the implementation scope and any known exceptions. Then publish
      /crew/shared/quality/website-release-verdict.md with one unambiguous
      verdict (GO or NO-GO), the evidence checked, blocking findings, accepted
      risks, and the next owner for every open item. Do not mark GO without
      executable evidence.
    priority: high
    project: Quality Gate
    target_state: TODO

  - crew_slug: quality
    assignee: casey
    title: Run the acceptance suite and escalate any release-blocking decision
    description: |-
      Review /crew/shared/site-rebuild/index.html and
      /crew/shared/docs-replica/index.html against this release gate:
      semantic landmarks, one H1, logical heading order, keyboard-visible
      controls, no mixed content, no third-party runtime requests, working
      same-page links, and readable layouts at 390 px and 1440 px.

      Save reproducible checks and findings to
      /crew/shared/quality/site-acceptance.md. If either input is missing, or a
      finding requires accepting user-visible or security risk, call the
      sidecar /escalate endpoint with type DECISION. State the exact choice,
      evidence, recommended option, and a deadline; do not silently choose for
      the human. Continue all non-blocked checks while the decision is pending.
    priority: high
    project: Quality Gate
    target_state: TODO
    comment: >-
      Demo path: start this issue to produce a real human-decision escalation
      in Inbox when a prerequisite or release-blocking exception is present.

  - crew_slug: quality
    assignee: casey
    title: Review the release-feed parser for correctness and failure handling
    description: |-
      Review /crew/shared/release-tools/parse_releases.py and its tests. Run it
      against the saved real Atom feed, an empty valid feed, malformed XML, a
      duplicate entry, and entries without optional fields.

      Write /crew/shared/quality/release-parser-review.md with the command and
      observed result for each case, findings as severity/file/line/fix, and a
      final PASS or FAIL. Do not modify the parser during the review.
    priority: medium
    project: Quality Gate

  - crew_slug: ops
    assignee: morgan
    title: Run a GitHub dependency incident drill with delegated evidence collection
    description: |-
      Treat GitHub as a production dependency for the release workflow. Start
      an incident drill using the live public summary at
      https://www.githubstatus.com/api/v2/summary.json.

      Delegate to Riley: collect the current component states and unresolved
      incidents, preserve the raw JSON, and produce a timestamped evidence
      note. Use that result to write /crew/shared/incidents/github-drill.md with
      severity, blast radius, first safe action, update cadence, rollback or
      pause criteria, and exit criteria. If the proposed response would pause a
      release or change production, escalate that decision to a human; never
      execute a production change in this drill.
    priority: high
    project: Reliability Operations
    target_state: TODO

  - crew_slug: ops
    assignee: riley
    title: Build a read-only GitHub status collector and incident snapshot
    description: |-
      Build /crew/shared/ops/collect_github_status.py using only Python's
      standard library. Fetch these real public endpoints with a 20-second
      timeout:
      - https://www.githubstatus.com/api/v2/summary.json
      - https://www.githubstatus.com/api/v2/incidents/unresolved.json

      Save raw responses and write a deterministic status.json containing
      checked_at, overall_indicator, affected_components, and unresolved
      incidents. Do not fail merely because the service is degraded; fail only
      when evidence cannot be fetched or parsed. Add fixture-based tests that
      run without internet access and document one-shot and repeated use.
    priority: high
    project: Reliability Operations
    target_state: TODO

  - crew_slug: ops
    assignee: riley
    title: Audit security and caching headers on Crewship public properties
    description: |-
      Inspect response headers for https://crewship.ai and
      https://docs.crewship.ai using curl with redirects enabled and a
      20-second timeout. Record each redirect hop and the final values for HSTS,
      CSP, X-Content-Type-Options, Referrer-Policy, Permissions-Policy,
      Cache-Control, ETag, and Content-Encoding.

      Save raw headers and a comparison table to
      /crew/shared/ops/public-web-headers.md. Distinguish missing headers from
      headers that are not applicable. This is read-only observation: do not
      scan paths, fuzz parameters, or attempt to bypass controls.
    priority: medium
    project: Reliability Operations

  - crew_slug: ops
    assignee: morgan
    title: Write the release dependency runbook from live GitHub status evidence
    description: |-
      Use the latest files in /crew/shared/ops and the public GitHub Status API
      to write /crew/shared/runbooks/github-release-dependency.md.

      Cover detection, severity mapping, evidence capture, release-pause
      criteria, communications cadence, human approval boundaries, recovery
      verification, and a compact post-incident checklist. Separate observed
      facts from assumptions and include the exact public endpoints used. Keep
      the runbook under two pages and usable during an incident.
    priority: medium
    project: Reliability Operations

