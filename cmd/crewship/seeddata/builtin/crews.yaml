- name: Customer Team
  slug: engineering
  color: '#4F83F8'
  icon: terminal
  runtime_image: mcr.microsoft.com/devcontainers/javascript-node:22-bookworm
  devcontainer_config: '{"image":"mcr.microsoft.com/devcontainers/javascript-node:22-bookworm","containerEnv":{"PATH":"/home/agent/.local/bin:/opt/crewship/bin:/opt/mise/data/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"},"features":{"ghcr.io/devcontainers/features/common-utils:2":{"username":"agent","userUid":"1001","userGid":"1001","installZsh":false,"upgradePackages":false},"ghcr.io/devcontainers-extra/features/claude-code:2":{}},"postCreateCommand":"sudo
