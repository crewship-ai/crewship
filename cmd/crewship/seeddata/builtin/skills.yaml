skills:
- name: File Crafter
  slug: file-crafter
  display_name: File Crafter
  category: CODING
  description: File and directory creation, CSV generation, data formatting
  icon: file-text
  content: "# File Crafter\n\n## When to Activate\n- Task involves creating files,\
    \ directories, or structured data\n- Keywords: \"create\", \"file\", \"directory\"\
    , \"CSV\", \"JSON\", \"tree\", \"generate\"\n\n## Instructions\n1. Create parent\
    \ directories with mkdir -p before writing files\n2. Use heredoc (cat << 'EOF')\
    \ for multi-line file content\n3. For CSV files: always include a header row with\
    \ column names\n4. For JSON files: ensure valid JSON (use python3 -m json.tool\
    \ to validate)\n5. After creating files, verify they exist with ls -la and show\
    \ first few lines\n6. Use chmod appropriately (755 for scripts, 644 for data files)\n\
    \n## Output Format\n- Always show the created file tree with: find <dir> -type\
    \ f | sort\n- For generated data, show a preview: head -5 <file>\n- Report file\
    \ sizes and line counts: wc -l <file>\n\n## Guardrails\n- Write only to /tmp/\
    \ \u2014 never to system directories\n- Don't create files larger than 10MB\n\
    - Always use descriptive filenames (not temp1.txt, file.dat)\n- Clean up any temporary\
    \ intermediate files"
- name: Script Runner
  slug: script-runner
  display_name: Script Runner
  category: CODING
  description: Python and Bash script creation, execution, and output capture
  icon: terminal
  content: "# Script Runner\n\n## When to Activate\n- Task involves writing and executing\
    \ Python or Bash scripts\n- Keywords: \"script\", \"Python\", \"Bash\", \"run\"\
    , \"execute\", \"generate\", \"calculate\"\n\n## Instructions\n1. Write scripts\
    \ to /tmp/ with descriptive names (not script.sh, test.py)\n2. Add a shebang line:\
    \ #!/usr/bin/env python3 or #!/bin/bash\n3. Always run scripts through the interpreter:\
    \ bash /tmp/name.sh or python3 /tmp/name.py \u2014 /tmp is a noexec tmpfs, so\
    \ chmod +x and ./name.sh fail with Permission denied\n4. For Python: use only\
    \ stdlib modules (no pip install needed)\n5. For Bash: use set -euo pipefail at\
    \ the top for error safety\n6. Capture output to both stdout and a file with:\
    \ bash /tmp/name.sh | tee /tmp/output.txt\n7. Include comments explaining what\
    \ each section does\n\n## Output Format\n- Show the script content before running\
    \ it\n- Run the script and show its output\n- Save output to /tmp/{script-name}-output.txt\n\
    - Report: script location, exit code, output file location\n\n## Guardrails\n\
    - Scripts must be idempotent \u2014 safe to run multiple times\n- No infinite\
    \ loops \u2014 always have exit conditions\n- Don't install packages or modify\
    \ system configuration\n- Keep scripts under 100 lines \u2014 simple and readable\n\
    - If a script fails, show the error and explain what went wrong"
- name: System Inspector
  slug: system-inspector
  display_name: System Inspector
  category: DEVOPS
  description: Container environment inspection, tool inventory, resource mapping
  icon: cpu
  content: "# System Inspector\n\n## When to Activate\n- Task involves checking container\
    \ environment, installed tools, or system resources\n- Keywords: \"inventory\"\
    , \"container\", \"system info\", \"resource\", \"environment\", \"inspect\"\n\
    \n## Instructions\n1. Check tool availability with: command -v <tool> or which\
    \ <tool>\n2. Get versions with: <tool> --version 2>/dev/null || echo \"version\
    \ unknown\"\n3. Read system info from /proc/ when available (meminfo, cpuinfo)\n\
    4. Use standard tools: uname, df, free, nproc, id, hostname, ip/ifconfig\n5. Handle\
    \ missing tools gracefully \u2014 report as MISSING, don't fail\n\n## Output Format\n\
    - Use aligned columns for readability:\n  curl          /usr/bin/curl      7.88.1\
    \    AVAILABLE\n  wget          -                  -         MISSING\n- Group\
    \ results by category (Network tools, Dev tools, System tools)\n- Include a summary\
    \ count: \"Found N/M tools available\"\n- Save to /tmp/ with clear filename\n\n\
    ## Guardrails\n- Read-only inspection \u2014 never modify system configuration\n\
    - Don't access /etc/shadow or other sensitive files\n- Stick to standard Linux\
    \ inspection commands\n- If /proc is not available, use alternative commands and\
    \ note the limitation"
- name: Demo business workflow
  slug: demo-business
  display_name: Demo business workflow
  category: general
  description: Use local evidence, avoid duplicate work and distinguish proposals
    from completed demo actions.
  icon: inbox
  content: Read the Harbor Goods records through read_demo_records or /crew/shared/demo/business/catalogue.json.
    Preserve record identifiers, amounts and time intervals exactly. Checks are deterministic
    scripts; use AI only for explanation and draft text. Never infer that a sample
    message was sent externally. Reuse the existing project Issue and routine. A human
    chooses the final action in Inbox. Evidence is written to /crew/shared/demo/business/outbox/.
    Do not expose credentials or read another project's private files.
