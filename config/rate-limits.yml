# Crewship -- Rate Limiting Configuration
#
# Defines rate limits for all API endpoints.
# Implementation: in-memory (Next.js middleware + Go service)
# MVP: per-process, neskaluje pres vice instanci.
# Phase 2: distribuovany rate limiter.
#
# Window formats: 1s, 10s, 1m, 1h, 1d
# Scope: ip (unauthenticated), user (authenticated), agent (webhooks)
#        connection (one websocket), panel / workspace / token (Pages, below)
#
# Optional `burst:` — bucket depth, where a limiter absorbs a burst and then
# settles to `requests` per `window`. Absent means burst == requests.

# ============================================
# CRITICAL OPERATIONS
# ============================================
critical:
  - name: DELETE_ORGANIZATION
    requests: 1
    window: 1d
    scope: user
    applies_to:
      - DELETE /api/v1/orgs/{orgId}

  - name: EXPORT_DATA
    requests: 3
    window: 1h
    scope: user
    applies_to:
      - POST /api/v1/user/export

# ============================================
# HIGH PRIORITY OPERATIONS
# ============================================
high:
  - name: CREATE_ORGANIZATION
    requests: 3
    window: 1h
    scope: user
    applies_to:
      - POST /api/v1/orgs

  - name: CREATE_TEAM
    requests: 10
    window: 1h
    scope: user
    applies_to:
      - POST /api/v1/orgs/{orgId}/teams

  - name: CREATE_AGENT
    requests: 20
    window: 1h
    scope: user
    applies_to:
      - POST /api/v1/orgs/{orgId}/agents

  - name: CREATE_CREDENTIAL
    requests: 20
    window: 1h
    scope: user
    applies_to:
      - POST /api/v1/orgs/{orgId}/credentials

  - name: INVITE_MEMBER
    requests: 10
    window: 1h
    scope: user
    applies_to:
      - POST /api/v1/orgs/{orgId}/members/invite

  - name: AGENT_START
    requests: 30
    window: 1m
    scope: user
    applies_to:
      - POST /api/v1/orgs/{orgId}/agents/{agentId}/start

# ============================================
# MEDIUM PRIORITY OPERATIONS
# ============================================
medium:
  - name: UPDATE_RESOURCE
    requests: 30
    window: 1m
    scope: user
    applies_to:
      - PATCH /api/v1/orgs/{orgId}
      - PATCH /api/v1/orgs/{orgId}/teams/{teamId}
      - PATCH /api/v1/orgs/{orgId}/agents/{agentId}
      - PATCH /api/v1/orgs/{orgId}/credentials/{credId}
      - PATCH /api/v1/orgs/{orgId}/members/{memberId}

  - name: DELETE_RESOURCE
    requests: 20
    window: 1m
    scope: user
    applies_to:
      - DELETE /api/v1/orgs/{orgId}/teams/{teamId}
      - DELETE /api/v1/orgs/{orgId}/agents/{agentId}
      - DELETE /api/v1/orgs/{orgId}/credentials/{credId}

# ============================================
# LOW PRIORITY OPERATIONS (reads)
# ============================================
low:
  - name: API_READ
    requests: 200
    window: 1m
    scope: user
    applies_to:
      - GET /api/v1/orgs
      - GET /api/v1/orgs/{orgId}
      - GET /api/v1/orgs/{orgId}/teams
      - GET /api/v1/orgs/{orgId}/agents
      - GET /api/v1/orgs/{orgId}/credentials
      - GET /api/v1/orgs/{orgId}/members
      - GET /api/v1/orgs/{orgId}/audit-logs
      - GET /api/v1/skills

# ============================================
# AUTHENTICATION (by IP)
# ============================================
auth:
  - name: LOGIN_ATTEMPT
    requests: 5
    window: 1m
    scope: ip
    applies_to:
      - POST /api/auth/*

  - name: PASSWORD_RESET
    requests: 3
    window: 1h
    scope: ip
    applies_to:
      - POST /api/auth/reset-password

  - name: SIGNUP
    requests: 3
    window: 1h
    scope: ip
    applies_to:
      - POST /api/v1/auth/register

# ============================================
# WEBHOOKS (by agent)
# ============================================
webhooks:
  - name: WEBHOOK_TRIGGER
    requests: 60
    window: 1m
    scope: agent
    applies_to:
      - POST /api/v1/webhooks/{teamId}/{agentId}/trigger

# ============================================
# WEBSOCKET (by connection)
# ============================================
websocket:
  - name: WS_MESSAGES
    requests: 60
    window: 1m
    scope: connection
    applies_to:
      - WebSocket send_message

# ============================================
# PAGES (docs/prd/pages.md 10b.3)
# ============================================
#
# The dangerous number in Pages is push FREQUENCY, not size: 24 panels x 100
# pages x one push every 5 s is 2 880 writes per second, which no amount of
# index tuning survives on SQLite's single writer.
#
# Only the RATE rows live here. The size and count rows from the same table
# (64 KiB payload, 256 KiB spec, 24 panels/page, 100 pages/workspace, 200
# payloads per ring, 50 versions) are Go constants in internal/pages -- a
# payload cap that varies per deployment is a payload cap no producer can code
# against.
#
# Values are mirrored in internal/ratelimitcfg (keys pages.*), which is what
# the admin "Rate Limiters" console edits; this file is the declarative map of
# WHICH ROUTE each limit covers.
#
# The per-process caveat at the top of this file is load-bearing here. With N
# replicas every bucket below becomes N x, so PAGE_PUSH_PANEL is enforced a
# second time where the write lands: a minimum-interval check on produced_at,
# in the same transaction as the INSERT (internal/pages/limits.go,
# internal/api/pages_data.go). That floor is 1m / burst = 2 s -- loose enough
# never to refuse a push the bucket would have allowed at its steadiest, tight
# enough that no number of replicas turns one panel into a write firehose.
pages:
  - name: PAGE_PUSH_PANEL
    requests: 12
    burst: 30
    window: 1m
    scope: panel
    applies_to:
      - PUT /api/v1/pages/{slug}/panels/{panelId}/data

  - name: PAGE_PUSH_WORKSPACE
    requests: 600
    window: 1m
    scope: workspace
    applies_to:
      - PUT /api/v1/pages/{slug}/panels/{panelId}/data

  # 7.3.2 rule 6. Declared with the rest of the set so there is one number to
  # tune; /p/{token} is not built yet, so nothing enforces this today.
  - name: PAGE_PUBLIC_VIEW
    requests: 600
    window: 1h
    scope: token
    applies_to:
      - GET /p/{token}

# ============================================
# NOTES
# ============================================
#
# Rate Limit Headers (returned in all responses):
# - X-RateLimit-Limit: Request limit per window
# - X-RateLimit-Remaining: Remaining requests
# - X-RateLimit-Reset: Reset timestamp (ISO 8601)
# - Retry-After: Seconds until reset (on 429)
#
# Error Response (429 Too Many Requests):
# {
#   "type": "https://crewship.ai/errors/rate-limit",
#   "title": "Too Many Requests",
#   "status": 429,
#   "detail": "Rate limit exceeded. Try again in X seconds.",
#   "code": "RATE_LIMIT"
# }
#
# Behavior when rate limiter unavailable:
# - Production: fail-closed (503)
# - Development: bypass (log warning)
