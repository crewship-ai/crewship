name: CodeQL

# Static analysis for Go and JavaScript/TypeScript. CodeQL is GitHub-native
# (no external account, no extra cost) and complements the existing
# security.yml suite: gitleaks catches committed secrets, govulncheck
# catches vulnerable dependencies, grype catches OS-package vulns,
# and CodeQL closes the SAST gap — code-level injection, taint, hard-
# coded crypto material, untrusted-input flows that the others miss.
#
# Findings land in the Security tab (Code scanning alerts) as SARIF.
# We intentionally do NOT fail PRs on CodeQL findings yet — the first
# pass against an established codebase typically surfaces dozens of
# medium-severity hits that need triage. Promote `fail-on-severity`
# once the baseline is clean.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.mdx'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.mdx'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
      - '.github/ISSUE_TEMPLATE/**'
  schedule:
    # Re-scan main weekly even without a code change so CodeQL's own
    # query updates surface new findings on stable branches. Sunday
    # 06:00 UTC = low-traffic window for both EU and US contributors.
    - cron: '0 6 * * 0'

# PR runs supersede each other; `main` runs never do. `github.ref` is the
# constant `refs/heads/main` on a merge, so one shared group meant each merge
# cancelled the previous merge's analysis (#1998) — and a cancelled CodeQL run
# uploads no SARIF, so the Security tab silently kept stale results. Keying
# `main` on the SHA gives every commit its own group; merely turning
# cancellation off would queue the newcomer and cancel the previously PENDING
# run instead. See the long-form note in ci.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  # security-events: write is what lets the action upload SARIF to the
  # repository's Code scanning alerts.
  security-events: write
  # actions: read is needed by the CodeQL upload step to associate
  # alerts back to the workflow run.
  actions: read

jobs:
  # Router: on pull_request, run each language's analysis only when that
  # language's sources (or its dependency manifests) changed. A Go-only PR
  # skips the JS pass and vice versa; a workflow/docs-only PR skips both
  # (~6 runner-minutes saved per PR). push to main and the weekly schedule
  # always run both, so nothing lands or lingers unanalyzed.
  changes:
    name: Detect changed languages
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            js:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.mjs'
              - '**/*.cjs'
              - 'package.json'
              - 'pnpm-lock.yaml'

      # Compose the analyze matrix. `matrix` context is not available in a
      # job-level `if`, so per-language skipping is done by building the
      # include list dynamically: languages a PR didn't touch never get a
      # runner at all. Build-mode notes live here now: `manual` + an
      # explicit Go build gives full control over compilation flags —
      # CodeQL's autobuild can miss tagged builds; manual mode is what
      # release.yml uses too.
      - id: matrix
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          GO_CHANGED: ${{ steps.filter.outputs.go }}
          JS_CHANGED: ${{ steps.filter.outputs.js }}
        run: |
          set -euo pipefail
          entries=()
          if [ "$IS_PR" != "true" ] || [ "$GO_CHANGED" = "true" ]; then
            entries+=('{"language":"go","build-mode":"manual"}')
          fi
          if [ "$IS_PR" != "true" ] || [ "$JS_CHANGED" = "true" ]; then
            entries+=('{"language":"javascript-typescript","build-mode":"none"}')
          fi
          include="[$(IFS=,; echo "${entries[*]-}")]"
          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "analyze matrix: $include"

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    #
    # Was 30, with no step-level bound on any of the three long steps below.
    # `Analyze (go, manual)` was observed hitting that cap mid-build and
    # passing on a rerun (#1998, item 3) — i.e. the work fits, but not always
    # on a loaded runner, and when it did not fit the only thing that could
    # fire was the job budget, which GitHub reports as `cancelled`.
    #
    # 45 with per-step caps below, so the job budget is the outermost bound and
    # not the first one to fire. This is headroom on one observed reap, not a
    # measurement: if this job starts routinely needing more than ~20 minutes,
    # find out why rather than raising it again.
    timeout-minutes: 45
    needs: changes
    # Empty include (docs/CI-only PR) would fail matrix expansion — guard it.
    if: needs.changes.outputs.include != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.include) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Set up Go BEFORE initializing CodeQL so the `go build` step inside
      # the analyze phase finds the right toolchain.
      - if: matrix.language == 'go'
        uses: ./.github/actions/setup-go-embed
        with:
          go-version: "1.27.0"

      - name: Initialize CodeQL
        # Downloads the CodeQL bundle — third-party network, so it gets a bound
        # of its own rather than sharing the job's.
        timeout-minutes: 15
        uses: github/codeql-action/init@3b1a19a80ab047f35cbb237b5bd9bdc1e14f166c # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Query suite (security-extended) and repo-specific query filters
          # (go/log-injection excluded — sanitized centrally in
          # internal/logging, see #954) live in the config file so they are
          # versioned together.
          config-file: ./.github/codeql/codeql-config.yml

      # For Go, we build the main binary so CodeQL sees the actual code
      # paths the release artifact will compile. This workflow runs no
      # `pnpm build`, so web/out/ holds only the tracked placeholder —
      # enough for `//go:embed all:out` to resolve (#1567), and CodeQL
      # analyzes Go source, not the embedded JS bundle. No stub step
      # needed; the checkout already satisfies the embed.
      - if: matrix.language == 'go'
        name: Build for CodeQL
        # The step that was observed being reaped: under manual build-mode the
        # extractor traces this compile, so it is far slower than the same
        # `go build` in ci.yml.
        timeout-minutes: 20
        run: go build ./cmd/crewship

      - name: Perform CodeQL Analysis
        timeout-minutes: 25
        uses: github/codeql-action/analyze@3b1a19a80ab047f35cbb237b5bd9bdc1e14f166c # v3
        with:
          category: "/language:${{ matrix.language }}"
          # upload: defaults to true; explicit for clarity. SARIF results
          # go to the Security tab regardless of `fail-on-severity` so
          # findings are visible without blocking the PR while the
          # baseline gets triaged.
          upload: always
