name: Nightly
'on':
  workflow_run:
    workflows:
    - CI
    types:
    - completed
    branches:
    - main
  schedule:
  - cron: 17 2 * * *
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nightly-publish
  cancel-in-progress: false
env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10'
  GO_VERSION: 1.27.1
jobs:
  verified:
    name: Verify publication commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Resolve trusted source commit
      id: target
      env:
        EVENT: ${{ github.event_name }}
        SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        SOURCE_EVENT: ${{ github.event.workflow_run.event }}
        SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
        SOURCE_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        SOURCE_RESULT: ${{ github.event.workflow_run.conclusion }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        if [ "$EVENT" = workflow_run ]; then
          [ "$SOURCE_EVENT" = push ] && [ "$SOURCE_BRANCH" = main ] && [ "$SOURCE_REPO" = "$REPO" ] && [ "$SOURCE_RESULT" = success ]
        else
          [ "$GITHUB_REF" = refs/heads/main ]
        fi
        [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
        git merge-base --is-ancestor "$SOURCE_SHA" origin/main
        echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
    - name: Require successful CI, Security and CodeQL for this SHA
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        SHA: ${{ steps.target.outputs.sha }}
      run: python3 scripts/ci/verified_commit.py "$REPO" "$SHA"
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion
      == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
  docker:
    name: Nightly Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.verified.outputs.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Resolve commit timestamp
      id: meta
      run: echo "date=$(git log -1 --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a
    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
    - name: Login to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      with:
        cosign-release: v2.6.3
    - name: Build immutable image candidate
      id: build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/crewship:candidate-${{ needs.verified.outputs.sha }}-${{ github.run_id
          }}
        build-args: |
          VERSION=nightly-${{ needs.verified.outputs.sha }}
          COMMIT=${{ needs.verified.outputs.sha }}
          DATE=${{ steps.meta.outputs.date }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_DSN=${{ secrets.SENTRY_DSN_FRONTEND }}
        cache-from: type=gha,scope=server-image
        cache-to: type=gha,mode=max,scope=server-image
        provenance: mode=max
        sbom: true
    - name: Scan the built image
      uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439
      with:
        image: ghcr.io/${{ github.repository_owner }}/crewship@${{ steps.build.outputs.digest }}
        fail-build: true
        severity-cutoff: critical
        output-format: table
    - name: Smoke both image platforms before promotion
      env:
        IMAGE: ghcr.io/${{ github.repository_owner }}/crewship@${{ steps.build.outputs.digest }}
        SHA: ${{ needs.verified.outputs.sha }}
      run: |
        bash scripts/ci/smoke-image.sh "$IMAGE" "$SHA" linux/amd64
        bash scripts/ci/smoke-image.sh "$IMAGE" "$SHA" linux/arm64
    - name: Sign verified image digest
      env:
        IMAGE: ghcr.io/${{ github.repository_owner }}/crewship@${{ steps.build.outputs.digest }}
      run: cosign sign --yes "$IMAGE"
    needs:
    - verified
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
  binaries:
    name: Nightly binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.verified.outputs.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - name: Generate Prisma Client
      run: pnpm db:generate
      env:
        DATABASE_URL: file:./dev.db
    - name: Build Next.js static export
      run: pnpm build
      env:
        NEXTAUTH_SECRET: build-time-placeholder
        NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN_FRONTEND }}
        NEXT_PUBLIC_CREWSHIP_VERSION: nightly-${{ needs.verified.outputs.sha }}
    - name: Copy static export for embedding
      run: ./scripts/embed-web-out.sh sync
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      with:
        cosign-release: v2.6.3
    - name: Install syft
      uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
      with:
        syft-version: v1.38.0
    - name: Prepare package signing key (if configured)
      env:
        GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
      run: "if [ -n \"$GPG_SIGNING_KEY\" ]; then\n  printf '%s' \"$GPG_SIGNING_KEY\" | base64 -d > \"$RUNNER_TEMP/crewship-signing.asc\"\
        \n  echo \"GPG_KEY_PATH=$RUNNER_TEMP/crewship-signing.asc\" >> \"$GITHUB_ENV\"\n  echo \"deb/rpm signing\
        \ enabled\"\nelse\n  echo \"::notice::GPG_SIGNING_KEY not set \u2014 nightly deb/rpm packages will be UNSIGNED\
        \ (see #932)\"\nfi\n"
    - name: Build snapshot binaries
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
      with:
        version: v2.6.1
        args: release --parallelism 2 --snapshot --clean --skip=publish,homebrew
      env:
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        GORELEASER_CURRENT_TAG: v0.0.0-nightly
        NFPM_PACKAGES_PASSPHRASE: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
    - name: Sign checksums.txt
      if: hashFiles('dist/checksums.txt') != ''
      run: |
        cosign sign-blob --yes \
          --output-signature dist/checksums.txt.sig \
          --output-certificate dist/checksums.txt.pem \
          dist/checksums.txt
    - name: Require complete release assets
      run: |
        set -euo pipefail
        test -s dist/checksums.txt
        test -s dist/checksums.txt.sig
        test -s dist/checksums.txt.pem
        (cd dist && sha256sum -c checksums.txt)
    - name: Boot the packaged Linux archive before publication
      env:
        SHA: ${{ needs.verified.outputs.sha }}
      run: |
        set -euo pipefail
        archives=(dist/crewship_*_linux_amd64.tar.gz)
        [ "${#archives[@]}" -eq 1 ] && [ -f "${archives[0]}" ]
        python3 scripts/ci/smoke-archive.py "${archives[0]}" "$SHA"
    - name: Share immutable binary candidates
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: nightly-binaries-${{ needs.verified.outputs.sha }}
        path: |
          dist/*.tar.gz
          dist/*.zip
          dist/*.deb
          dist/*.rpm
          dist/*.json
          dist/checksums.txt
          dist/*.sig
          dist/*.pem
        if-no-files-found: error
        retention-days: 2
        compression-level: 0
    needs:
    - verified
    permissions:
      contents: read
      packages: read
      id-token: write
  publish:
    name: Publish verified nightly
    needs:
    - verified
    - docker
    - binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.verified.outputs.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: nightly-binaries-${{ needs.verified.outputs.sha }}
        path: dist
    - name: Write publication identity
      env:
        SHA: ${{ needs.verified.outputs.sha }}
        DIGEST: ${{ needs.docker.outputs.digest }}
        IMAGE: ghcr.io/${{ github.repository_owner }}/crewship
      run: |
        jq -n --arg sha "$SHA" --arg digest "$DIGEST" --arg image "$IMAGE" '{sha:$sha,digest:$digest,image:$image,release:("nightly-" + $sha[0:12] + "-r" + env.GITHUB_RUN_ID + "-a" + env.GITHUB_RUN_ATTEMPT)}' > dist/image-manifest.json
    - name: Publish immutable nightly release
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        SHA: ${{ needs.verified.outputs.sha }}
      run: |
        set -euo pipefail
        TAG="nightly-${SHA:0:12}-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
        mapfile -d '' assets < <(find dist -maxdepth 1 -type f -print0)
        [ "${#assets[@]}" -gt 0 ]
        printf 'Verified main commit: `%s`

        Image digest and source identity: image-manifest.json.
        ' "$SHA" > "$RUNNER_TEMP/notes.md"
        gh release create "$TAG" --repo "$REPO" --prerelease --target "$SHA" --title "Nightly ${SHA:0:12}" --notes-file "$RUNNER_TEMP/notes.md" "${assets[@]}"
    - name: Promote only the verified image
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        SHA: ${{ needs.verified.outputs.sha }}
        DIGEST: ${{ needs.docker.outputs.digest }}
        IMAGE: ghcr.io/${{ github.repository_owner }}/crewship
      run: |
        set -euo pipefail
        docker buildx imagetools create --tag "$IMAGE:main-$SHA" "$IMAGE@$DIGEST"
        # Never let a slow older build replace the current main's rolling image.
        current=$(gh api "repos/$REPO/commits/main" --jq .sha)
        if [ "$current" = "$SHA" ]; then
          docker buildx imagetools create --tag "$IMAGE:nightly" "$IMAGE@$DIGEST"
        else
          echo "Main advanced; published immutable artifacts without moving :nightly."
        fi
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: nightly-image-manifest
        path: dist/image-manifest.json
        if-no-files-found: error
        retention-days: 14
    - name: Prune expired nightlies (keep at least 20 and 14 days)
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: python3 scripts/ci/prune-nightlies.py "$REPO"
