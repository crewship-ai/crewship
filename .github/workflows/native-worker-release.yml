name: Native Worker Release

# An independent release producer. Acceptance consumers never build a substitute.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish and sign a candidate from reviewed, verified main (operator authorization)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: native-worker-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require exact-source main verification
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: python3 scripts/ci/verified_commit.py "$REPO" "$SHA"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Test the native runner
        run: go test ./cmd/crewship-restricted-native-runner -count=1 -timeout 5m
      - name: Authenticate upstream bytes and prepare licensed context
        run: bash scripts/ci/prepare-native-release.sh "$RUNNER_TEMP/native-context"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-worker-context-${{ github.sha }}
          path: ${{ runner.temp }}/native-context/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-worker-context-${{ github.sha }}
          path: context
      - name: Restore executable modes after artifact transport
        run: chmod 0755 context/codex context/crewship-restricted-native-runner
      - name: Bind package and candidate tag
        id: target
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/crewship-restricted-native"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$image:codex159-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build independent immutable candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: context
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.target.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=codex159
          provenance: mode=max
          sbom: true
      - name: Verify distributed binary and legal contents
        env:
          IMAGE: ${{ steps.target.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint /bin/sh "$IMAGE" -ec '
              test -s /usr/share/licenses/crewship-native/go/manifest.tsv
              test -s /usr/share/licenses/crewship-native/project/THIRD-PARTY-NOTICES.md
              test -s /usr/share/licenses/crewship-native/codex/NOTICE
              test -s /usr/share/crewship-native/release-source.json
              printf "%s  %s\n" \
                d2752c52353401f7f6efbfcea68796f4f7a3d3e4769f5d1da53fa49d4856b72f /opt/codex \
                d17f227e4df5da1600391338865ce0f3055211760a36688f816941d58232d8dc /usr/share/licenses/crewship-native/codex/LICENSE \
                9d71575ecfd9a843fc1677b0efb08053c6ba9fd686a0de1a6f5382fd3c220915 /usr/share/licenses/crewship-native/codex/NOTICE | sha256sum -c -
            '
      - name: Scan the candidate before signing
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439
        with:
          image: ${{ steps.target.outputs.image }}@${{ steps.build.outputs.digest }}
          fail-build: true
          severity-cutoff: critical
          output-format: table
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.3
      - name: Sign the verified candidate digest
        env:
          IMAGE: ${{ steps.target.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - name: Record candidate identity (acceptance approval remains separate)
        env:
          IMAGE: ${{ steps.target.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          jq --arg image "$IMAGE" --arg digest "$DIGEST" --arg run "$GITHUB_RUN_ID" \
            --arg workflow "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '. + {image:$image,digest:$digest,publisher_run:$run,publisher_url:$workflow}' \
            context/release-source.json > native-worker-candidate.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-worker-candidate-${{ github.sha }}
          path: native-worker-candidate.json
          if-no-files-found: error
          retention-days: 30
