name: Artifact Runtime Regression
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: artifact-runtime-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  GO_VERSION: "1.27.2"
jobs:
  runtime:
    name: Artifact Runtime (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
        timeout-minutes: 12
        with:
          node-version: '22'
      - uses: ./.github/actions/setup-playwright-browser
        timeout-minutes: 14
        with:
          browser: ${{ matrix.browser }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Compile canonical Go runtime browser harness
        timeout-minutes: 4
        run: go test -c -o "$RUNNER_TEMP/pagebuild.test" ./internal/pagebuild
      - name: Run independent HTTPS runtime characterization
        timeout-minutes: 8
        env:
          CREWSHIP_TEST_RUNTIME_BINARY: ${{ runner.temp }}/pagebuild.test
        run: pnpm exec playwright test --config=playwright.artifact-runtime.config.ts --project=${{ matrix.browser }}
      - name: Verify Excalidraw public API integration
        timeout-minutes: 8
        run: |
          node scripts/prepare-board-assets.mjs
          pnpm exec playwright test --config=playwright.board-editor.config.ts --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        timeout-minutes: 3
        if: always()
        with:
          name: artifact-runtime-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: error

  production-workflow:
    name: Artifact and Board production Router workflows
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
        timeout-minutes: 12
        with:
          node-version: '22'
      - uses: ./.github/actions/setup-playwright-browser
        timeout-minutes: 14
        with:
          browser: chromium
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build the production frontend
        timeout-minutes: 10
        env:
          NEXTAUTH_SECRET: synthetic-artifact-browser-build-secret
        run: pnpm build
      - name: Exercise actual Router and migrated DB in Chromium
        timeout-minutes: 8
        env:
          CREWSHIP_ARTIFACT_WORKFLOW_BROWSER: '1'
          CREWSHIP_ARTIFACT_WORKFLOW_OUTPUT: ${{ runner.temp }}/artifact-production-workflow
          CREWSHIP_BOARD_MERMAID_BROWSER: '1'
          CREWSHIP_BOARD_MERMAID_OUTPUT: ${{ runner.temp }}/board-mermaid-workflow
        run: go test -tags 'artifact_workflow_browser board_mermaid_workflow_browser' ./internal/api -run '^(TestArtifactWorkflowBrowser|TestBoardMermaidWorkflowBrowser)$' -count=1 -timeout 6m
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        timeout-minutes: 3
        if: always()
        with:
          name: artifact-production-workflow
          path: |
            ${{ runner.temp }}/artifact-production-workflow/
            ${{ runner.temp }}/board-mermaid-workflow/
          if-no-files-found: error
