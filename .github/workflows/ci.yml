name: CI

on:
  # Manual re-trigger. Useful for cases where the original push's run
  # got stranded in `queued` (GitHub-hosted runner pool saturated, rare
  # but observed during peak hours). With workflow_dispatch the run
  # can be re-queued from the Actions tab or via:
  #   gh workflow run ci.yml --ref <branch>
  # without needing an empty commit.
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    # Skip CI on changes that can't affect lint/typecheck/build/test:
    # docs (Mintlify-rendered, separate pipeline), markdown reference
    # files, license/notices files, the GitHub issue templates, and
    # the wireframe HTML mocks. Code changes that *also* touch these
    # paths still trigger CI because GitHub treats paths-ignore as
    # "trigger if ANY changed file is outside the ignore list".
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.mdx'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.claude/**'
      - '.factory/**'
      - '.cloud/**'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.mdx'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.claude/**'
      - '.factory/**'
      - '.cloud/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default least-privilege. Individual jobs widen only when required.
permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"
  GO_VERSION: "1.26.6"

jobs:
  # ── Sentinel: reject leaked git merge-conflict markers ──
  #
  # Background (2026-05-21 incident): a literal `<<<<<<<` / `=======` /
  # `>>>>>>>` block landed inside a Go raw-string SQL query in
  # `internal/api/agent_config.go` and propagated to `main`. Go raw
  # strings don't parse their content so `go vet` / `golangci-lint` /
  # `gosec` all stayed green; the bug only surfaced as a runtime SQLite
  # "syntax error" on every `crewship ask` chat-resolve call. External
  # auditor caught it. This sentinel runs FIRST so a leaked marker fails
  # the whole CI pipeline immediately — cheaper signal than waiting for
  # downstream build / test / lint to maybe-find-it-maybe-not.
  #
  # Extension list is intentionally wide: Go raw strings, TS template
  # literals, MDX prose, YAML / JSON / SQL fixtures, shell scripts, and
  # Dockerfiles can all hide a marker that the language compiler /
  # parser accepts as valid syntax. If a new file extension lands in
  # the repo that could host an unparsed marker, extend this list.
  merge-conflict-markers:
    name: Reject leaked merge markers
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sentinel grep
        run: |
          set -euo pipefail
          # Pattern: line-anchored marker tokens. Anchored to start-of-
          # line so a literal `<<<<<<<` written deliberately in prose
          # (e.g. a doc page explaining merge conflicts) doesn't trip
          # the check unless it sits at column 0 like a real marker.
          if git grep -nE '^(<<<<<<< |=======$|>>>>>>> )' -- \
              ':!*.bak' \
              '*.go' '*.ts' '*.tsx' '*.mdx' '*.md' \
              '*.yaml' '*.yml' '*.sql' '*.json' '*.py' '*.sh' \
              'Dockerfile' 'Dockerfile.*'; then
            echo ""
            echo "✗ Found one or more leaked git merge-conflict markers."
            echo "  Open the file(s) above, resolve the conflict, stage the result, and commit."
            echo "  (If the literal string is intentional — e.g. inside a doc explaining merge conflicts — move it off column 0 or wrap it in a code fence with leading whitespace.)"
            exit 1
          fi
          echo "✓ No leaked merge-conflict markers found."

  # ── Shell unit tests ──
  # The shell we ship is as load-bearing as the Go, and harder to reason
  # about: dev.sh wedges a dev slot when a helper trips `set -e`, and two
  # blocks in security.yml decide whether a failed security scan closes its own
  # tracking issue and whether a reported vulnerability reddens the build.
  # Both had test files that no workflow ran, so both regressed unnoticed.
  # They run here.
  shell:
    needs: [merge-conflict-markers]
    name: Shell
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: AGENTS.md checkable invariants
        run: go run ./scripts/agents-invariants
      - name: dev.sh helpers
        run: bash scripts/dev-sh-test.sh
      - name: security.yml alert-issue + govulncheck allowlist logic
        run: bash scripts/security-yml-test.sh
      - name: deploy-dev.sh push_branch
        run: bash scripts/deploy-dev-test.sh
      - name: test-harness lib (binary resolution + preflight)
        run: bash scripts/test-harness-lib-test.sh
      - name: test-harness integrity (ShellCheck + helper calls)
        run: bash scripts/test-harness-integrity.sh
      - name: test-harness integrity negative test
        run: bash scripts/test-harness-integrity-test.sh
      # The per-PR gate's own runner: that it reports every suite's failure and
      # not just the last one's, and that the one suite whose verdict depends on
      # what the runner happens to contain reads the CLI's answers correctly.
      # Server-free — it drives the real scripts against stubs.
      - name: test-harness PR subset (aggregation + orphan-reap verdicts)
        run: bash scripts/test-harness-pr-subset-test.sh
      - name: claim-issue.sh (claim parsing + clone detection)
        run: bash scripts/claim-issue-test.sh
      - name: api-contract gate (budget arithmetic + pacing/advisory flags)
        run: bash scripts/api-contract-gate-test.sh
      # summary.py decides what counts as a finding and how many operations
      # were graded — the numbers the advisory exemption is judged on. Its
      # test file predates any workflow that ran it, which is the same
      # "green because nothing executed it" shape the steps above exist to
      # close.
      - name: api-contract summary classifier
        run: python3 scripts/api-contract/summary_test.py

      # Skip budget ratchet. `go test ./...` prints `ok` for a package whose
      # every test called t.Skip, so a skip is indistinguishable from a pass
      # in CI output — and nothing counted them, which made "skip it for now"
      # free and invisible. This fails only when the count RISES above
      # scripts/skip-budget.txt. Lives in the `shell` job because it is a
      # 2-second grep and this is where the other script gates already run;
      # no Go toolchain needed.
      - name: Skip budget (t.Skip ratchet)
        run: bash scripts/skip-budget.sh

      # The same shape as the ratchet above, one layer out: a green check that
      # never ran. CodeRabbit reports through a commit status, and when it hits
      # its review limit that status is `pass / Review rate limited` — visually
      # identical to `pass / Review completed` (#1580). scripts/review-status.sh
      # answers "was this actually reviewed?" from the posted bodies; this step
      # runs only its network-free classifier tests. It deliberately does NOT
      # gate the merge on a real review — whether a green CodeRabbit status may
      # block a merge is branch-protection policy and the repo owner's call.
      - name: review-status.sh (throttled vs reviewed classifier)
        run: bash scripts/review-status-test.sh

  # ── Per-PR control-plane harness ──
  # This is intentionally a small, explicit subset. Runtime suites that need
  # a provider key remain in nightly-harness.yml; they are listed there with
  # the reason they cannot be deterministic on an ordinary PR runner.
  harness-pr:
    needs: [merge-conflict-markers]
    name: Harness PR subset
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go-embed
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build server and CLI from this commit
        run: go build -o crewship ./cmd/crewship
      - name: Generate ephemeral instance secrets
        run: |
          set -euo pipefail
          nextauth="$(openssl rand -hex 32)"
          enckey="$(openssl rand -hex 32)"
          echo "::add-mask::$nextauth"
          echo "::add-mask::$enckey"
          {
            echo "NEXTAUTH_SECRET=$nextauth"
            echo "ENCRYPTION_KEY=$enckey"
          } >> "$GITHUB_ENV"
      #
      # ⚠ CREWSHIP_RATELIMIT_DISABLED is set HERE and nowhere else.
      #
      # It is scoped to this one step's environment on purpose: it is not
      # written to $GITHUB_ENV, not a job-level `env:`, and not a repo or
      # environment variable — so it reaches this throwaway server process
      # and nothing else. `scripts/api-contract-gate-test.sh` fails the
      # `shell` job if it ever appears outside this block.
      #
      # Why it is safe here and would not be anywhere else: this server is
      # hermetic (localhost, one client, deleted with the runner), so the
      # limiter is protecting it from the very gate that is testing it. In
      # production the flag cannot take effect at all —
      # goapi.MustNotDisableRateLimitInProd (internal/server/server.go)
      # panics at boot when CREWSHIP_ENV is prod/production. CI does not
      # set CREWSHIP_ENV, so this server is not classified as prod.
      #
      # Why it is needed: the contract gate below probes 231 read-only
      # operations x --max-examples 10, and Schemathesis paces what it
      # GENERATES (~8000 cases), not what it sends. Held to the shipped
      # 120 req/min that is a ~66-minute floor, inside a 30-minute job that
      # also has to build, boot, seed and run five harness suites (#1813).
      # No suite in this job asserts 429 behaviour, so nothing
      # here loses coverage by turning the limiter off — the limiter's own
      # tests are Go units in internal/api, and test-keeper-load.sh (which
      # does exercise throttling) is a nightly suite, not part of the PR
      # subset.
      - name: Start ephemeral server
        env:
          CREWSHIP_STORAGE_BASE_PATH: ${{ github.workspace }}/.crewship-data
          CREWSHIP_LOG_PATH: ${{ github.workspace }}/.crewship-logs
          CREWSHIP_BOLT_PATH: ${{ github.workspace }}/.crewship-data/state.db
          DATABASE_URL: file:${{ github.workspace }}/.crewship-data/crewship.db
          CREWSHIP_NEXTJS_URL: http://localhost:8080
          CREWSHIP_SKIP_SIDECAR: "1"
          CREWSHIP_RATELIMIT_DISABLED: "1"
        run: |
          set -euo pipefail
          mkdir -p "$CREWSHIP_STORAGE_BASE_PATH" "$CREWSHIP_LOG_PATH"
          ./crewship start >/tmp/crewship-pr-harness.log 2>&1 &
          echo $! >/tmp/crewship-pr-harness.pid
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null http://localhost:8080/healthz; then exit 0; fi
            sleep 1
          done
          cat /tmp/crewship-pr-harness.log >&2
          exit 1
      - name: Seed clean control-plane fixture
        env:
          CREWSHIP_SERVER: http://localhost:8080
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./crewship seed --skip-issues --server "$CREWSHIP_SERVER"; then exit 0; fi
            sleep 5
          done
          cat /tmp/crewship-pr-harness.log >&2
          exit 1
      - name: Run named PR harness subset
        env:
          CREWSHIP: ${{ github.workspace }}/crewship
          CREWSHIP_SERVER: http://localhost:8080
          SERVER: http://localhost:8080
          ASK_TIMEOUT: "90"
          POLL_TIMEOUT: "60"
          POLL_INTERVAL: "2"
          HARNESS_SUITE_TIMEOUT: "480"
        run: bash scripts/test-harness/pr-subset.sh
      - name: Install pinned API contract checker
        run: |
          set -euo pipefail
          python3 -m venv /tmp/crewship-api-contract-venv
          /tmp/crewship-api-contract-venv/bin/python -m pip install \
            --disable-pip-version-check --requirement scripts/api-contract/requirements.txt
      #
      # ⚠ INVARIANT: API_CONTRACT_TIMEOUT (seconds) < this step's
      #   timeout-minutes < the job's timeout-minutes. Enforced by
      #   scripts/api-contract-gate-test.sh; do not "tidy" them together.
      #
      # Same rule as the `go` job below, for the same reason: whoever wins
      # the race decides how debuggable the failure is. The job budget is
      # the worst possible winner here — GitHub reports a timeout-minutes
      # reap as `cancelled`, which is indistinguishable from a human
      # pressing stop, and it kills run.sh before its EXIT trap can write
      # the machine-readable verdict the next step uploads. Runs
      # 92801456298 and 92808010491 died exactly that way (#1813).
      #
      # So run.sh holds the innermost deadline and loses only to itself:
      # it stops Schemathesis at API_CONTRACT_TIMEOUT and exits with a
      # named runtime failure plus its summary artifact. The step cap is
      # the backstop if the script itself wedges before that.
      #
      # 600s is ~40x the measured cost of this step against an unthrottled
      # server: 15s for both phases on a runner, 13.3s of it inside
      # Schemathesis, for the same 231 operations (run 31165903601). It is
      # headroom, not a budget to grow into — if this phase ever needs more
      # than a couple of minutes, find out why before raising it.
      #
      # ⚠ ADVISORY, TEMPORARILY, AND ONLY FOR FINDINGS — see #1815.
      #
      # The `positive` phase runs, reports, uploads its evidence, and does
      # NOT fail this job. When the phase first became able to finish it
      # reported 265 findings across 227 graded operations — every one of
      # them pre-existing, most already tracked as #1583 (the generated
      # spec documents only 200) and #1489. They were invisible only
      # because the phase had never once completed, so blocking on them
      # would fail PRs that did not cause them and cannot fix them.
      #
      # What this does NOT excuse, and must never be widened to: a server
      # that will not boot, a schema that will not load, a Schemathesis
      # crash, or a blown deadline. Those all still fail the job. That is
      # why the exemption is a flag run.sh interprets — it passes only on
      # "exit 1 AND the JUnit report shows operations were graded" — and
      # NOT `continue-on-error`, which would excuse the lot and turn a gate
      # into decoration. scripts/api-contract-gate-test.sh fails the build
      # if that line moves.
      #
      # Remove this env var when #1815 closes. Until then the count is
      # printed in this step's log and in the job summary, so the debt is
      # read every run rather than filed away in an artifact.
      - name: Run deterministic API contract gate
        timeout-minutes: 12
        env:
          CREWSHIP_BASE_URL: http://localhost:8080
          API_CONTRACT_ARTIFACT_DIR: ${{ github.workspace }}/api-contract-artifacts
          API_CONTRACT_TIMEOUT: "600"
          API_CONTRACT_ADVISORY: "1"
          # No client-side pacing: the server above boots with its limiter
          # off, so there is nothing to stay under. Only valid paired with
          # CREWSHIP_RATELIMIT_DISABLED on the same job's server — against
          # a limited instance this buys 429s reported as contract
          # failures, not speed. The pairing is a tested invariant.
          API_CONTRACT_RATE_LIMIT: "off"
        run: |
          set -euo pipefail
          tok="$(./crewship token create api-contract-pr --quiet)"
          echo "::add-mask::$tok"
          ws="$(./crewship whoami --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["workspace"]["id"])')"
          export CREWSHIP_TOKEN="$tok" CREWSHIP_WORKSPACE="$ws"
          export PATH="/tmp/crewship-api-contract-venv/bin:$PATH"
          bash scripts/api-contract/run.sh auth
          bash scripts/api-contract/run.sh positive
      - name: Upload API contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-contract-${{ github.run_id }}
          path: api-contract-artifacts/
          if-no-files-found: warn
      - name: Dump server log on failure
        if: failure()
        run: tail -300 /tmp/crewship-pr-harness.log || true
      - name: Stop ephemeral server
        if: always()
        run: |
          set -uo pipefail
          [ -f /tmp/crewship-pr-harness.pid ] && kill "$(cat /tmp/crewship-pr-harness.pid)" 2>/dev/null || true

  # ── CLI breadth contract ──
  cli-command-smoke:
    needs: [merge-conflict-markers]
    name: CLI command breadth smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go-embed
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build CLI from this commit
        run: go build -o crewship ./cmd/crewship
      - name: Run C1 command breadth smoke
        run: bash scripts/cli-command-smoke.sh
      - name: Run C2 exit-code contract
        run: bash scripts/cli-exit-code-contract.sh

  # ── Per-PR browser smoke ──
  # Five deterministic checks are selected in playwright.pr.config.ts. The
  # provider-backed chat send/receive path and the remaining specs stay in the
  # explicit nightly buckets; they are not silently treated as PR coverage.
  playwright-pr:
    needs: [merge-conflict-markers]
    name: Playwright PR subset
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go-embed
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - name: Build web UI and CLI from this commit
        run: |
          set -euo pipefail
          pnpm build
          ./scripts/embed-web-out.sh sync
          go build -o crewship ./cmd/crewship
      - name: Generate ephemeral instance secrets
        run: |
          set -euo pipefail
          nextauth="$(openssl rand -hex 32)"
          enckey="$(openssl rand -hex 32)"
          echo "::add-mask::$nextauth"
          echo "::add-mask::$enckey"
          {
            echo "NEXTAUTH_SECRET=$nextauth"
            echo "ENCRYPTION_KEY=$enckey"
          } >> "$GITHUB_ENV"
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start ephemeral browser server
        env:
          CREWSHIP_STORAGE_BASE_PATH: ${{ github.workspace }}/.crewship-data
          CREWSHIP_LOG_PATH: ${{ github.workspace }}/.crewship-logs
          CREWSHIP_BOLT_PATH: ${{ github.workspace }}/.crewship-data/state.db
          DATABASE_URL: file:${{ github.workspace }}/.crewship-data/crewship.db
          CREWSHIP_NEXTJS_URL: http://localhost:8080
          CREWSHIP_SKIP_SIDECAR: "1"
        run: |
          set -euo pipefail
          mkdir -p "$CREWSHIP_STORAGE_BASE_PATH" "$CREWSHIP_LOG_PATH"
          ./crewship start >/tmp/crewship-pr-playwright.log 2>&1 &
          echo $! >/tmp/crewship-pr-playwright.pid
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null http://localhost:8080/healthz; then exit 0; fi
            sleep 1
          done
          tail -300 /tmp/crewship-pr-playwright.log >&2
          exit 1
      - name: Seed browser fixture
        env:
          CREWSHIP_SERVER: http://localhost:8080
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./crewship seed --server "$CREWSHIP_SERVER"; then exit 0; fi
            sleep 5
          done
          tail -300 /tmp/crewship-pr-playwright.log >&2
          exit 1
      - name: Give browser fixture deterministic API headroom
        env:
          CREWSHIP_SERVER: http://localhost:8080
        run: |
          set -euo pipefail
          ws="$(./crewship whoami --format json --server "$CREWSHIP_SERVER" | jq -r '.workspace.id')"
          CREWSHIP_WORKSPACE="$ws" ./crewship admin ratelimits set http.api_per_min 1000 --server "$CREWSHIP_SERVER"
      - name: Run named Playwright PR subset
        env:
          CI: "1"
          PLAYWRIGHT_BASE_URL: http://localhost:8080
          E2E_EMAIL: demo@crewship.ai
          E2E_PASSWORD: password123
          CREWSHIP_INSTANCE_ID: pr-playwright
        run: pnpm exec playwright test --config=playwright.pr.config.ts
      - name: Upload Playwright PR evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-pr-${{ github.run_id }}
          path: |
            playwright-pr-report.json
            test-results/
          if-no-files-found: warn
      - name: Dump browser server log on failure
        if: failure()
        run: tail -300 /tmp/crewship-pr-playwright.log || true
      - name: Stop browser server
        if: always()
        run: |
          set -uo pipefail
          [ -f /tmp/crewship-pr-playwright.pid ] && kill "$(cat /tmp/crewship-pr-playwright.pid)" 2>/dev/null || true

  # ── Frontend: lint, typecheck, build ──
  frontend:
    needs: [merge-conflict-markers]
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      # Cache Next.js incremental build artifacts. actions/checkout cleans
      # the workspace each run (clean: true is the default), so .next/cache
      # would otherwise be cold every time and Turbopack would re-parse the
      # entire app — typically 60-90s wasted per push. Restore-keys fall
      # back to the most recent build with the same lockfile, which Next
      # then upgrades incrementally based on changed source files.
      - name: Cache .next build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Build static export
        run: pnpm build
        env:
          NEXTAUTH_SECRET: "ci-build-secret-not-real"

      - name: Upload static export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nextjs-static-export
          path: out/
          retention-days: 1

  # ── Frontend tests (Vitest) ──
  frontend-test:
    needs: [merge-conflict-markers]
    name: Frontend Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      # Coverage, not a bare test run: vitest exits non-zero when the
      # thresholds in vitest.config.ts are not met, which is what makes
      # that gate real rather than decorative.
      - name: Test
        run: pnpm test:coverage

      - name: Upload coverage (lcov)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  # ── Go: vet, build, test ──
  go:
    needs: [merge-conflict-markers]
    name: Go
    runs-on: ubuntu-latest
    #
    # ⚠ INVARIANT: timeout-minutes MUST stay comfortably ABOVE
    #   (pre-test step time) + (the `go test -timeout` below).
    # Do not "tidy" these two numbers back into agreement.
    #
    # They used to both be 15, and the arithmetic never worked. Measured
    # on run 30540606982 (a job that PASSED, at 14m39s of a 15m budget):
    #
    #   setup (job + checkout + setup-go)   9s
    #   Go vet                             66s
    #   Go build                            6s
    #   windows clionly cross-compile      59s
    #   clionly host-OS build               5s
    #   windows full-daemon cross-compile   8s
    #   ---------------------------------------
    #   pre-test overhead              2m 33s
    #   Go test                       12m 02s
    #
    # So the job cap left only 12m27s of usable test time while
    # `go test -timeout 15m` promised 15m. The Go timeout was
    # arithmetically unreachable: GitHub's cancel always fired first.
    # That is the worst possible failure mode, because GitHub's cancel
    # prints `##[error]The operation was canceled.` with every package
    # already showing `ok` and NO indication of which test was still
    # running — whereas Go's own timeout panics with a full goroutine
    # dump naming the culprit. PRs #1531 (15m07s) and #1537 (15m15s)
    # both died this way with nothing actionable in the log.
    #
    # Whoever wins the race decides how debuggable the failure is, so
    # Go must always win. Budget below keeps ≥5 min of daylight between
    # (overhead + go test -timeout) and this cap.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go-embed
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build ./cmd/crewship

      # #945/#946 — Windows port regression gates: the clionly CLI and the
      # full daemon must both stay windows-clean. The tracked
      # web/out/.placeholder.html satisfies the embed for the full build (#1567).
      - name: Go build (windows clionly cross-compile)
        run: GOOS=windows GOARCH=amd64 go build -tags clionly ./cmd/crewship

      # Host-OS clionly build: the Windows step proves the clionly graph
      # compiles for GOOS=windows, but a break scoped to the unix side of
      # a build-tag split would only surface at the nightly goreleaser
      # snapshot. Costs seconds — the build cache is already warm.
      - name: Go build (clionly, host OS)
        run: go build -tags clionly ./cmd/crewship

      # #946 — the full daemon must stay windows-clean too (IPC/hooks/docker
      # detection/self-update all have OS branches). The tracked
      # web/out/.placeholder.html satisfies the embed for the full build (#1567).
      - name: Go build (windows full-daemon cross-compile)
        run: GOOS=windows GOARCH=amd64 go build ./...

      # Used to exclude internal/api and run it as its own job (`go-api`),
      # because it was the single slowest package and floored this step's
      # wall clock — `go test` parallelises across packages up to -p (= 4
      # here), so the wall clock is floored by the slowest single package.
      # Measured per-package times from run 30540606982 (ubuntu-latest, 4
      # vCPU, 12m02s wall for this step, 104 packages with tests, 1988.7s of
      # CPU in total):
      #
      #   internal/api          378.7s   ← 52% of the wall clock on its own
      #   internal/backup       269.1s
      #   internal/server       266.0s
      #   internal/database     237.6s
      #   cmd/crewship          168.0s
      #   internal/consolidate   99.0s
      #
      # PR #1547 (perf/shared-migrated-test-db) removed the cause at its
      # source: hoisting migratedTemplateOnce into internal/testutil across
      # 23 packages so they stop re-running all 155 migrations per test.
      # Measured there: 1205.6s → 195.3s (6.2x) for the packages it touches;
      # internal/api specifically 378.7s → 62.2s.
      #
      # RE-MEASURED on this branch after #1547 (GOMAXPROCS=4, -p=4, to
      # emulate this job's 4-vCPU runner; local Apple Silicon box under real
      # contention from other concurrent agents — load average 5.5-9.3
      # across these runs, so treat as a range, not a single number; the
      # comparison that matters is relative, not absolute):
      #
      #   internal/api alone            64-77s   (3 back-to-back runs)
      #   everything else (107 pkgs)    83-87s   (2 back-to-back runs)
      #
      # internal/api is no longer the floor — the rest of the suite now
      # matches or exceeds it on its own. The entire reason to shard it out
      # is gone, so `go-api` is deleted and internal/api runs here again,
      # saving a full job's worth of checkout+setup-go overhead per run. If
      # a future package regresses to where it re-floors the suite,
      # re-measure with this same method (isolate the candidate vs. the
      # rest, back-to-back, noting load average) before re-splitting.
      #
      # Execution order stays SOURCE ORDER here, deliberately. -shuffle=on
      # lives in the non-blocking `go-shuffle` job below; see that job for
      # why it is not on the blocking gate yet.
      - name: Go test
        run: go test ./... -count=1 -timeout 12m

  # ── Go: shuffled execution order ──
  #
  # -shuffle=on randomises test order within each package. This suite has
  # ~206 time.Sleep calls in tests, a lot of shared on-disk SQLite fixtures,
  # and — the real problem — package-level globals that outlive a single
  # test. Fixed source order hides all of that permanently.
  #
  # SCOPE IS NOW THE WHOLE SUITE. The two packages this job used to exclude —
  # cmd/crewship and internal/api — were fixed and the skip list is empty, so
  # a red X here means a NEW order dependency, never known wallpaper.
  #
  # What was excluded, and what it turned out to be (kept because the shapes
  # recur, and because "the failing test is never the guilty one" is the whole
  # lesson of this job):
  #
  #  A. cmd/crewship — up to 58 failing top-level tests per seed. Cobra binds
  #     --format & co. to package-level variables and the root PersistentPreRun
  #     blanks internal/cli's colour palette; a CLI process runs one command and
  #     exits, a test binary runs ~3,000 in one process. Fix: every test is
  #     handed the process's start-of-day state back — CLI globals, the colour
  #     palette, and every Cobra flag's value AND its Changed bit (144 places
  #     branch on Changed, and putting a flag back with Flags().Set leaves
  #     Changed=true forever). See cmd/crewship/clistate_test.go.
  #
  #  B. internal/api — two separate ones. ENCRYPTION_KEY was installed by
  #     whichever test called setTestEncryptionKeyParallelSafe first, so
  #     fixtures that encrypt without asking (webhook signing secrets,
  #     crew-template deploy) worked only when they sorted after it; TestMain
  #     now installs it before any test. And defaultCapabilityCache is a
  #     process-wide singleton keyed on the CONSTANT ids seedTestUser /
  #     seedTestWorkspace hand every test, so a capability answer computed
  #     against one test's database was served to the next one's router;
  #     setupTestDB now clears it, since a fresh database deserves a cache that
  #     knows nothing about the previous one.
  #
  # Verified before the exclusions were dropped: cmd/crewship green on 13
  # distinct seeds (including 1785429252149193000, which failed 15 tests
  # before), internal/api green on 10 (including 11 and 22, which failed
  # before). Order-dependence is not proven absent by any number of seeds —
  # which is exactly why this job runs a fresh random one every push.
  #
  # Still `continue-on-error`, and the reason is honest rather than convenient:
  # a randomised gate earns "blocking" by being green over time, not by being
  # green in the PR that fixed it. The known findings are closed, so this is
  # now a soak, not a workaround.
  #
  # ➜ TO PROMOTE TO BLOCKING: after a handful of consecutive green runs on
  #   main, delete `continue-on-error`. The end state is -shuffle=on folded
  #   back into `go` and this job deleted, since shuffling costs no extra
  #   wall-clock.
  go-shuffle:
    needs: [merge-conflict-markers]
    name: Go Shuffle
    runs-on: ubuntu-latest
    continue-on-error: true
    # Same invariant as `go`: cap MUST exceed overhead + `go test -timeout`
    # so Go's goroutine dump wins over GitHub's opaque cancel. Measured at
    # 11m52s for the full suite (job 90889450094) back when internal/api and
    # cmd/crewship were excluded AND still cost 379s/168s; #1547 cut both, and
    # they are back in scope, so the headroom is roughly unchanged.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go-embed
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go test (shuffled)
        # go test prints the chosen seed per package as `-test.shuffle N`.
        # To reproduce a failure from this job's log:
        #   go test ./internal/<pkg> -count=1 -shuffle=<seed>
        # Reproducing needs the WHOLE package — the dependency is on other
        # tests in it, so narrowing with -run will make it pass. That is the
        # tell that you are looking at shared state, not a broken assertion.
        run: |
          set -euo pipefail
          # No skip list any more: every package is shuffled. Resist adding
          # one back. A package parked here silently loses order-dependence
          # coverage, and the state that caused it goes on leaking into
          # whichever test is unlucky — which is the failure mode this job
          # exists to surface, not to route around.
          n="$(go list ./... | grep -c .)"
          # Guard against the list collapsing, same as the `go` job: `go test`
          # with zero packages exits 0, so a truncated list would look like a
          # full green run.
          if [ "$n" -lt 90 ]; then
            echo "::error::go list returned only $n packages — expected ~108. Refusing to report a pass on a truncated package list."
            exit 1
          fi
          echo "Shuffling all $n packages."
          go test ./... -count=1 -shuffle=on -timeout 15m

  # ── Go: race detector ──
  #
  # Deliberately a SEPARATE job rather than a -race flag bolted onto the `go`
  # job above: the race build is much slower, and when a race does fire you
  # want to see "Go Race red, Go green" in the checks list, not one ambiguous
  # red Go job that might be a compile error, a logic failure, or a race.
  #
  # Why this gate at all: Crewship is an orchestrator. Concurrent state is
  # not incidental to it — the WS hub fans out to subscribers, the keeper
  # dedups across goroutines behind a mutex, lease acquisition races a SQL
  # UPDATE, and routines spawn detached background workers that outlive the
  # request. The test suite calls t.Parallel() ~2434 times, so it already
  # generates the concurrency a detector needs. Sixteen Go files even carry
  # a "run with -race" comment — the discipline existed, but only as a
  # habit, and habits do not block merges. Nothing in CI passed -race, so
  # any race that landed stayed landed until it flaked in production.
  #
  # ── Why this now runs a DENY-list, not an allow-list ──
  #
  # It used not to fit. `go test ./... -race` on this suite was tried twice
  # pre-#1547, both cancelled at their cap with most packages unreported:
  #
  #   40m cap, all 108 packages (job 90877558841): 14 packages reported.
  #     cmd/crewship, internal/api, internal/auth/sessions and
  #     internal/backup had each burned the full 25m per-binary timeout in
  #     parallel — `panic: test timed out after 25m0s` x4.
  #   25m cap, 101 packages (job 90889450207): 31 reported, 0 races, still
  #     running inbox/governance/notifyroute/pipeline when cancelled.
  #
  # The cause was not the race detector being "2-3x slower" — that estimate
  # was wrong. The real multiplier on DB-fixture packages was 10-30x, because
  # every test re-ran all 155 migrations and instrumentation compounded it.
  # Measured pairs, CI non-race (run 30540606982) vs local -race:
  #
  #   internal/keeper/governance    31.5s  →   962.5s   (30x)
  #   internal/inbox                35.9s  →   789.8s   (22x)
  #   internal/notifyroute          79.5s  →  1111.2s   (14x)
  #
  # A deny-list could not work at those numbers: the default (everything
  # runs unless excluded) was "too slow", full stop. That is why this job
  # first shipped as a hand-picked 19-package ALLOW-list instead.
  #
  # PR #1547 (perf/shared-migrated-test-db) removed the multiplier at its
  # source: hoisting the migration-template build into internal/testutil so
  # 23 packages stop re-running all 155 migrations per test. RE-MEASURED on
  # this branch (GOMAXPROCS=4, -p=4, to emulate this job's 4-vCPU runner;
  # local box under real contention from other concurrent agents — treat as
  # an upper bound, not a precise figure):
  #
  #   internal/keeper/governance    26.8s   (was 962.5s — multiplier gone)
  #   internal/inbox                27.2s   (was 789.8s)
  #   internal/notifyroute          29.8s   (was 1111.2s)
  #   internal/auth/sessions      29-33s    (was ~1500s per the original PR)
  #
  # With the multiplier gone, `go test ./... -race` was re-tried in full —
  # 105 of 108 packages at the time, 106 of 108 now that internal/api is
  # fixed and back in (cmd/crewship went back in too and came out again —
  # see the deny-list note and #1610) — and it PASSES, 0 races,
  # locally in 322s wall clock under heavy contention. So the polarity
  # flips: a short, justified deny-list is now affordable, and it closes the
  # allow-list's real weakness — a new package silently getting NO coverage.
  #
  # ⚠ THE LOCAL NUMBER WAS WRONG FOR internal/backup, and CI is what caught
  # it. This job's own first run on this PR timed out at -timeout 10m with
  # internal/backup still running (goroutine dump: TestBackupRestore_
  # MemoryBlobsRoundTrip, deep in age.Encrypt → scrypt.Key), against a local
  # measurement of 240.4s. Two packages measured on both sides bracket the
  # gap: internal/server 51.0s local → 183.7s on CI (3.6x); internal/
  # auth/sessions 23.4s local → 73.3s on CI (3.1x). backup is disproportionate
  # even by that ratio, because it is not mutex/goroutine-bound like those
  # two — the passphrase path runs scrypt (age.NewScryptRecipient, N=2^18,
  # a ~256MiB working set by design), and -race's shadow-memory check on a
  # memory-hard, cache-hostile KDF is a worse tax than on typical code. At
  # 3.1-3.6x, backup should need roughly 600-660s of CI wall clock — right at
  # the 10m boundary it hit — but that ratio is calibrated on different code
  # shapes, so treat it as a floor, not a promise.
  #
  # -timeout bumped to 20m (below) on that estimate: roughly 2x the
  # extrapolated need, not a guess pulled from nowhere, but still provisional
  # until a CI run actually clears it. If 20m is not enough either, the next
  # step is a second deny-list entry for internal/backup with whatever real
  # number that run reports — not a further bump, since a package whose
  # -race cost is dominated by a fixed-cost KDF rather than fixture setup
  # doesn't get faster with more retries the way the #1547 packages did.
  #
  # ── #1553: the estimate was still short, and the fix is a shard ──
  #
  # #1553 fixed the races that had internal/api and cmd/crewship excluded and
  # put both back in. internal/api stayed; cmd/crewship did not — running it
  # under -race against a later main surfaced a DIFFERENT race, in the test
  # helper rather than the client (#1610), so it is back in the deny-list
  # with that pointer. The measurements below still stand, since they are
  # about cost rather than correctness, and they are the reason the shard
  # exists. The first run with both in produced REAL numbers for
  # every package that matters here (job 90981983760), which is what the
  # 3.1-3.6x extrapolation above was standing in for:
  #
  #   package             local -race    CI -race     ratio
  #   internal/backup         193.1s      726.9s      3.76x   ok
  #   cmd/crewship            325.3s     1102.8s      3.39x   ok, 8% headroom
  #   internal/api            519.4s     >1200s        n/a    KILLED at -timeout
  #
  # internal/api hit the 20m per-binary timeout. There is no tuning lever
  # hiding in it either — only 502 of its 5263 tests call t.Parallel(), so it
  # is ~90% serial and a wider -parallel buys nothing on a 4-vCPU runner. It
  # is simply a very large package.
  #
  # So it gets its own job (go-race-api) with its own budget, running in
  # parallel with this one — the same shape #1548 used to split go-api out of
  # go. It is NOT excluded: race-testing it in a shard covers it exactly as
  # well, it just stops one outlier package from setting the timeout for the
  # other 106. The two lists below are deliberately separate files so that
  # distinction is structural rather than a comment someone can skim past.
  #
  # ── What the split actually measured (job 30577789512) ──
  #
  # The 3.4-3.8x extrapolation said internal/api would need 29-33 minutes.
  # It needs 17.6. The ratio was calibrated on packages measured while four
  # test binaries shared 4 vCPUs; alone in its own job, internal/api gets all
  # four, and CONTENTION, not raw runner speed, turns out to be most of what
  # the multiplier was capturing. Splitting it out sped up everything else
  # for the same reason:
  #
  #   package             before split   after split
  #   internal/api            >1200s       1056.5s   (was killed at 20m)
  #   cmd/crewship            1102.8s       940.9s
  #   internal/backup          726.9s       565.5s
  #   internal/server          217.7s       180.0s
  #   go-race wall clock       24m38s       17m53s   (+19m41s in parallel)
  #
  # Treat that as a warning about the ratio, not a licence to pack more back
  # in: it is a property of how many binaries are competing, so it moves
  # every time the package set does.
  #
  # cmd/crewship stays here, but -timeout goes 20m → 25m. At 1102.8s it had
  # cleared the old cap by 97 seconds, which is not headroom, it is luck; the
  # next PR that added tests to that package would have turned this gate red
  # for a reason that has nothing to do with a race. 25m is ~1.6x its 940.9s.
  #
  # ── The 1 exclusion ──
  #
  # internal/database is excluded STRUCTURALLY, not temporarily. It is the
  # package containing the migration engine that internal/testutil wraps, so
  # it cannot import internal/testutil without a cycle — #1547's fix cannot
  # reach it. Its ~190 top-level tests each run a real (often full-chain)
  # Migrate(), which under -race is exactly the per-migration cost #1547
  # eliminated everywhere else. Measured directly: with -timeout 10m it times
  # out mid-suite (stuck on TestMigrateV102_KeeperPhase2); given 20 minutes
  # instead, it only reaches TestMigrateV144 before timing out again — each
  # later migration test replays a longer prefix chain, so the per-test cost
  # is super-linear and full completion is a 30+ minute package on its own.
  # Not a fit for a per-PR gate; a dedicated long-budget job would be a
  # separate, deliberate follow-up, not a default inclusion here.
  #
  # ── The 1 shard ──
  #
  # internal/api is race-tested by the go-race-api job below, not here, for
  # the runtime reason above and for NO other reason. It is covered. Do not
  # read its absence from this job as "that package has known races" — it
  # had two, they were fixed in #1553, and internal/cli/client_concurrency_
  # test.go plus the joins in mcp_registry_cov_test.go hold them fixed.
  #
  # internal/api and cmd/crewship WERE excluded from race coverage entirely,
  # for real data races. Both are fixed and both are covered again:
  #   internal/api — test-only, two root causes. Tests swapped the package
  #     global mcpRegistryURL and restored it from t.Cleanup while the
  #     detached goroutine MCPRegistryHandler.Sync spawns was still reading
  #     it; and TestRecurringIssueCreate_NextRunIsUTC assigned time.Local,
  #     which every time.Now() in the binary reads, including the background
  #     goroutines other tests leave running. Fixed by joining the sync
  #     goroutine on its terminal log record, and by getting the non-UTC zone
  #     from a TZ-set child process instead of writing the global.
  #   cmd/crewship — NOT a test bug. internal/cli.(*Client).resolveWorkspaceID
  #     memoised into two unguarded Client fields, and `crewship diff`, `me`,
  #     `today`, `now`, `history` and the TUI all fan out over ONE client, so
  #     every real invocation of those commands raced. The tests were only the
  #     messenger. Fixed by moving the memo behind a shared, mutex-guarded
  #     wsResolveState. Regression test: internal/cli/client_concurrency_test.go.
  #
  # Either list rots silently if unchecked — a renamed or removed package
  # would just vanish from its effect, and in the shard's case would take its
  # coverage with it while both jobs stayed green. The step below fails if
  # any entry in either list stops resolving against `go list ./...`.
  go-race:
    needs: [merge-conflict-markers]
    name: Go Race
    runs-on: ubuntu-latest
    # BLOCKING, with no continue-on-error. A red run means a race landed —
    # or a package belongs on the exclusion list above, held to the same
    # justification bar as the one already there (structural incompatibility,
    # not "it's slow" and not "the race is inconvenient to fix").
    #
    # Same invariant as the `go` job: cap MUST exceed overhead + the
    # `go test -timeout` below, so Go's goroutine-dumping panic wins the
    # race against GitHub's opaque cancel. -timeout is 25m; overhead is
    # ~2.5 min of checkout + setup-go + race-compiling the dependency graph
    # (measured on job 90981983760: script start 19:33:23, first binary
    # under way by ~19:36). 35m clears 25m + overhead with room.
    #
    # Whole job measures 17m53s with the shard split out, slowest binary
    # cmd/crewship at 940.9s. The 25m -timeout is ~1.6x headroom for that
    # one package, not an expectation.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go-embed
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go test (race)
        # No -shuffle here on purpose: `go-shuffle` owns order-dependence
        # detection. Keeping this job's ordering fixed means a race report
        # is reproducible from the log without also having to replay a seed.
        run: |
          set -euo pipefail
          # Two lists, two different meanings — kept as separate files so
          # nobody has to infer the difference from a comment:
          #
          #   race-deny.txt  → NOT race-tested anywhere. Needs the
          #                    structural justification in the job comment.
          #   race-shard.txt → race-tested, by the go-race-api job. Covered,
          #                    just not from this binary's timeout budget.
          #
          # cmd/crewship was the second deny entry and is back under -race
          # as of #1610. It was a real race, not a cost exclusion, and
          # putting the package under -race is what found it: resetCLIState
          # (clistate_test.go) restores process-wide CLI globals from
          # t.Cleanup while a parallel test reads them through
          # shellPromptString. Exactly one of the package's 189 parallel
          # tests reached a state-mutating helper, so the fix was to make
          # that one serial; clistate_parallel_guard_test.go now fails the
          # build if the pairing comes back.
          #
          # A stale entry in either (renamed/removed package) fails loudly
          # rather than silently covering less than the comment claims.
          denyfile="${RUNNER_TEMP:-/tmp}/race-deny.txt"
          cat > "$denyfile" <<'DENY'
          github.com/crewship-ai/crewship/internal/database
          DENY
          shardfile="${RUNNER_TEMP:-/tmp}/race-shard.txt"
          cat > "$shardfile" <<'SHARD'
          github.com/crewship-ai/crewship/internal/api
          SHARD
          nheld="$(cat "$denyfile" "$shardfile" | grep -c .)"
          total="$(go list ./... | grep -c .)"
          pkgs="$(go list ./... | grep -Fxv -f "$denyfile" | grep -Fxv -f "$shardfile")"
          n="$(printf '%s\n' "$pkgs" | grep -c .)"
          # Every entry must remove exactly one real package. If the count
          # doesn't balance, either an entry is stale (a rename silently
          # re-includes a known-bad package, or silently drops a sharded one
          # from BOTH jobs) or `go list` collapsed — which would otherwise
          # look like a truncated-but-green run, the uncounted-t.Skip
          # failure mode again.
          if [ "$((total - n))" -ne "$nheld" ]; then
            echo "::error::race lists hold back $((total - n)) packages but have $nheld entries. One is stale — reconcile against 'go list ./...'."
            cat "$denyfile" "$shardfile"
            exit 1
          fi
          echo "Race-testing $n of $total packages (2 excluded, 1 sharded to go-race-api; see job comment)."
          # -timeout 25m per test binary. Was 20m, which cmd/crewship
          # cleared by only 97 seconds (1102.8s then, 940.9s now that the
          # shard is not competing for the same 4 vCPUs) — that was luck,
          # not headroom. Everything here except cmd/crewship and
          # internal/backup finishes in under two minutes, so this is
          # generosity for two packages, not a general bump. It only ever
          # bounds a hang, and a hang here should produce Go's goroutine
          # dump rather than a GitHub cancel.
          # shellcheck disable=SC2086
          go test $pkgs -race -count=1 -timeout 25m

  # ── Go race: the internal/api shard ──
  #
  # Same gate, one package, its own budget. internal/api is ~90% serial
  # (502 t.Parallel calls across 5263 tests) and simply large: 519.4s local
  # under -race, 1056.5s here. Sharing go-race's per-binary timeout meant
  # either that job carried a 30m+ cap for all 107 packages or internal/api
  # died at 20m — it died at 20m (job 90981983760).
  #
  # Splitting it out is the shape #1548 used for go-api, and it costs
  # nothing in wall clock: this runs in parallel with go-race, so the PR's
  # critical path is max(the two), not the sum — and in practice it went
  # DOWN, because the four binaries left in go-race stopped competing with
  # this one for the same 4 vCPUs (see the table in go-race's comment).
  #
  # This job existing is what lets internal/api stay OFF the deny-list.
  # If it is ever deleted, internal/api loses race coverage silently —
  # go-race's list guard will not catch that, because from its side the
  # package is legitimately held back either way.
  go-race-api:
    needs: [merge-conflict-markers]
    name: Go Race (internal/api)
    runs-on: ubuntu-latest
    # BLOCKING, same as go-race. Same cap invariant too: 40m > 30m
    # -timeout + ~3 min overhead, so Go's goroutine dump wins over
    # GitHub's opaque cancel.
    #
    # Measured, not extrapolated: 1056.5s (17.6m) for the binary, 19m41s
    # for the job, on this job's first green run. 30m is ~1.7x that — the
    # same ratio go-race gives cmd/crewship, and enough that ordinary
    # growth in the repo's largest package does not turn this red for a
    # reason unrelated to any race.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go-embed
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go test (race, internal/api)
        # No -shuffle, for the same reason as go-race: go-shuffle owns
        # order-dependence, and a fixed order keeps a race report
        # reproducible from the log without replaying a seed.
        run: |
          set -euo pipefail
          pkg=github.com/crewship-ai/crewship/internal/api
          # The shard is only coverage if the package it names still
          # exists. A rename would otherwise leave this job green and
          # testing nothing, while go-race keeps holding the old path back.
          #
          # `go list` into a variable, NOT through a pipe into `grep -q`.
          # `-q` exits at the first match, the producer then takes SIGPIPE,
          # and under `pipefail` that makes the pipeline non-zero — so the
          # guard fired precisely BECAUSE the package resolved, and early
          # enough in the list that grep left while `go list` was still
          # writing. It read as "this shard is testing nothing" on a tree
          # where every other Go job compiled the same module, and it was
          # timing-dependent, so a re-run usually buried it.
          #
          # Assigning first also makes a REAL `go list` failure abort the
          # step through `set -e`, with go's own message, instead of being
          # relabelled as a stale shard entry.
          pkgs="$(go list ./...)"
          if ! printf '%s\n' "$pkgs" | grep -Fxq "$pkg"; then
            echo "::error::$pkg does not resolve against 'go list ./...'. This shard is testing nothing — reconcile it and go-race's race-shard.txt together."
            exit 1
          fi
          go test "$pkg" -race -count=1 -timeout 30m

  # ── Go: cross-platform test matrix ──
  #
  # The linux/amd64 `go` job above is the primary gate; this matrix closes
  # the two release-coverage gaps the CLI audit flagged: darwin binaries
  # shipped without `go test` ever running on macOS (the post-release smoke
  # test only runs `crewship version`), and no arm64 runtime coverage
  # existed at all (goreleaser cross-BUILDS linux/darwin arm64, but nothing
  # executed the code). macos-14 and ubuntu-24.04-arm are both arm64, so
  # together with the amd64 job all four released GOOS/GOARCH combos get
  # compile coverage and three get runtime coverage. Docker-dependent tests
  # skip themselves when no daemon is present (macOS runners have none).
  go-platforms:
    needs: [merge-conflict-markers]
    name: Go (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-14
          - name: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go-embed
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go build
        run: go build ./cmd/crewship

      - name: Go test
        # -short would defeat the purpose; run the full suite. 20m test
        # timeout mirrors the amd64 job's headroom — macOS runners are
        # slower than ubuntu for the SQLite-heavy internal/api package.
        run: go test ./... -count=1 -timeout 20m

  # ── Go lint: golangci-lint ──
  go-lint:
    needs: [merge-conflict-markers]
    name: Go Lint
    runs-on: ubuntu-latest
    # 15 min: same calculus as the Go job above. golangci-lint
    # itself runs in ~30s with the cached binary; the rest of the
    # budget is one-time cold-cache buffer.
    timeout-minutes: 15
    env:
      GOLANGCI_VERSION: v2.1.6
    steps:
      # fetch-depth: 0 (rather than the default shallow depth-1 clone) so
      # the tsformat proximity-lint step below can resolve origin/main and
      # diff against it — same reasoning as migration-lint.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-go-embed
        with:
          go-version: ${{ env.GO_VERSION }}

      # Cache the golangci-lint binary itself — `go install` from source
      # adds ~30s per run and the resulting binary is fully determined by
      # (runner OS, Go version, golangci-lint version). Cache miss falls
      # through to the install step below.
      - name: Resolve GOPATH/bin
        id: gopath
        shell: bash
        run: echo "bin=$(go env GOPATH)/bin" >> "$GITHUB_OUTPUT"

      - name: Cache golangci-lint binary
        id: lint-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.gopath.outputs.bin }}/golangci-lint
          key: golangci-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ env.GOLANGCI_VERSION }}

      # Build golangci-lint from source with Go 1.26. Pre-built releases (up
      # to v2.1.6) ship with Go ≤1.24 and refuse to analyze code targeting a
      # newer language version. Costs ~30s on cache miss; removable once an
      # upstream release is built with Go 1.26+.
      - name: Install golangci-lint from source
        if: steps.lint-cache.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_VERSION }}

      - name: Run golangci-lint
        run: ${{ steps.gopath.outputs.bin }}/golangci-lint run --timeout=5m ./...

      # tsformat proximity lint (#990, #1073c): flags any RFC3339Nano
      # token added within `window` lines of an ExecContext/QueryContext
      # call — internal/tsformat's own doc comment says any such write
      # belongs in tsformat.Format instead, since RFC3339Nano truncates
      # trailing-zero fractional seconds and breaks lexicographic sort
      # order in SQL comparisons/ORDER BY.
      #
      # Scoped to lines ADDED relative to origin/main (see
      # scripts/lint-tsformat/main.go's doc comment) rather than a
      # whole-tree scan, so this gate is about catching new regressions
      # to the broken pattern, not retroactively blocking on the ~100+
      # pre-existing hits that #1073a/#1073b are converting separately.
      - name: tsformat proximity lint
        run: go run ./scripts/lint-tsformat origin/main

      # Docker API surface gate (#1826). The server reaches Docker directly,
      # which is root-equivalent on the host. Operators can narrow that with a
      # socket proxy — we honour DOCKER_HOST — but a proxy is only as good as
      # the endpoint list behind it, and an endpoint list is exactly the kind
      # of documentation that rots the first time somebody adds a call. The
      # list published in docker/docker-compose.prod.yml and
      # docs/guides/docker-socket-proxy.mdx had already drifted before this
      # gate existed: it was missing COMMIT, so crew provisioning behind the
      # proxy we ship would 403 at `docker commit`.
      #
      # The tool re-derives the surface from the call sites on every run and
      # fails on drift in BOTH directions — a new call nobody listed (the
      # proxy would deny it in production) and a listed endpoint nobody calls
      # (we would be asking operators to grant a permission we do not need).
      # The second is the one nobody would ever notice.
      #
      # Pure AST work: no daemon, no Docker, no network, ~1s. The same check
      # also runs as TestRealTreeMatchesDeclaration in the `go` job, so it
      # survives this step being dropped.
      - name: Docker API surface matches its published allow-list
        run: go run ./scripts/docker-api-surface

      # OpenAPI spec freshness. internal/api/openapi.gen.json is generated
      # from the r.mux.Handle / r.authedMut / r.authedAdmin / r.authedSelfMut
      # route registrations, and it is what GET /openapi.json serves — the API
      # contract anything driving Crewship programmatically reads. Nothing
      # forced a regenerate, so it drifted silently: 14 routes missing by
      # 2026-07-25 (journal verify, the notifications suite, crew services,
      # crew files delete, pipelines budget/diff, …), and it drifted again
      # within hours of being fixed. A stale spec under-reports the API rather
      # than failing loudly, which is the worst failure mode for a contract.
      #
      # Invoked from the repo root, NOT via `go generate ./internal/api/`:
      # gen-openapi resolves its output path relative to the working
      # directory, so the go:generate form writes to the wrong place and
      # errors out.
      - name: OpenAPI spec is up to date
        run: |
          go run ./cmd/gen-openapi
          if ! git diff --quiet -- internal/api/openapi.gen.json; then
            echo "::error file=internal/api/openapi.gen.json::openapi.gen.json is stale. Run 'go run ./cmd/gen-openapi' from the repo root and commit the result."
            git diff --stat -- internal/api/openapi.gen.json
            git diff -- internal/api/openapi.gen.json | head -60
            exit 1
          fi
          echo "openapi.gen.json matches the registered routes."

      # Documentation contract gate (#1769 review). The release-1.0 audit
      # established that every API operation and CLI command is documented,
      # with concrete request/response schemas and local auth/request/
      # response/status evidence. Nothing HELD that: the tool only wrote a
      # report and always exited 0, so the next PR could add an undocumented
      # route and the numbers would silently stop being true — the same shape
      # of defect as a green check that never ran.
      #
      # -strict re-derives the inventory from the tree and fails on any gap,
      # naming the offending operations/commands. It runs after the freshness
      # check above so a stale spec is reported as staleness rather than as a
      # documentation gap.
      #
      # The tool shells out to `go run ./cmd/crewship commands --format json`
      # for the CLI side. No daemon, no Docker, no network — but it does
      # compile cmd/crewship, so it depends on the setup-go-embed step above
      # having staged web/out; without it the build fails on the go:embed
      # directive rather than on anything this gate is about.
      - name: API and CLI documentation is complete
        run: go run ./scripts/docs-inventory -strict

  # ── Full binary build (push to main only — verifies embed works) ──
  #
  # Stays push-only to conserve runner minutes. The Go job already catches
  # compile errors; embed-path regressions are rare enough that post-merge
  # detection is acceptable for the budget.
  binary:
    name: Binary Build
    runs-on: ubuntu-latest
    # 15 min: ubuntu-latest setup-go is consistent enough that 10
    # would usually do, but we keep a small buffer for first-run
    # cache miss on the Go SDK download.
    timeout-minutes: 15
    # go-api is gone — internal/api now runs inside `go` again (see that
    # job's comment). go-race and go-race-api are listed because they are
    # blocking (no continue-on-error); go-shuffle is deliberately NOT
    # listed — it is still advisory while its two known findings are fixed
    # elsewhere.
    needs: [frontend, go, go-race, go-race-api]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go-embed
        with:
          go-version: ${{ env.GO_VERSION }}

      # Wipe the embed dir before pulling the artifact so a stale checkout
      # copy of web/out cannot satisfy the embed directive if the
      # download-artifact step fails (or the artifact never existed).
      # Without this + a non-best-effort download, Binary Build can go
      # green while embedding whatever stale bytes the checkout left
      # behind — defeating the job's purpose of validating the freshly
      # built frontend bundle.
      - name: Clean embed directory
        run: rm -rf web/out

      - name: Download static export
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nextjs-static-export
          path: web/out

      # Same gate the release path uses: prove the artifact that landed in
      # web/out/ is a real Next.js export before compiling it in, so this
      # job cannot go green over an empty or placeholder embed (#1567).
      - name: Verify a real export is staged for embedding
        run: ./scripts/embed-web-out.sh verify

      - name: Build single binary with embedded frontend
        run: go build -o crewship ./cmd/crewship

      - name: Verify binary runs
        run: ./crewship version

  # NOTE: E2E Devcontainer Provisioning was moved out of the per-PR gate.
  # It pulls real base images + features from ghcr.io (slow, rate-limited)
  # and exercises the full seed+provision path — that's ~8-15 min of CI time
  # per push that, in practice, mostly catches infra flakes. It now lives in
  # `.github/workflows/e2e-devcontainer.yml`, triggered nightly + on demand
  # via `gh workflow run e2e-devcontainer.yml`.
