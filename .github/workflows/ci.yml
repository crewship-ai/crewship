name: CI

on:
  # Manual re-trigger. Useful for cases where the original push's run
  # got stranded in `queued` (GitHub-hosted runner pool saturated, rare
  # but observed during peak hours). With workflow_dispatch the run
  # can be re-queued from the Actions tab or via:
  #   gh workflow run ci.yml --ref <branch>
  # without needing an empty commit.
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    # Skip CI on changes that can't affect lint/typecheck/build/test:
    # docs (Mintlify-rendered, separate pipeline), markdown reference
    # files, license/notices files, the GitHub issue templates, and
    # the wireframe HTML mocks. Code changes that *also* touch these
    # paths still trigger CI because GitHub treats paths-ignore as
    # "trigger if ANY changed file is outside the ignore list".
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.mdx'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.claude/**'
      - '.factory/**'
      - '.cloud/**'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.mdx'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.claude/**'
      - '.factory/**'
      - '.cloud/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default least-privilege. Individual jobs widen only when required.
permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"
  GO_VERSION: "1.26.5"

jobs:
  # ── Sentinel: reject leaked git merge-conflict markers ──
  #
  # Background (2026-05-21 incident): a literal `<<<<<<<` / `=======` /
  # `>>>>>>>` block landed inside a Go raw-string SQL query in
  # `internal/api/agent_config.go` and propagated to `main`. Go raw
  # strings don't parse their content so `go vet` / `golangci-lint` /
  # `gosec` all stayed green; the bug only surfaced as a runtime SQLite
  # "syntax error" on every `crewship ask` chat-resolve call. External
  # auditor caught it. This sentinel runs FIRST so a leaked marker fails
  # the whole CI pipeline immediately — cheaper signal than waiting for
  # downstream build / test / lint to maybe-find-it-maybe-not.
  #
  # Extension list is intentionally wide: Go raw strings, TS template
  # literals, MDX prose, YAML / JSON / SQL fixtures, shell scripts, and
  # Dockerfiles can all hide a marker that the language compiler /
  # parser accepts as valid syntax. If a new file extension lands in
  # the repo that could host an unparsed marker, extend this list.
  merge-conflict-markers:
    name: Reject leaked merge markers
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sentinel grep
        run: |
          set -euo pipefail
          # Pattern: line-anchored marker tokens. Anchored to start-of-
          # line so a literal `<<<<<<<` written deliberately in prose
          # (e.g. a doc page explaining merge conflicts) doesn't trip
          # the check unless it sits at column 0 like a real marker.
          if git grep -nE '^(<<<<<<< |=======$|>>>>>>> )' -- \
              ':!*.bak' \
              '*.go' '*.ts' '*.tsx' '*.mdx' '*.md' \
              '*.yaml' '*.yml' '*.sql' '*.json' '*.py' '*.sh' \
              'Dockerfile' 'Dockerfile.*'; then
            echo ""
            echo "✗ Found one or more leaked git merge-conflict markers."
            echo "  Open the file(s) above, resolve the conflict, stage the result, and commit."
            echo "  (If the literal string is intentional — e.g. inside a doc explaining merge conflicts — move it off column 0 or wrap it in a code fence with leading whitespace.)"
            exit 1
          fi
          echo "✓ No leaked merge-conflict markers found."

  # ── Shell unit tests ──
  # The shell we ship is as load-bearing as the Go, and harder to reason
  # about: dev.sh wedges a dev slot when a helper trips `set -e`, and the
  # alert-issue block in security.yml decides whether a failed security scan
  # closes its own tracking issue. Both had test files that no workflow ran,
  # so both regressed unnoticed. They run here.
  shell:
    needs: [merge-conflict-markers]
    name: Shell
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: dev.sh helpers
        run: bash scripts/dev-sh-test.sh
      - name: security.yml alert-issue logic
        run: bash scripts/security-yml-test.sh
      - name: deploy-dev.sh push_branch
        run: bash scripts/deploy-dev-test.sh
      - name: test-harness lib (binary resolution + preflight)
        run: bash scripts/test-harness-lib-test.sh

      # Skip budget ratchet. `go test ./...` prints `ok` for a package whose
      # every test called t.Skip, so a skip is indistinguishable from a pass
      # in CI output — and nothing counted them, which made "skip it for now"
      # free and invisible. This fails only when the count RISES above
      # scripts/skip-budget.txt. Lives in the `shell` job because it is a
      # 2-second grep and this is where the other script gates already run;
      # no Go toolchain needed.
      - name: Skip budget (t.Skip ratchet)
        run: bash scripts/skip-budget.sh

  # ── Frontend: lint, typecheck, build ──
  frontend:
    needs: [merge-conflict-markers]
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      # Cache Next.js incremental build artifacts. actions/checkout cleans
      # the workspace each run (clean: true is the default), so .next/cache
      # would otherwise be cold every time and Turbopack would re-parse the
      # entire app — typically 60-90s wasted per push. Restore-keys fall
      # back to the most recent build with the same lockfile, which Next
      # then upgrades incrementally based on changed source files.
      - name: Cache .next build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Build static export
        run: pnpm build
        env:
          NEXTAUTH_SECRET: "ci-build-secret-not-real"

      - name: Upload static export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nextjs-static-export
          path: out/
          retention-days: 1

  # ── Frontend tests (Vitest) ──
  frontend-test:
    needs: [merge-conflict-markers]
    name: Frontend Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      # Coverage, not a bare test run: vitest exits non-zero when the
      # thresholds in vitest.config.ts are not met, which is what makes
      # that gate real rather than decorative.
      - name: Test
        run: pnpm test:coverage

      - name: Upload coverage (lcov)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  # ── Go: vet, build, test ──
  go:
    needs: [merge-conflict-markers]
    name: Go
    runs-on: ubuntu-latest
    #
    # ⚠ INVARIANT: timeout-minutes MUST stay comfortably ABOVE
    #   (pre-test step time) + (the `go test -timeout` below).
    # Do not "tidy" these two numbers back into agreement.
    #
    # They used to both be 15, and the arithmetic never worked. Measured
    # on run 30540606982 (a job that PASSED, at 14m39s of a 15m budget):
    #
    #   setup (job + checkout + setup-go)   9s
    #   Go vet                             66s
    #   Go build                            6s
    #   windows clionly cross-compile      59s
    #   clionly host-OS build               5s
    #   windows full-daemon cross-compile   8s
    #   ---------------------------------------
    #   pre-test overhead              2m 33s
    #   Go test                       12m 02s
    #
    # So the job cap left only 12m27s of usable test time while
    # `go test -timeout 15m` promised 15m. The Go timeout was
    # arithmetically unreachable: GitHub's cancel always fired first.
    # That is the worst possible failure mode, because GitHub's cancel
    # prints `##[error]The operation was canceled.` with every package
    # already showing `ok` and NO indication of which test was still
    # running — whereas Go's own timeout panics with a full goroutine
    # dump naming the culprit. PRs #1531 (15m07s) and #1537 (15m15s)
    # both died this way with nothing actionable in the log.
    #
    # Whoever wins the race decides how debuggable the failure is, so
    # Go must always win. Budget below keeps ≥5 min of daylight between
    # (overhead + go test -timeout) and this cap.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go-embed
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build ./cmd/crewship

      # #945/#946 — Windows port regression gates: the clionly CLI and the
      # full daemon must both stay windows-clean. The embed placeholder from
      # setup-go-embed satisfies web/out for the full build.
      - name: Go build (windows clionly cross-compile)
        run: GOOS=windows GOARCH=amd64 go build -tags clionly ./cmd/crewship

      # Host-OS clionly build: the Windows step proves the clionly graph
      # compiles for GOOS=windows, but a break scoped to the unix side of
      # a build-tag split would only surface at the nightly goreleaser
      # snapshot. Costs seconds — the build cache is already warm.
      - name: Go build (clionly, host OS)
        run: go build -tags clionly ./cmd/crewship

      # #946 — the full daemon must stay windows-clean too (IPC/hooks/docker
      # detection/self-update all have OS branches). The embed placeholder
      # from setup-go-embed satisfies web/out for the full build.
      - name: Go build (windows full-daemon cross-compile)
        run: GOOS=windows GOARCH=amd64 go build ./...

      # Everything EXCEPT internal/api — that package runs in the `go-api`
      # job below. Measured per-package times from run 30540606982
      # (ubuntu-latest, 4 vCPU, 12m02s wall for this step, 104 packages
      # with tests, 1988.7s of CPU in total):
      #
      #   internal/api          378.7s   ← 52% of the wall clock on its own
      #   internal/backup       269.1s
      #   internal/server       266.0s
      #   internal/database     237.6s
      #   cmd/crewship          168.0s
      #   internal/consolidate   99.0s
      #
      # `go test` parallelises across packages up to -p (= 4 here), so the
      # wall clock is floored by the slowest single package. internal/api
      # WAS that floor, which meant one package's growth set the budget for
      # the other 103.
      #
      # MEASURED after the split, on this branch's first run (job
      # 90877558861): pre-test overhead 2m36s, this step 9m59s, job 12m36s
      # against the 20m cap — 7.4m of headroom. (My pre-split estimate was
      # ~8m; the CPU floor of 1610s/4 = 6m42s plus imperfect packing of the
      # 269s/266s/238s tail is what puts it at ~10m.)
      #
      # On the two numbers: `-timeout` is PER TEST BINARY, not for the whole
      # invocation, so the figure to compare it against is the SLOWEST SINGLE
      # PACKAGE (internal/backup, ~269s = 4.5m) — 12m is ~2.7x that. The
      # job's wall clock is governed by timeout-minutes instead, and that is
      # the number to raise if this step grows.
      #
      # ⚠⚠ THIS SHARD IS CALIBRATED TO PRE-#1547 TIMINGS. This is the
      # timeout/diagnosability fix, NOT a speed fix — the speed work is PR
      # #1547 (perf/shared-migrated-test-db), which hoists
      # migratedTemplateOnce into internal/testutil across 23 packages and
      # measures 1205.6s → 195.3s (6.2x). Relevant to THIS shard:
      # internal/api goes 378.7s → 62.2s, internal/server 266.0s → 18.7s,
      # internal/backup 269.1s → 59.3s, cmd/crewship 168.0s → 28.7s.
      #
      # ➜ AFTER #1547 MERGES: RE-MEASURE. At 62s, internal/api is no longer
      #   the floor under the wall clock, so the whole reason for splitting
      #   `go-api` out disappears and the two jobs should probably collapse
      #   back into one — saving a runner. The timeout INVARIANT above stays
      #   correct regardless; it is only the shard and the numbers that are
      #   provisional.
      #
      # Execution order stays SOURCE ORDER here, deliberately. -shuffle=on
      # lives in the non-blocking `go-shuffle` job below; see that job for
      # why it is not on the blocking gate yet.
      - name: Go test (excluding internal/api)
        run: |
          set -euo pipefail
          # Exact-match exclusion (grep -vx on the full import path):
          # internal/api has no subpackages today, and should one appear it
          # keeps running HERE rather than silently vanishing from CI —
          # which a prefix match like `grep -v internal/api` would cause.
          pkgs="$(go list ./... | grep -vx 'github.com/crewship-ai/crewship/internal/api')"
          n="$(printf '%s\n' "$pkgs" | grep -c .)"
          # Guard against the list collapsing (a rename, a broken `go list`,
          # a grep that eats too much). `go test` with zero packages exits 0,
          # so without this a truncated list is indistinguishable from a
          # full green run — the same failure mode as an uncounted t.Skip.
          # 90 is a floor, not a target: `go list ./...` resolves 108
          # packages today (107 after excluding internal/api), so this trips
          # only on a collapse, not on ordinary package churn.
          if [ "$n" -lt 90 ]; then
            echo "::error::go list returned only $n packages — expected ~107. Refusing to report a pass on a truncated package list."
            exit 1
          fi
          echo "Testing $n packages (internal/api runs in the go-api job)."
          # Deliberately unquoted: Go import paths cannot contain
          # whitespace, so word-splitting is the intended behaviour here.
          # Avoids `mapfile`, which macOS's bash 3.2 lacks — this block
          # should stay runnable by hand on a developer machine.
          # shellcheck disable=SC2086
          go test $pkgs -count=1 -timeout 12m

  # ── Go: internal/api shard ──
  #
  # internal/api is its own job because it was setting the test timeout for
  # the entire repo. It is the single largest package (31,803 statements) and
  # measured 378.7s on run 30540606982 — 52% of that job's 12m02s test wall
  # clock, and the floor under it, since `go test` can only go as fast as its
  # slowest package. Every other package's budget was hostage to this one.
  #
  # Splitting also makes the signal legible: "Go API red, Go green" says the
  # HTTP layer broke, not "something in 104 packages did".
  #
  # This job skips `go vet` and the four cross-compile builds — the `go` job
  # already covers those repo-wide, and duplicating them here would spend
  # ~2m30s of runner time to re-prove the same thing.
  go-api:
    needs: [merge-conflict-markers]
    name: Go API
    runs-on: ubuntu-latest
    # Same invariant as the `go` job: the cap MUST exceed overhead + the
    # `go test -timeout` below, so Go's goroutine-dumping panic wins the
    # race against GitHub's opaque cancel. Overhead here is only checkout
    # + setup-go + compiling one test binary, measured at 2m30s on this
    # branch's first run (job 90877558773). internal/api itself measured
    # 378.7s on run 30540606982, so -timeout 12m is ~1.9x the one package
    # this job runs, inside a cap with ~7m of daylight.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go-embed
        with:
          go-version: ${{ env.GO_VERSION }}

      # Source order here too — see `go-shuffle` below.
      - name: Go test (internal/api)
        run: go test ./internal/api -count=1 -timeout 12m

  # ── Go: shuffled execution order ──
  #
  # -shuffle=on randomises test order within each package. This suite has
  # ~206 time.Sleep calls in tests, a lot of shared on-disk SQLite fixtures,
  # and — the real problem — package-level globals that outlive a single
  # test. Fixed source order hides all of that permanently.
  #
  # SCOPE IS NOW THE WHOLE SUITE. The two packages this job used to exclude —
  # cmd/crewship and internal/api — were fixed and the skip list is empty, so
  # a red X here means a NEW order dependency, never known wallpaper.
  #
  # What was excluded, and what it turned out to be (kept because the shapes
  # recur, and because "the failing test is never the guilty one" is the whole
  # lesson of this job):
  #
  #  A. cmd/crewship — up to 58 failing top-level tests per seed. Cobra binds
  #     --format & co. to package-level variables and the root PersistentPreRun
  #     blanks internal/cli's colour palette; a CLI process runs one command and
  #     exits, a test binary runs ~3,000 in one process. Fix: every test is
  #     handed the process's start-of-day state back — CLI globals, the colour
  #     palette, and every Cobra flag's value AND its Changed bit (144 places
  #     branch on Changed, and putting a flag back with Flags().Set leaves
  #     Changed=true forever). See cmd/crewship/clistate_test.go.
  #
  #  B. internal/api — two separate ones. ENCRYPTION_KEY was installed by
  #     whichever test called setTestEncryptionKeyParallelSafe first, so
  #     fixtures that encrypt without asking (webhook signing secrets,
  #     crew-template deploy) worked only when they sorted after it; TestMain
  #     now installs it before any test. And defaultCapabilityCache is a
  #     process-wide singleton keyed on the CONSTANT ids seedTestUser /
  #     seedTestWorkspace hand every test, so a capability answer computed
  #     against one test's database was served to the next one's router;
  #     setupTestDB now clears it, since a fresh database deserves a cache that
  #     knows nothing about the previous one.
  #
  # Verified before the exclusions were dropped: cmd/crewship green on 13
  # distinct seeds (including 1785429252149193000, which failed 15 tests
  # before), internal/api green on 10 (including 11 and 22, which failed
  # before). Order-dependence is not proven absent by any number of seeds —
  # which is exactly why this job runs a fresh random one every push.
  #
  # Still `continue-on-error`, and the reason is honest rather than convenient:
  # a randomised gate earns "blocking" by being green over time, not by being
  # green in the PR that fixed it. The known findings are closed, so this is
  # now a soak, not a workaround.
  #
  # ➜ TO PROMOTE TO BLOCKING: after a handful of consecutive green runs on
  #   main, delete `continue-on-error`. The end state is -shuffle=on folded
  #   back into `go`/`go-api` and this job deleted, since shuffling costs no
  #   extra wall-clock.
  go-shuffle:
    needs: [merge-conflict-markers]
    name: Go Shuffle
    runs-on: ubuntu-latest
    continue-on-error: true
    # Same invariant as `go`: cap MUST exceed overhead + `go test -timeout`
    # so Go's goroutine dump wins over GitHub's opaque cancel. Measured at
    # 11m52s for the full suite (job 90889450094) back when internal/api and
    # cmd/crewship were excluded AND still cost 379s/168s; #1547 cut both, and
    # they are back in scope, so the headroom is roughly unchanged.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go-embed
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go test (shuffled)
        # go test prints the chosen seed per package as `-test.shuffle N`.
        # To reproduce a failure from this job's log:
        #   go test ./internal/<pkg> -count=1 -shuffle=<seed>
        # Reproducing needs the WHOLE package — the dependency is on other
        # tests in it, so narrowing with -run will make it pass. That is the
        # tell that you are looking at shared state, not a broken assertion.
        run: |
          set -euo pipefail
          # No skip list any more: every package is shuffled. Resist adding
          # one back. A package parked here silently loses order-dependence
          # coverage, and the state that caused it goes on leaking into
          # whichever test is unlucky — which is the failure mode this job
          # exists to surface, not to route around.
          n="$(go list ./... | grep -c .)"
          # Guard against the list collapsing, same as the `go` job: `go test`
          # with zero packages exits 0, so a truncated list would look like a
          # full green run.
          if [ "$n" -lt 90 ]; then
            echo "::error::go list returned only $n packages — expected ~108. Refusing to report a pass on a truncated package list."
            exit 1
          fi
          echo "Shuffling all $n packages."
          go test ./... -count=1 -shuffle=on -timeout 15m

  # ── Go: race detector ──
  #
  # Deliberately a SEPARATE job rather than a -race flag bolted onto the `go`
  # job above: the race build is much slower, and when a race does fire you
  # want to see "Go Race red, Go green" in the checks list, not one ambiguous
  # red Go job that might be a compile error, a logic failure, or a race.
  #
  # Why this gate at all: Crewship is an orchestrator. Concurrent state is
  # not incidental to it — the WS hub fans out to subscribers, the keeper
  # dedups across goroutines behind a mutex, lease acquisition races a SQL
  # UPDATE, and routines spawn detached background workers that outlive the
  # request. The test suite calls t.Parallel() ~2434 times, so it already
  # generates the concurrency a detector needs. Sixteen Go files even carry
  # a "run with -race" comment — the discipline existed, but only as a
  # habit, and habits do not block merges. Nothing in CI passed -race, so
  # any race that landed stayed landed until it flaked in production.
  #
  # ── Why this runs an ALLOW-LIST, which is the uncomfortable part ──
  #
  # `go test ./... -race` does not fit on a 4-vCPU runner. Measured twice on
  # this branch, both cancelled at their cap with most packages unreported:
  #
  #   40m cap, all 108 packages (job 90877558841): 14 packages reported.
  #     cmd/crewship, internal/api, internal/auth/sessions and
  #     internal/backup had each burned the full 25m per-binary timeout in
  #     parallel — `panic: test timed out after 25m0s` x4.
  #   25m cap, 101 packages (job 90889450207): 31 reported, 0 races, still
  #     running inbox/governance/notifyroute/pipeline when cancelled.
  #
  # The cause is not the race detector being "2-3x slower" — that estimate
  # was wrong and is worth recording. For this suite the real multiplier on
  # DB-fixture packages is 10-30x, because every test re-runs all 155
  # migrations and instrumentation compounds it. Measured pairs, CI non-race
  # (run 30540606982) vs local -race:
  #
  #   internal/keeper/governance    31.5s  →   962.5s   (30x)
  #   internal/inbox                35.9s  →   789.8s   (22x)
  #   internal/notifyroute          79.5s  →  1111.2s   (14x)
  #
  # So a deny-list cannot work here: the default is "too slow", and
  # defaulting-in produces a job that never finishes and therefore proves
  # nothing. The list below is the honest alternative — the packages that
  # actually carry the concurrency this gate exists for, all of which are
  # fast under -race (measured, contended local machine, so upper bounds):
  #
  #   ws 1.9s · leader 1.8s · presence 1.4s · keeper 1.3s · keeper/eval 1.7s
  #   keeper/gatekeeper 1.8s · keeper/routines 1.9s · chatbridge 4.9s
  #   scheduler 4.8s · sidecar 5.2s · memory 9.8s · journal 16.7s
  #   orchestrator 19.3s · fileserver 1.8s · encryption 1.3s
  #   containerstate 1.9s · logcollector 1.7s · tokenutil 1.7s
  #
  # An allow-list's real weakness is that a new package gets NO race
  # coverage and nobody notices. Mitigations: the step below fails if any
  # entry stops resolving to a real package (so the list cannot rot
  # silently), and the fix is tracked rather than assumed —
  #
  # ⚠⚠ THIS LIST IS CALIBRATED TO PRE-#1547 TIMINGS AND IS EXPECTED TO DIE.
  #
  # PR #1547 (perf/shared-migrated-test-db) hoists internal/api's
  # migratedTemplateOnce into internal/testutil and adopts it in 23
  # packages, measured there at 1205.6s → 195.3s (6.2x). It removes the
  # exact cause of every measurement above — the 155-migrations-per-test
  # cost — at the source:
  #
  #   package                  this PR measured   after #1547
  #   internal/api                      378.7s        62.2s
  #   internal/server                   266.0s        18.7s
  #   internal/backup                   269.1s        59.3s
  #   internal/auth/sessions   1500s (under -race)     1.0s
  #   cmd/crewship                      168.0s        28.7s
  #
  # ➜ AFTER #1547 MERGES: RE-MEASURE, then delete this allow-list and go
  #   back to plain `./...` with a deny-list (or no list at all). The
  #   allow-list exists only because full-suite -race could not finish; at
  #   6.2x faster fixtures that reason evaporates. Do not treat these 18
  #   packages as the intended permanent scope — a deny-list is the right
  #   polarity and should be restored as soon as it is affordable.
  #   Until then, do not grow this list to chase coverage — grow it only as
  #   packages become fast enough.
  go-race:
    needs: [merge-conflict-markers]
    name: Go Race
    runs-on: ubuntu-latest
    # BLOCKING, with no continue-on-error and nothing excluded for being
    # broken. The single finding this gate produced (internal/telemetry) is
    # fixed in this same PR, so the check means exactly what it says from
    # the first run. If it ever goes red, a race landed.
    #
    # Same invariant as the `go` job: cap MUST exceed overhead + the
    # `go test -timeout` below, so Go's goroutine-dumping panic wins the
    # race against GitHub's opaque cancel. Race compile of this dependency
    # graph is the bulk of the time; the tests themselves total ~80s of CPU.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go-embed
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go test (race)
        # No -shuffle here on purpose: `go-shuffle` owns order-dependence
        # detection. Keeping this job's ordering fixed means a race report
        # is reproducible from the log without also having to replay a seed.
        run: |
          set -euo pipefail
          # The packages that carry Crewship's concurrency. See the long
          # comment on this job for why this is an allow-list and what has
          # to happen before it can go back to `./...`.
          #
          # internal/telemetry is IN the list. It was the one finding this
          # gate produced (4 warnings, one root cause: the pprof tests shared
          # a bare *bytes.Buffer with the goroutine StartPProfServer spawns).
          # Fixed in this PR with a mutex-guarded sink in pprof_cov_test.go,
          # so the gate that found it also guards it.
          listfile="${RUNNER_TEMP:-/tmp}/race-pkgs.txt"
          cat > "$listfile" <<'PKGS'
          github.com/crewship-ai/crewship/internal/chatbridge
          github.com/crewship-ai/crewship/internal/containerstate
          github.com/crewship-ai/crewship/internal/encryption
          github.com/crewship-ai/crewship/internal/fileserver
          github.com/crewship-ai/crewship/internal/journal
          github.com/crewship-ai/crewship/internal/keeper
          github.com/crewship-ai/crewship/internal/keeper/eval
          github.com/crewship-ai/crewship/internal/keeper/gatekeeper
          github.com/crewship-ai/crewship/internal/keeper/routines
          github.com/crewship-ai/crewship/internal/leader
          github.com/crewship-ai/crewship/internal/logcollector
          github.com/crewship-ai/crewship/internal/memory
          github.com/crewship-ai/crewship/internal/orchestrator
          github.com/crewship-ai/crewship/internal/presence
          github.com/crewship-ai/crewship/internal/scheduler
          github.com/crewship-ai/crewship/internal/sidecar
          github.com/crewship-ai/crewship/internal/telemetry
          github.com/crewship-ai/crewship/internal/tokenutil
          github.com/crewship-ai/crewship/internal/ws
          PKGS
          want="$(grep -c . "$listfile")"
          # An allow-list rots silently: a package gets renamed, the entry
          # stops matching, and the job keeps passing while covering less.
          # Resolve every entry against `go list` and fail if any is stale.
          got="$(go list ./... | grep -Fxf "$listfile" | grep -c .)"
          if [ "$got" -ne "$want" ]; then
            echo "::error::race allow-list has $want entries but only $got resolve against 'go list ./...'. An entry is stale — reconcile it."
            printf '%s\n' "--- unresolved:"
            grep -Fxv -f <(go list ./...) "$listfile" || true
            exit 1
          fi
          echo "Race-testing $want packages (allow-list; see job comment)."
          # -timeout 10m per test binary: the slowest entry is
          # internal/orchestrator at ~19s under -race, so 10m is ~30x. The
          # generosity is free — it only ever bounds a hang, and a hang here
          # should produce Go's goroutine dump rather than a GitHub cancel.
          # shellcheck disable=SC2046
          go test $(tr '\n' ' ' < "$listfile") -race -count=1 -timeout 10m

  # ── Go: cross-platform test matrix ──
  #
  # The linux/amd64 `go` job above is the primary gate; this matrix closes
  # the two release-coverage gaps the CLI audit flagged: darwin binaries
  # shipped without `go test` ever running on macOS (the post-release smoke
  # test only runs `crewship version`), and no arm64 runtime coverage
  # existed at all (goreleaser cross-BUILDS linux/darwin arm64, but nothing
  # executed the code). macos-14 and ubuntu-24.04-arm are both arm64, so
  # together with the amd64 job all four released GOOS/GOARCH combos get
  # compile coverage and three get runtime coverage. Docker-dependent tests
  # skip themselves when no daemon is present (macOS runners have none).
  go-platforms:
    needs: [merge-conflict-markers]
    name: Go (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-14
          - name: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go-embed
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go build
        run: go build ./cmd/crewship

      - name: Go test
        # -short would defeat the purpose; run the full suite. 20m test
        # timeout mirrors the amd64 job's headroom — macOS runners are
        # slower than ubuntu for the SQLite-heavy internal/api package.
        run: go test ./... -count=1 -timeout 20m

  # ── Go lint: golangci-lint ──
  go-lint:
    needs: [merge-conflict-markers]
    name: Go Lint
    runs-on: ubuntu-latest
    # 15 min: same calculus as the Go job above. golangci-lint
    # itself runs in ~30s with the cached binary; the rest of the
    # budget is one-time cold-cache buffer.
    timeout-minutes: 15
    env:
      GOLANGCI_VERSION: v2.1.6
    steps:
      # fetch-depth: 0 (rather than the default shallow depth-1 clone) so
      # the tsformat proximity-lint step below can resolve origin/main and
      # diff against it — same reasoning as migration-lint.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-go-embed
        with:
          go-version: ${{ env.GO_VERSION }}

      # Cache the golangci-lint binary itself — `go install` from source
      # adds ~30s per run and the resulting binary is fully determined by
      # (runner OS, Go version, golangci-lint version). Cache miss falls
      # through to the install step below.
      - name: Resolve GOPATH/bin
        id: gopath
        shell: bash
        run: echo "bin=$(go env GOPATH)/bin" >> "$GITHUB_OUTPUT"

      - name: Cache golangci-lint binary
        id: lint-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.gopath.outputs.bin }}/golangci-lint
          key: golangci-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ env.GOLANGCI_VERSION }}

      # Build golangci-lint from source with Go 1.26. Pre-built releases (up
      # to v2.1.6) ship with Go ≤1.24 and refuse to analyze code targeting a
      # newer language version. Costs ~30s on cache miss; removable once an
      # upstream release is built with Go 1.26+.
      - name: Install golangci-lint from source
        if: steps.lint-cache.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_VERSION }}

      - name: Run golangci-lint
        run: ${{ steps.gopath.outputs.bin }}/golangci-lint run --timeout=5m ./...

      # tsformat proximity lint (#990, #1073c): flags any RFC3339Nano
      # token added within `window` lines of an ExecContext/QueryContext
      # call — internal/tsformat's own doc comment says any such write
      # belongs in tsformat.Format instead, since RFC3339Nano truncates
      # trailing-zero fractional seconds and breaks lexicographic sort
      # order in SQL comparisons/ORDER BY.
      #
      # Scoped to lines ADDED relative to origin/main (see
      # scripts/lint-tsformat/main.go's doc comment) rather than a
      # whole-tree scan, so this gate is about catching new regressions
      # to the broken pattern, not retroactively blocking on the ~100+
      # pre-existing hits that #1073a/#1073b are converting separately.
      - name: tsformat proximity lint
        run: go run ./scripts/lint-tsformat origin/main

      # OpenAPI spec freshness. internal/api/openapi.gen.json is generated
      # from the r.mux.Handle / r.authedMut / r.authedAdmin / r.authedSelfMut
      # route registrations, and it is what GET /openapi.json serves — the API
      # contract anything driving Crewship programmatically reads. Nothing
      # forced a regenerate, so it drifted silently: 14 routes missing by
      # 2026-07-25 (journal verify, the notifications suite, crew services,
      # crew files delete, pipelines budget/diff, …), and it drifted again
      # within hours of being fixed. A stale spec under-reports the API rather
      # than failing loudly, which is the worst failure mode for a contract.
      #
      # Invoked from the repo root, NOT via `go generate ./internal/api/`:
      # gen-openapi resolves its output path relative to the working
      # directory, so the go:generate form writes to the wrong place and
      # errors out.
      - name: OpenAPI spec is up to date
        run: |
          go run ./cmd/gen-openapi
          if ! git diff --quiet -- internal/api/openapi.gen.json; then
            echo "::error file=internal/api/openapi.gen.json::openapi.gen.json is stale. Run 'go run ./cmd/gen-openapi' from the repo root and commit the result."
            git diff --stat -- internal/api/openapi.gen.json
            git diff -- internal/api/openapi.gen.json | head -60
            exit 1
          fi
          echo "openapi.gen.json matches the registered routes."

  # ── Full binary build (push to main only — verifies embed works) ──
  #
  # Stays push-only to conserve runner minutes. The Go job already catches
  # compile errors; embed-path regressions are rare enough that post-merge
  # detection is acceptable for the budget.
  binary:
    name: Binary Build
    runs-on: ubuntu-latest
    # 15 min: ubuntu-latest setup-go is consistent enough that 10
    # would usually do, but we keep a small buffer for first-run
    # cache miss on the Go SDK download.
    timeout-minutes: 15
    # go-api is here because it holds the internal/api half of what `go`
    # used to cover on its own; go-race is continue-on-error today, so it
    # satisfies `needs` regardless — it is listed to keep the dependency
    # honest once the race findings are fixed and it becomes blocking.
    needs: [frontend, go, go-api, go-race]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go-embed
        with:
          go-version: ${{ env.GO_VERSION }}

      # Wipe the embed dir before pulling the artifact so a stale checkout
      # copy of web/out cannot satisfy the embed directive if the
      # download-artifact step fails (or the artifact never existed).
      # Without this + a non-best-effort download, Binary Build can go
      # green while embedding whatever stale bytes the checkout left
      # behind — defeating the job's purpose of validating the freshly
      # built frontend bundle.
      - name: Clean embed directory
        run: rm -rf web/out

      - name: Download static export
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nextjs-static-export
          path: web/out

      - name: Build single binary with embedded frontend
        run: go build -o crewship ./cmd/crewship

      - name: Verify binary runs
        run: ./crewship version

  # NOTE: E2E Devcontainer Provisioning was moved out of the per-PR gate.
  # It pulls real base images + features from ghcr.io (slow, rate-limited)
  # and exercises the full seed+provision path — that's ~8-15 min of CI time
  # per push that, in practice, mostly catches infra flakes. It now lives in
  # `.github/workflows/e2e-devcontainer.yml`, triggered nightly + on demand
  # via `gh workflow run e2e-devcontainer.yml`.
