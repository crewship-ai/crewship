name: Runtime Conformance

# Does a crew container actually GET what we asked the runtime for?
#
# Crewship advertises five container runtimes and has only ever been run
# against one (#1672). The detected runtime string reaches a log line, the
# /system/runtime payload and `crewship doctor` — and nothing reads it. So a
# runtime that accepts a HostConfig field and silently declines to apply it is
# indistinguishable from success: PidsLimit unapplied brings back the zombie
# leak #1666 fixed, `core: 0` unapplied writes the agent's credential
# environment to a host-persistent bind on the next crash, ReadonlyRootfs
# unapplied removes the reason a user-supplied base image is safe. Every one of
# those fails open and quiet.
#
# internal/provider/docker/runtime_conformance_test.go starts a real crew
# container built by the product's own buildCrewContainerConfig and reads the
# result back from inside it — /proc/self/status, /proc/mounts, the cgroup
# files, id, ulimit, getent. Values, not shapes.
#
# This is also the first job in this repo that exercises the Linux container
# path at all.
#
# Apple Containers are deliberately absent: that runtime needs macOS 26 and a
# different harness, and it is tracked separately as #1650.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "40 3 * * *" # nightly, after e2e-devcontainer

concurrency:
  group: runtime-conformance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.27.0"
  # Small, has bash (scripts/entrypoint.sh needs it) plus the coreutils/mawk
  # the probe script reads facts with.
  CREWSHIP_CONFORMANCE_IMAGE: "debian:bookworm-slim"

jobs:
  # Docker is the runtime every other CI job and every developer already uses,
  # so a miss here is a real breakage rather than a portability difference.
  docker:
    name: docker (rootful)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Runtime facts
        run: |
          docker version
          echo "cgroup version: $(stat -fc %T /sys/fs/cgroup)"

      - name: Conformance
        run: go test -tags conformance -run TestRuntimeConformance -v -count=1 ./internal/provider/docker/

      # The shared provider contract suite, live. Its semantic half already runs
      # on every PR against a fake daemon; this is the half that proves a REAL
      # runtime does what the provider asked — stdin reaches the process, a
      # privileged exec is refused, ExecInspect reports a true exit code. The
      # podman legs are the higher-value ones: it is a runtime we advertise and
      # had never exec'd against (#1779).
      - name: Provider contract (live)
        run: go test -tags conformance -run TestDockerProvider_LiveContractSuite -v -count=1 ./internal/provider/docker/

  # NOTE: the alert job at the bottom of this file gates on the `docker` job
  # only. Podman below 5 is known-red for a measured reason (see the comment
  # above the podman job), and a nightly that files an issue every night for a
  # reason that is true but not new is a nightly nobody reads — the failure
  # mode nightly-e2e.yml's gate/drift split exists to avoid.

  # There is deliberately NO leg for a current podman here, and the reason is
  # worth writing down so nobody re-adds one.
  #
  # Ubuntu 24.04 ships podman 4.9.3, two majors behind what anyone installing
  # podman today gets, so a current-podman answer genuinely matters — 4.9.3 and
  # 6.0.2 do NOT behave the same (see the GroupAdd note below). The obvious way
  # to get one on a GitHub runner is to run quay.io/podman/stable inside docker.
  # That rig lies: podman-in-docker does not create its own IPC namespace, sees
  # itself as being in the host one, and rejects the crew HostConfig outright
  # with `cannot set shmsize when running in the {host } IPC Namespace` — a
  # failure that belongs to the test scaffolding and to no environment this
  # product ships into.
  #
  # Current podman is verified instead against a real `podman machine`
  # (6.0.2, applehv, macOS 26), where the full matrix passes 27/27. That is a
  # developer-machine run rather than CI; it is also a faithful one, which the
  # nested rig was not.

  # Podman is the runtime we advertise and have never run. Both modes are here
  # because they fail differently: rootful diverges only where podman's compat
  # layer maps a field differently, while rootless additionally runs the agent
  # uid inside a user namespace — which is what can make the /crew, /workspace
  # and /output host binds unwritable for it (agent-isolation-findings §1.6).
  #
  # Nothing in this workflow runs on pull_request, on purpose. Every leg starts
  # real containers and pulls real images, and PR feedback has to stay fast — a
  # multi-minute job on every provider change buys a portability answer that
  # does not change between one commit and the next. It is answered per runtime
  # release, not per commit. Nightly and on demand, and the results get read.
  #
  # These legs are EXPECTED TO BE RED on 4.9.3 today, for one measured reason:
  # podman below 5 drops supplementary GIDs that have no /etc/group entry, so
  # the agent does not hold gid 1002 and crew-shared memory reads fail with
  # EACCES. It cannot be delivered another way through the compat API, so the
  # provider reports it at startup (knownRuntimeGaps) rather than pretending.
  # Everything else on 4.9.3 is green, and podman 6.0.2 is green end to end.
  # Rootless additionally does not apply nofile/nproc/fsize — core=0, the one
  # that carries credentials out of a crash, does hold.
  podman:
    name: podman (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [rootless, rootful]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install podman
        run: |
          if ! command -v podman >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq podman
          fi
          podman --version

      # podman's Docker-compat API is a service, not a daemon that is already
      # running. Each mode gets its own socket so a leftover from the other mode
      # can never be the thing under test.
      - name: Start the podman compat API (${{ matrix.mode }})
        run: |
          set -euo pipefail
          if [ "${{ matrix.mode }}" = "rootless" ]; then
            # A rootless podman with no XDG_RUNTIME_DIR falls back to a
            # root-owned path and fails in ways that look like our bug.
            export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/tmp/podman-run-$(id -u)}"
            mkdir -p "$XDG_RUNTIME_DIR"
            echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
            podman system service --time=0 unix:///tmp/podman-conf.sock &
          else
            sudo podman system service --time=0 unix:///tmp/podman-conf.sock &
          fi
          for _ in $(seq 1 30); do
            [ -S /tmp/podman-conf.sock ] && break
            sleep 1
          done
          if [ ! -S /tmp/podman-conf.sock ]; then
            echo "podman compat socket never appeared" >&2
            exit 1
          fi
          # The rootful service runs as root; the test process does not. Written
          # as an `if` rather than `[ … ] && …`: under `set -e` the latter form
          # exits 1 on the rootless leg, where the test is simply false.
          if [ "${{ matrix.mode }}" = "rootful" ]; then
            sudo chmod 666 /tmp/podman-conf.sock
          fi
          echo "DOCKER_HOST=unix:///tmp/podman-conf.sock" >> "$GITHUB_ENV"

      - name: Runtime facts
        run: |
          podman info --format '{{.Host.CgroupsVersion}} {{.Host.CgroupManager}} {{.Host.Security.Rootless}}' || true
          # What the compat endpoint claims to be is itself part of the finding:
          # Detect() decides "podman" from the ServerVersion components.
          curl -s --unix-socket /tmp/podman-conf.sock http://d/version || true

      - name: Conformance
        run: go test -tags conformance -run TestRuntimeConformance -v -count=1 ./internal/provider/docker/

      # The shared provider contract suite, live. Its semantic half already runs
      # on every PR against a fake daemon; this is the half that proves a REAL
      # runtime does what the provider asked — stdin reaches the process, a
      # privileged exec is refused, ExecInspect reports a true exit code. The
      # podman legs are the higher-value ones: it is a runtime we advertise and
      # had never exec'd against (#1779).
      - name: Provider contract (live)
        run: go test -tags conformance -run TestDockerProvider_LiveContractSuite -v -count=1 ./internal/provider/docker/

  # ── A nightly nobody notices is worth nothing ──
  #
  # This workflow ran 25 times, failed 23 of them and was never green, over 18
  # days — and produced no issue, no assignee and no notification, because it
  # had no alert step while `Nightly E2E` and `Nightly Harness` both do
  # (#2003). The last 13 days of that were a build break: #1827 gave
  # `ensureImage` a second return value and four conformance-tagged call sites
  # were never updated, which nothing compiled. `ci.yml` now vets the tag on
  # every pull request so that specific cause cannot recur; this job is what
  # makes the NEXT cause visible.
  #
  # WHAT GATES, AND WHY NOT EVERYTHING. The gate is the `docker` leg alone.
  # Ubuntu ships podman 4.9.3, which drops supplementary GIDs that have no
  # /etc/group entry — measured, reported by the provider at startup via
  # knownRuntimeGaps, and not fixable from here. Gating on the podman legs
  # would file an issue every single night for a reason that is true, known and
  # unchanged, which is exactly how a real alert gets muted. Their result is
  # reported in the issue body instead, so a NEW podman failure is still
  # readable by whoever opens it.
  conformance-alert:
    name: Runtime conformance alert
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [docker, podman]
    if: always() && github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    steps:
      - name: File, update, or close the alert issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MARKER: "<!-- crewship:runtime-conformance-alert -->"
          TITLE: "Runtime conformance failed on main"
          DOCKER: ${{ needs.docker.result }}
          PODMAN: ${{ needs.podman.result }}
        run: |
          set -euo pipefail

          # Fail SAFE, not fail green (the security.yml lesson, restated in
          # both other nightlies): enumerate the GOOD status only. `skipped`,
          # `cancelled`, `timed_out` and whatever GitHub adds next all mean the
          # gate did not run, which is not a pass.
          results="docker=${DOCKER}"
          results_clean=$(printf '%s\n' "$results" \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | grep -v '^$' || true)
          not_green=$(printf '%s\n' "$results_clean" \
            | grep -vE '=success$' || true)
          # Zero reported jobs is a bug in THIS workflow, not a green night.
          if [ -z "$results_clean" ]; then
            not_green="(no job results were reported — the results block was empty)"
          fi

          podman_note="The podman legs reported \`${PODMAN}\`. They do **not** gate this alert: ubuntu-latest ships podman 4.9.3, which drops supplementary GIDs that have no /etc/group entry, so the crew-shared-memory assertions fail there for a known and measured reason (podman 6.0.2 is green end to end against a real \`podman machine\`). Read them for a NEW failure, not for that one."

          # --force makes label creation idempotent across runs.
          gh label create runtime-conformance-alert --repo "$REPO" \
            --color B60205 \
            --description "Automated: nightly container-runtime conformance failed on main" \
            --force

          # Only ever act on an issue THIS job filed: bot author AND our exact
          # title or body marker. Same containment contract as the other two
          # nightlies — never comment on or close a human's issue.
          existing=$(gh issue list --repo "$REPO" --label runtime-conformance-alert \
            --state open --json number,title,body,author \
            --jq "[ .[]
                    | select(.author.is_bot)
                    | select(.title == \$ENV.TITLE
                             or (.body // \"\" | contains(\$ENV.MARKER)))
                  ] | .[0].number // empty")

          if [ -z "$not_green" ]; then
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$REPO" \
                --body "✅ The docker runtime-conformance leg is green again as of $RUN_URL. Closing.

          $podman_note"
              gh issue close "$existing" --repo "$REPO" --reason completed
              echo "Closed alert issue #$existing (docker conformance green)."
            else
              echo "Docker conformance green and no alert issue — nothing to do."
            fi
            exit 0
          fi

          echo "Jobs that did not report success:"; echo "$not_green"
          body="$MARKER
          The nightly container-runtime conformance run on \`main\` did not complete successfully.

          The gate below did not report \`success\` — a \`skipped\` or \`cancelled\` job means it never ran, which is **not** a green result:

          \`\`\`
          $not_green
          \`\`\`

          Run: $RUN_URL

          $podman_note

          This suite starts a real crew container built by the product's own \`buildCrewContainerConfig\` and reads the result back from inside it — /proc/self/status, /proc/mounts, the cgroup files, \`id\`, \`ulimit\`, \`getent\`. Values, not shapes. A red here means a HostConfig field we set is not being applied, and every one of those fails open and quiet: PidsLimit unapplied brings back the zombie leak #1666 fixed, \`core: 0\` unapplied writes the agent's credential environment to a host-persistent bind on the next crash, ReadonlyRootfs unapplied removes the reason a user-supplied base image is safe.

          Two things to check first, in this order:

          1. **Does it still compile?** \`go vet -tags conformance ./...\`. That is what was broken for 13 silent days in #2003, and it is gated on every pull request in \`ci.yml\` now — so if this is a build failure again, either the PR gate was bypassed or the break is in a GOOS that gate does not cover.
          2. **Read the failing assertion, not the job summary.** The test names the field, the value asked for, and the value read back out of the container.

          This issue auto-closes when the docker leg is green again."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
            echo "Updated existing alert issue #$existing"
          else
            gh issue create --repo "$REPO" \
              --title "$TITLE" \
              --label runtime-conformance-alert \
              --body "$body"
          fi
