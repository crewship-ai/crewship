name: Text Worker Release

# An independent release producer. Acceptance consumers never build a substitute.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish and sign a candidate from reviewed, verified main (operator authorization)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: text-worker-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require exact-source main verification
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: python3 scripts/ci/verified_commit.py "$REPO" "$SHA"
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af
        with:
          go-version-file: go.mod
      - name: Test the text runner
        run: go test ./cmd/crewship-restricted-runner -count=1 -timeout 5m
      - name: Prepare the licensed text worker context
        run: bash scripts/ci/prepare-text-release.sh "$RUNNER_TEMP/text-context"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: text-worker-context-${{ github.sha }}
          path: ${{ runner.temp }}/text-context/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: text-worker-context-${{ github.sha }}
          path: context
      - name: Restore executable modes after artifact transport
        run: chmod 0755 context/crewship-restricted-runner
      - name: Bind package and candidate tag
        id: target
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/crewship-restricted-text"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$image:responses-text-v1-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build independent immutable candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: context
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.target.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=responses-text-v1
          provenance: mode=max
          sbom: true
      - name: Verify distributed binary and legal contents
        env:
          IMAGE: ${{ steps.target.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint /bin/sh "$IMAGE" -ec '
              test -s /usr/share/licenses/crewship-text/go/manifest.tsv
              test -s /usr/share/licenses/crewship-text/project/THIRD-PARTY-NOTICES.md
              test -s /usr/share/crewship-text/release-source.json
              cd /opt && sha256sum -c /usr/share/crewship-text/runner.sha256
            '
      - name: Scan the candidate before signing
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439
        with:
          image: ${{ steps.target.outputs.image }}@${{ steps.build.outputs.digest }}
          fail-build: true
          severity-cutoff: critical
          output-format: table
      - name: Exercise the immutable candidate before signing
        env:
          IMAGE: ${{ steps.target.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE"
          image=$(docker image inspect --format '{{.Id}}' "$IMAGE")
          CREWSHIP_RESTRICTED_LIVE=1 CREWSHIP_RESTRICTED_PRODUCTION_IMAGE="$image" \
            go test -tags restrictedruntime_live ./internal/restricteddispatch \
              -run '^TestLiveProductionWorkerDurableAccounting$' -count=1 -timeout 10m -json > "$RUNNER_TEMP/text-worker-tests.jsonl"
          python3 - "$RUNNER_TEMP/text-worker-tests.jsonl" <<'PYTEST'
          import json, sys
          events = [json.loads(line) for line in open(sys.argv[1])]
          name = 'TestLiveProductionWorkerDurableAccounting'
          selected = [e['Action'] for e in events if e.get('Test') == name]
          if selected.count('run') != 1 or selected.count('pass') != 1 or 'skip' in selected or 'fail' in selected:
              raise SystemExit('The real text worker canary must execute and pass exactly once')
          PYTEST
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.3
      - name: Sign the verified candidate digest
        env:
          IMAGE: ${{ steps.target.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - name: Record candidate identity (acceptance approval remains separate)
        env:
          IMAGE: ${{ steps.target.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          jq --arg image "$IMAGE" --arg digest "$DIGEST" --arg run "$GITHUB_RUN_ID" \
            --arg workflow "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '. + {image:$image,digest:$digest,publisher_run:$run,publisher_url:$workflow}' \
            context/release-source.json > text-worker-candidate.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: text-worker-candidate-${{ github.sha }}
          path: |
            text-worker-candidate.json
            ${{ runner.temp }}/text-worker-tests.jsonl
          if-no-files-found: error
          retention-days: 30
