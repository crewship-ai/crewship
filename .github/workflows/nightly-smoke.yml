name: Nightly Smoke

# Verify the exact artifacts named by the successful Nightly run's manifest.
# Manual triage requires a run ID. Check archive boot, checksum signatures,
# package signatures and the immutable image digest; never select a rolling tag.

on:
  workflow_run:
    workflows: ["Nightly"]
    types: [completed]
  # Manual re-run for triage after a transient flake.
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Nightly workflow run ID to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nightly-smoke
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve immutable publication
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.manifest.outputs.sha }}
      image: ${{ steps.manifest.outputs.image }}
      release: ${{ steps.manifest.outputs.release }}
    steps:
      - name: Read the triggering run's publication manifest
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$REPO/actions/runs/$RUN_ID" > "$RUNNER_TEMP/run.json"
          jq -e --arg repo "$REPO" '.name == "Nightly" and .conclusion == "success" and .head_repository.full_name == $repo and .head_branch == "main"' "$RUNNER_TEMP/run.json"
          gh run download "$RUN_ID" --repo "$REPO" --name nightly-image-manifest --dir "$RUNNER_TEMP/publication"
          manifest="$RUNNER_TEMP/publication/image-manifest.json"
          sha=$(jq -er .sha "$manifest")
          digest=$(jq -er .digest "$manifest")
          image=$(jq -er .image "$manifest")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [ "$image" = "ghcr.io/${REPO%/*}/crewship" ]
          release=$(jq -er .release "$manifest")
          [[ "$release" =~ ^nightly-[0-9a-f]{12}-r[0-9]+-a[0-9]+$ ]]
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image=$image@$digest" >> "$GITHUB_OUTPUT"

  binary:
    needs: [resolve]
    name: Nightly binary smoke
    # Skip when the triggering Nightly run itself failed — no point
    # exercising a binary that never published. Always run on
    # workflow_dispatch (no triggering run to inspect).
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Checked out into a subdirectory so the repo tree can't satisfy the
      # archive-content assertions below (the extract step asserts LICENSE/
      # README/CHANGELOG exist in $PWD — a root checkout would make those
      # pass even when the archive dropped them). Only needed for
      # packaging/crewship-packages.pub, the committed public half of the
      # deb/rpm signing key (#932).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.3

      - name: Resolve and download nightly archive + checksums + signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Route github expressions through env so the shell never
          # interpolates them inline. CodeQL js/actions/code-injection
          # flags ${{ github.* }} in run: blocks even though these
          # values are not attacker-controllable in this workflow
          # (PR title / branch name don't reach github.repository, and
          # workflow_run.head_sha comes from Nightly, which only runs
          # on pushes to main). Matches the pattern PR #483 landed in
          # migration-lint.yml.
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release }}
        shell: bash
        run: |
          set -euo pipefail
          # The manifest names the exact release, even after another run of
          # this SHA publishes or the release falls outside the first API page.
          TAG="$RELEASE_TAG"
          [[ "$TAG" =~ ^nightly-[0-9a-f]{12}-r[0-9]+-a[0-9]+$ ]]
          gh api "repos/$REPO/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"
          jq -e --arg sha "$TARGET_SHA" '.prerelease == true and .target_commitish == $sha' "$RUNNER_TEMP/release.json"
          echo "Resolved nightly release: $TAG"
          echo "NIGHTLY_TAG=$TAG" >> "$GITHUB_ENV"
          # Resolve the exact asset name from the Releases API instead
          # of post-download globbing. goreleaser publishes TWO archive
          # families per platform since #444 — crewship_<v>_… (the full
          # server binary this smoke boots) and crewship-cli_<v>_… (the
          # clionly build, which has no `start`) — so the pattern must
          # anchor on the server prefix; a bare *linux_amd64.tar.gz*
          # match is ambiguous and once picked the CLI archive. Within
          # the server family, exactly one match is expected: per-run
          # releases are immutable (assets can't be added after
          # publish), so >1 means the publish itself uploaded duplicate
          # server variants and 0 means a partial publish (create
          # succeeded, uploads died). Fail loudly on both rather than
          # validating whichever asset sorts first.
          mapfile -t MATCHES < <(gh release view "$TAG" \
            --repo "$REPO" \
            --json assets \
            --jq '.assets[].name | select(test("^crewship_.*_linux_amd64\\.tar\\.gz$"))')
          if [ "${#MATCHES[@]}" -eq 0 ]; then
            echo "::error::no crewship_ server linux_amd64 archive on release $TAG — partial publish? (create succeeded, asset upload died; immutable releases can't be repaired in place — delete the release and re-run Nightly)"
            exit 1
          fi
          if [ "${#MATCHES[@]}" -gt 1 ]; then
            echo "::error::expected exactly one crewship_ server linux_amd64 archive on release $TAG, got ${#MATCHES[@]}:"
            printf '  %s\n' "${MATCHES[@]}"
            echo "::error::nightly.yml uploaded duplicate server variants — fix the publish step."
            exit 1
          fi
          ARCHIVE="${MATCHES[0]}"
          echo "Resolved archive: $ARCHIVE"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          gh release download "$TAG" \
            --repo "$REPO" \
            --pattern "$ARCHIVE" \
            --pattern 'checksums.txt' \
            --pattern 'checksums.txt.sig' \
            --pattern 'checksums.txt.pem'
          ls -la

      - name: Verify cosign signature on checksums.txt
        # PR #375 wired keyless cosign signing of checksums.txt into
        # nightly.yml. A missing or bad signature means either the
        # nightly publish didn't run sign-blob, or the bundle was
        # tampered with on GHCR / GitHub Releases. Either way, refuse
        # to trust the binary downstream.
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cosign verify-blob \
            --certificate checksums.txt.pem \
            --signature checksums.txt.sig \
            --certificate-identity-regexp "https://github\\.com/$REPO/\\.github/workflows/nightly\\.yml@.*" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            checksums.txt

      - name: Verify SHA-256 of the archive
        # Mirrors scripts/install.sh — same exact-second-field awk match
        # so the smoke test fails for the same reasons a user install
        # would. Catches a tampered archive even if checksums.txt itself
        # verified cosign-clean. ARCHIVE comes from the API-resolved
        # name in the previous step (via $GITHUB_ENV) so we never rely
        # on shell glob ordering.
        run: |
          set -euo pipefail
          EXPECTED=$(awk -v a="$ARCHIVE" '$2==a {print $1; exit}' checksums.txt)
          if [ -z "$EXPECTED" ]; then
            echo "::error::checksum for ${ARCHIVE} missing from checksums.txt"
            exit 1
          fi
          ACTUAL=$(sha256sum "$ARCHIVE" | awk '{print $1}')
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::checksum mismatch for ${ARCHIVE}"
            echo "  expected: $EXPECTED"
            echo "  actual:   $ACTUAL"
            exit 1
          fi
          echo "checksum ok: $ACTUAL"

      - name: Extract archive
        run: |
          set -euo pipefail
          tar -xzf "$ARCHIVE"
          ls -la crewship
          # Packaging contract (#858): the full archive must ship the sidecar
          # + entrypoint.sh next to the binary (else `crewship start` refuses
          # to boot for a tarball install), AND the legal/docs files an
          # explicit goreleaser `files:` block would otherwise drop (an
          # Apache-2.0 binary without its LICENSE is a compliance bug). Assert
          # both classes so neither regression can recur silently.
          for f in crewship-sidecar entrypoint.sh; do
            if [ ! -f "$f" ]; then
              echo "::error::archive is missing '$f' — full archive must bundle the sidecar runtime (#858)"
              exit 1
            fi
          done
          for pat in 'LICENSE*' 'README*' 'CHANGELOG*'; do
            # shellcheck disable=SC2086
            if ! ls $pat >/dev/null 2>&1; then
              echo "::error::archive is missing $pat — explicit files: block dropped goreleaser's default docs/legal files (#858)"
              exit 1
            fi
          done
          echo "packaging ok: crewship + crewship-sidecar + entrypoint.sh + LICENSE/README/CHANGELOG"

      - name: Probe `crewship version`
        # Nightly uses a snapshot version (no semver tag), so we just
        # assert non-empty output that ISN'T the unldflagged "dev"
        # sentinel — `dev` would mean -X main.version never made it
        # into the build (release.yml does it via -ldflags, snapshot
        # mode in nightly.yml inherits the same goreleaser config).
        run: |
          set -euo pipefail
          OUT=$(./crewship version)
          echo "$OUT"
          if [ -z "$OUT" ]; then
            echo "::error::'crewship version' produced no output"
            exit 1
          fi
          if echo "$OUT" | grep -qx "dev"; then
            echo "::error::'crewship version' returned the 'dev' sentinel — ldflag injection broke"
            exit 1
          fi

      - name: Probe `crewship doctor --no-color`
        # Same contract as the release smoke: exit 0 unless a FAIL check
        # fires. WARN is acceptable on a fresh CI runner with no Docker.
        run: |
          set -euo pipefail
          ./crewship doctor --no-color

      - name: Probe `crewship --help`
        run: |
          set -euo pipefail
          OUT=$(./crewship --help)
          if ! echo "$OUT" | grep -qF "Available Commands"; then
            echo "::error::--help output missing 'Available Commands' section"
            exit 1
          fi

      - name: Probe health endpoint via `crewship start --no-docker`
        # Port 9091 instead of 9090 (release smoke uses 9090) so a
        # rare parallel run on the same runner pool doesn't collide.
        # The port is set via CREWSHIP_PORT — `crewship start` has no
        # --port flag (internal/config reads the env; the first live
        # run of this probe failed with "unknown flag: --port").
        #
        # NEXTAUTH_SECRET / ENCRYPTION_KEY are required at startup by
        # server.New() (since #375 — used to be a silent fall-back
        # which served unauthenticated traffic). Seeding deterministic
        # 64-hex-char throwaways here lets the probe actually reach
        # /api/health; without them the binary panics inside server
        # construction and the probe just times out — green check on a
        # broken build.
        env:
          NEXTAUTH_SECRET: "00000000000000000000000000000000000000000000000000000000deadbeef"
          ENCRYPTION_KEY: "11111111111111111111111111111111111111111111111111111111cafebabe"
          CREWSHIP_PORT: "9091"
          # No CREWSHIP_SKIP_SIDECAR here (#858 packaging fix): the archive now
          # bundles crewship-sidecar + entrypoint.sh next to the binary, so
          # `crewship start` autodetects them and boots exactly as a tarball
          # user's would. This probe therefore proves the archive is bootable
          # as-shipped — the property the skip flag used to paper over.
        shell: bash
        run: |
          set -euo pipefail
          (./crewship start --no-docker >/tmp/crewship-start.log 2>&1 || true) &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          STATUS=0
          for _ in $(seq 1 120); do
            if curl -sf --max-time 1 http://localhost:9091/api/health >/dev/null 2>&1; then
              STATUS=200
              break
            fi
            sleep 0.25
          done

          if [ "$STATUS" != "200" ]; then
            echo "::error::health endpoint did not return 200 within 30s"
            echo "---- crewship start log ----"
            cat /tmp/crewship-start.log || true
            exit 1
          fi
          echo "health endpoint ok"

      - name: Download nightly deb/rpm packages
        # nightly.yml publishes the goreleaser nfpm packages alongside the
        # archives (it once dropped them from the upload glob, leaving
        # dangling .deb.sig/.rpm.pem assets — #932). Presence is enforced:
        # a nightly without packages means the publish glob regressed.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p pkg
          if ! gh release download "$NIGHTLY_TAG" \
            --repo "$REPO" \
            --dir pkg \
            --pattern 'crewship_*_linux_amd64.deb' \
            --pattern 'crewship_*_linux_amd64.rpm'; then
            echo "::error::release $NIGHTLY_TAG is missing its linux_amd64 deb/rpm packages — nightly.yml's asset upload glob dropped them (#932)"
            exit 1
          fi
          for ext in deb rpm; do
            if ! ls pkg/crewship_*_linux_amd64.$ext >/dev/null 2>&1; then
              echo "::error::release $NIGHTLY_TAG has no crewship_*_linux_amd64.$ext asset (#932)"
              exit 1
            fi
          done
          ls -la pkg

      - name: Verify GPG signatures on deb/rpm packages
        # End-to-end check of #932: the packages published for THIS commit
        # must verify against the committed public key
        # (packaging/crewship-packages.pub, fingerprint in
        # packaging/SIGNING.md). GPG_SIGNING_KEY is provisioned on this repo
        # (nightly.yml has logged "deb/rpm signing enabled" since
        # 2026-07-12), so signing is MANDATORY: an unsigned package fails,
        # and so does a signature that does not verify. The former soft-skip
        # branches predated the secret and would now hide a nightly that
        # silently stopped signing.
        run: |
          set -euo pipefail
          export GNUPGHOME=$(mktemp -d)
          gpg --batch --import repo/packaging/crewship-packages.pub
          DEB=$(ls pkg/crewship_*_linux_amd64.deb | head -1)
          RPM=$(ls pkg/crewship_*_linux_amd64.rpm | head -1)

          # deb — nfpm embeds a debsigs-style `_gpgorigin` ar member: a
          # detached signature over the concatenation of the remaining
          # members in ar order (debian-binary, control.tar.*, data.tar.*).
          # Verified with plain gpg because dpkg-sig only understands its
          # own _gpgbuilder manifest format, not debsigs signatures. The
          # keyring above holds ONLY the Crewship Packages key, so a "Good
          # signature" can't come from any other signer.
          WORK=$(mktemp -d)
          (cd "$WORK" && ar x "$OLDPWD/$DEB")
          if [ ! -f "$WORK/_gpgorigin" ]; then
            echo "::error::deb is UNSIGNED (no _gpgorigin member) — nightly packages must be GPG-signed (#932)"
            exit 1
          else
            cat "$WORK/debian-binary" "$WORK"/control.tar.* "$WORK"/data.tar.* \
              | gpg --batch --verify "$WORK/_gpgorigin" -
            echo "deb GPG signature ok"
          fi

          # rpm — the signature lives in the rpm header; `rpm -K` against a
          # scratch rpmdb (so the runner's system keyring is never touched)
          # with the public key imported. Output contract (mirrors
          # smoke-test.yml): "signatures OK" = signed and valid,
          # "NOT OK" = signed but bad, anything else = unsigned digests-only.
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm >/dev/null
          RPMDB=$(mktemp -d)
          rpm --dbpath "$RPMDB" --initdb
          rpm --dbpath "$RPMDB" --import repo/packaging/crewship-packages.pub
          OUT=$(rpm --dbpath "$RPMDB" -K "$RPM" 2>&1 || true)
          echo "$OUT"
          if echo "$OUT" | grep -qi "NOT OK"; then
            echo "::error::rpm signature check failed"
            exit 1
          elif echo "$OUT" | grep -qi "signatures OK"; then
            echo "rpm GPG signature ok"
          else
            echo "::error::rpm is UNSIGNED (digests only) — nightly packages must be GPG-signed (#932)"
            exit 1
          fi

  docker:
    name: Nightly Docker smoke (published digest)
    needs: [resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.3
      - name: Verify signature and boot the published digest
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          SHA: ${{ needs.resolve.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          cosign verify --certificate-identity "https://github.com/$REPO/.github/workflows/nightly.yml@refs/heads/main" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE"
          bash scripts/ci/smoke-image.sh "$IMAGE" "$SHA"
