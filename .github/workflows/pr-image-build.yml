name: PR Image Build

# Reusable image gate in CI. The change plan covers all build-context inputs;
# CI Result requires this job when code changes. Build locally, then boot the
# exact image without pushing PR code to the registry.
on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

# Cancellation is owned by the calling workflow.
jobs:
  build:
    name: PR Image Build
    runs-on: ubuntu-latest
    # release.yml's docker job gets 45 for a multi-arch (amd64+arm64) push
    # under QEMU. This builds linux/amd64 only, natively, with no push and no
    # signing — a PR wants a verdict quickly, and every failure class this
    # guards against (#849/#886's missing COPY, a `pnpm prisma generate` or
    # `pnpm build` break, the #1567 web/out gate) is architecture-independent,
    # so amd64-only loses no coverage that matters here.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # `load: true` pulls the built image into the runner's local Docker
      # daemon so the smoke step below can `docker run` it directly — no
      # registry round-trip, and nothing is pushed anywhere (no `push:` key
      # at all; `load` and `push` are mutually exclusive in buildx). A
      # separate GHA cache scope from release.yml / nightly.yml's default
      # scope keeps this job's frequent, throwaway PR builds from evicting
      # the layers those two release paths depend on.
      - name: Build image (no push)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6.18.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          tags: crewship:pr-build
          build-args: |
            VERSION=ci-${{ github.sha }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
          cache-from: type=gha,scope=pr-image-build
          cache-to: type=gha,mode=max,scope=pr-image-build

      # Same probe smoke-test.yml's "Smoke Docker image" job runs post-release
      # against the published tag, minus the registry pull — the image never
      # left this runner. Cheap (a container start + exit), and it is the one
      # check that proves the multi-stage COPY chain produced a binary that
      # actually runs, not just one that compiled.
      - name: Probe `crewship version` inside the built image
        run: |
          set -euo pipefail
          VERSION="ci-${{ github.sha }}"
          OUT=$(docker run --rm crewship:pr-build version)
          echo "$OUT"
          if ! echo "$OUT" | grep -qF "$VERSION"; then
            echo "::error::container 'crewship version' output did not contain the build's own version string ($VERSION)"
            exit 1
          fi

      - name: Verify image boot and embedded UI
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: bash scripts/ci/smoke-image.sh crewship:pr-build "$EXPECTED_SHA"
