name: Isolated Browser Evidence

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact product commit in this repository
        required: true
        type: string
      suite:
        description: Targeted browser suite
        required: true
        type: choice
        options: [settings, runtime, chat, graphs]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CANDIDATE: ${{ inputs.candidate }}
      SUITE: ${{ inputs.suite }}
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Validate exact input
        shell: bash
        run: '[[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: candidate
          ref: ${{ inputs.candidate }}
          persist-credentials: false
      - uses: ./.github/actions/setup-go-embed
        with:
          go-version: '1.27.4'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          package_json_file: candidate/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml
      - name: Run authenticated browser checks on the exact commit
        working-directory: candidate
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          build_root=$(mktemp -d "$RUNNER_TEMP/crewship-browser-XXXXXX")
          export CREWSHIP_THROWAWAY_STATE="$build_root/state"
          export BROWSER_EVIDENCE="$RUNNER_TEMP/browser-evidence"
          mkdir -p "$BROWSER_EVIDENCE"
          case "$SUITE" in
            settings) route=/settings/members; spec=settings-h2.spec.ts ;;
            runtime) route=/crews; spec=shell-overflow.spec.ts ;;
            chat) route=/chat/jordan; spec=shell-overflow.spec.ts ;;
            graphs) route=/graph-check; spec=harbor2-shell.spec.ts ;;
            *) exit 2 ;;
          esac
          bash ../scripts/browser-runner/check.sh "$build_root" "$CANDIDATE" "$route" "$spec"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: browser-${{ inputs.suite }}-${{ inputs.candidate }}
          path: |
            ${{ runner.temp }}/browser-evidence/
            candidate/test-results/
            candidate/playwright-nightly-report.json
          if-no-files-found: warn
          retention-days: 14
