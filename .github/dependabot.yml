version: 2

# Grouping policy — one rule, applied to every entry below.
#
# Minor and patch version updates travel together in one PR per *group*.
# Majors and security updates stay on their own.
#
# "Per group", not "per ecosystem", and the difference is not pedantry:
# Dependabot opens one PR per group that has updates, npm defines three
# groups, and an ecosystem spread over several `directory:` entries — the
# composite actions below, the two Dockerfiles — is several entries, each
# with its own group and so its own PR. Expect a handful on a busy Monday,
# not one.
#
# Why (#1868): on 2026-08-10 a single Monday produced fourteen open PRs,
# because only the npm entry had `groups` — gomod, github-actions, docker and
# docker-compose each opened one PR per package. Eight of those fourteen
# shared go.mod/go.sum (five) or package.json/pnpm-lock.yaml (three), so
# within each set no merge order avoided rebasing the rest, and landing them
# meant hand-building an integration branch. Grouped, that same Monday is
# seven PRs: one for gomod, one for the workflow actions plus one for the
# `actions/stale` major, one for the composite action, and npm's three
# (its group, plus the motion and react-intersection-observer majors).
#
# The two carve-outs are deliberate, not laziness:
#
#   `applies-to: version-updates` leaves **security** updates ungrouped.
#   A CVE fix should be reviewable and mergeable on its own, not queued
#   behind an unrelated minor that happens to be failing CI.
#
#   `update-types: [minor, patch]` leaves **majors** ungrouped. A major is
#   where the breaking change lives — motion 13 dropped a prop filter and
#   otel 1.45 silently rerouted trace export — and each deserves its own
#   changelog read and its own revert boundary.
#
# Adding an ecosystem? Give it the same `groups` block. A missing one is
# invisible until the Monday it floods the PR list.
updates:
  # NPM dependencies (works with pnpm)
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      production-dependencies:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "@types/*"
      development-dependencies:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "@types/*"
      typescript-types:
        applies-to: version-updates
        patterns:
          - "@types/*"
        update-types:
          - "minor"
          - "patch"

  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-modules:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  # Weekly cadence (not monthly): every action in .github/workflows/ and
  # .github/actions/ is SHA-pinned for supply-chain hardening (see CRE-122).
  # SHA pins don't auto-receive security patches the way version pins do,
  # so this ecosystem needs the same weekly velocity as npm/gomod or
  # patches sit for up to 4 weeks before reaching main.
  #
  # `directory: "/"` covers .github/workflows/ ONLY. Composite actions under
  # .github/actions/<name>/action.yml are invisible to it and need one entry
  # each, below — without them their pins freeze silently: by 2026-07-20
  # setup-node-pnpm was three majors behind (v4.4.0 while the workflows ran
  # v7.0.0) and nothing reported it. Add an entry whenever a composite
  # action lands at a new path.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci/cd"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/.github/actions/setup-go-embed"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci/cd"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/.github/actions/setup-node-pnpm"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci/cd"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # Docker base images
  # The root Dockerfile (node:24-alpine + golang:1.27-alpine + alpine:3.23
  # multi-stage) and docker/crewship-sandbox (debian:bookworm-slim) all
  # use floating tags. Audit M15 flagged that this lets a published patch
  # release of the base sit unreviewed in CI forever -- Dependabot
  # surfaces those bumps as PRs so the maintainer sees them.
  #
  # Each Dockerfile directory needs its own entry; Dependabot doesn't walk
  # the repo. Add a new one here when a Dockerfile lands at a new path.
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-images:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/docker/crewship-sandbox"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-images:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # docker/docker-compose.yml pins postgres:18-alpine on a floating tag.
  # Dependabot's docker-compose ecosystem (separate from `docker` for
  # Dockerfiles) surfaces patch / minor releases of every image
  # referenced from a compose file in this directory.
  - package-ecosystem: "docker-compose"
    directory: "/docker"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-compose-images:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
