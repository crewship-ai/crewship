name: Setup Node + pnpm
description: >
  Checkout-less composite action that installs pnpm + Node with cache, runs
  `pnpm install --frozen-lockfile`, and generates the Prisma TS client.
  Shared by Frontend and Frontend Test so the setup lives in one place.

inputs:
  node-version:
    description: Node.js version
    required: true
  pnpm-version:
    description: >
      pnpm version. Deprecated and ignored — pnpm/action-setup reads the
      `packageManager` field from package.json, and passing `version:`
      alongside it errors out with ERR_PNPM_BAD_PM_VERSION. Kept as an
      input so existing call sites that still pass it do not break;
      remove from callers and then from here.
    required: false

runs:
  using: composite
  steps:
    # Version-less invocation: pnpm/action-setup picks up
    # `packageManager: pnpm@X.Y.Z` from package.json so CI, the
    # Dockerfile (via corepack), and dev laptops all install the
    # exact same pnpm.
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    # Bounded, because this is a third-party registry and #1998 is what a
    # third-party registry hanging inside an unbounded step costs: the job
    # budget is spent in silence and GitHub reports the result as `cancelled`.
    # Composite-action steps cannot carry `timeout-minutes`, so the deadline is
    # `timeout(1)` — which is the innermost one anyway, and therefore the one
    # that should fire first. ~40 s warm; 8 minutes is "the registry is gone",
    # not a budget.
    - shell: bash
      run: |
        set -uo pipefail
        rc=0
        timeout --kill-after=30s 8m pnpm install --frozen-lockfile || rc=$?
        if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
          echo "::error::'pnpm install --frozen-lockfile' exceeded 8 minutes and was killed. That is a registry/network stall, not a lockfile problem."
        fi
        exit "$rc"

    - shell: bash
      env:
        DATABASE_URL: "file:./dev.db"
      run: pnpm db:generate
