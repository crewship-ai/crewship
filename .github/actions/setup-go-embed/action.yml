name: Setup Go + embed guard
description: >
  Installs Go with module cache and asserts the tracked
  `web/out/.placeholder.html` is present, which is what satisfies
  `web/embed.go`'s `go:embed all:out` directive on a plain checkout.
  This used to CREATE a `web/out/index.html` stub; the placeholder is
  tracked in git now (#1567), so the job's only remaining interest is
  that nobody deleted it.

inputs:
  go-version:
    description: Go version
    required: true

runs:
  using: composite
  steps:
    # Cache is ENABLED here. On ephemeral GitHub-hosted ubuntu-latest
    # runners, $GOMODCACHE and $GOCACHE start cold every run; without
    # the action's built-in cache layer, every Go-touching job would
    # re-download ~100-300 MB of modules and re-build the toolchain
    # cache from scratch — adding ~60-90s per job. actions/setup-go's
    # cache restore + post-step save amortises that across runs.
    #
    # Historical note: this used to be `cache: false` because CI ran
    # on a persistent self-hosted MBA M3 (mba-m3-arm64) where the
    # local disk was already warm and the cache CDN's tar+upload
    # ~35s post-step budget could trip (PR #240 / run 25204871572
    # observed `golangci-lint pass in 6s → post-step cache-save
    # killed mid-tar → job went red`). Once we moved off self-hosted
    # in PR #4XX, the persistence assumption no longer holds and the
    # post-step cancel risk is the lesser evil compared to ~75s of
    # repeat downloads per job.
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ inputs.go-version }}
        cache: true

    # Fail with a sentence instead of `pattern all:out: no matching files
    # found`, which points at web/embed.go and reads like a compile error
    # in whatever the PR actually changed.
    - shell: bash
      run: |
        if [ ! -f web/out/.placeholder.html ]; then
          echo "::error file=.gitignore::web/out/.placeholder.html is missing. It is tracked in git and is what makes web/embed.go's //go:embed all:out resolve on a bare checkout (#1567). It was probably deleted by a 'git add -A' after a build that wiped web/out/ — restore it with 'git checkout -- web/out/.placeholder.html'."
          exit 1
        fi
