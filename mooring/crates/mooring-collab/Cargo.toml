[package]
name = "mooring-collab"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
wordcraft-binding-experiment = []
wordcraft-command-experiment = ["serde_json/float_roundtrip", "dep:sha2"]

[dependencies]
sha2 = { version = "=0.10.9", optional = true }
mooring-core = { path = "../mooring-core" }
mooring-protocol = { path = "../mooring-protocol" }
serde_json = "=1.0.154"
serde = { version = "=1.0.229", features = ["derive"] }
mooring-wordcraft = { path = "../mooring-wordcraft" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
mooring-text = { path = "../mooring-text" }
yrs = "=0.28.0"

[[bin]]
name = "mooring-wordcraft-command-host"
path = "src/command_host_main.rs"
required-features = ["wordcraft-command-experiment"]

[[example]]
name = "binding_prepare_host"
required-features = ["wordcraft-binding-experiment"]

[[example]]
name = "binding_prepare_fixture"
required-features = ["wordcraft-binding-experiment"]

[[test]]
name = "binding_prepare"
required-features = ["wordcraft-binding-experiment"]
