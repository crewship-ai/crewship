# This file is intentionally local to scripts/api-contract.
# The runner supplies the phase and safety filters at invocation time.
base-url = "${CREWSHIP_BASE_URL}"
headers = { Authorization = "Bearer ${CREWSHIP_TOKEN}", "X-Workspace-ID" = "${CREWSHIP_WORKSPACE}" }
request-timeout = 10.0
workers = 1

[generation]
max-examples = 10
database = ":memory:"
deterministic = true

[phases]
stateful.enabled = false

# Disable mutation-capable operations in every phase, including stateful.
[[operations]]
exclude-method = "POST"
enabled = false

[[operations]]
exclude-method = "PUT"
enabled = false

[[operations]]
exclude-method = "PATCH"
enabled = false

[[operations]]
exclude-method = "DELETE"
enabled = false
