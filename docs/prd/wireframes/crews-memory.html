<!doctype html>
<html lang="cs">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crews & Agents — návrh Memory</title>
<style>
:root{color-scheme:dark;--bg:#060607;--panel:#101013;--line:#27272d;--muted:#a0a0ad;--text:#eeeef2;--blue:#4295ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,sans-serif}button,input,select,textarea{font:inherit}button,select{cursor:pointer}button,a,input,select,textarea{outline-offset:4px}button{color:inherit;background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 12px}button:hover{background:#1c1c24}button[aria-pressed=true]{background:#12223a;border-color:#306bab;color:#8bbfff}button:disabled{opacity:.45;cursor:default}a{color:var(--blue)}p{margin:6px 0 16px}.muted,small{color:var(--muted)}small{font-size:12px}.demo{padding:9px 20px;background:#111a29;border-bottom:1px solid #263851;color:#b6c9e6;display:flex;justify-content:space-between;gap:14px;align-items:center;font-size:12px}.demo select{background:#111822;border:1px solid #38516e;border-radius:6px;color:inherit;padding:4px;max-width:100%}.shell{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 49px)}aside{padding:24px 14px;border-right:1px solid var(--line);background:#0c0c10}aside h2{font-size:13px;margin:0 10px 18px}aside input{width:100%;margin-bottom:20px}input,textarea{background:#08080b;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 12px;min-width:0}aside button{width:100%;text-align:left;margin:3px 0;border-color:transparent}aside .agent{padding-left:30px}.dot{display:inline-block;width:7px;height:7px;background:#69697a;border-radius:50%;margin-right:9px}.avatar{display:grid;place-items:center;width:44px;height:44px;background:#6035a3;border-radius:16px;font-size:20px;flex-shrink:0}main{padding:28px 40px;max-width:1500px;width:100%;min-width:0}.entity{display:flex;align-items:center;gap:14px}.entity h1{font-size:25px;margin:0;line-height:1.2}.actions{margin-left:auto;display:flex;gap:8px}.primary{background:#173455;border-color:#2b69a5;color:#a8d1ff}.tabs{display:flex;gap:22px;margin:28px 0 24px;border-bottom:1px solid var(--line)}.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;padding:10px 0;color:var(--muted)}.tabs button[aria-pressed=true]{border-bottom-color:var(--blue);background:none;color:var(--text)}.section-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.section-head h2{font-size:19px;margin:0}.section-head p{margin:4px 0 0}.scope{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:25px}.columns{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(240px,1fr);gap:20px}.panel{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:20px;margin-bottom:18px}.panel h3{margin:0 0 12px;font-size:14px;font-weight:600}.item{display:block;width:100%;border:0;border-top:1px solid var(--line);border-radius:0;text-align:left;padding:14px 0}.item:first-of-type{border-top:0}.item strong{font-weight:500;display:block}.item small{display:block;margin-top:3px}.item:hover{background:transparent;color:#a8d1ff}.tag{display:inline-block;padding:2px 7px;border:1px solid #38404e;border-radius:5px;font-size:11px;color:#c0cbdb;margin:0 6px 8px 0}.notice{border:1px solid #614924;background:#201a10;padding:15px 18px;border-radius:10px;color:#e5c58a;margin-bottom:18px}.quiet{background:#10141b;border-color:#303c50;color:#c2ccdc}.statusrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.statusrow:last-child{border:0}.statusrow span:last-child{text-align:right}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:20px}.summary .panel{margin:0}.summary strong{display:block;font-size:24px;margin:7px 0}.empty{padding:40px 18px;text-align:center}.empty h3{font-size:17px}.footer-note{font-size:12px;color:var(--muted);margin-top:24px}dialog{background:#111115;color:var(--text);border:1px solid #37373f;border-radius:16px;padding:25px;max-width:760px;width:calc(100% - 32px);max-height:85vh;overflow:auto}dialog::backdrop{background:#000b}dialog header{display:flex;align-items:center;justify-content:space-between;gap:15px}dialog h2{font-size:21px;margin:0}dialog .body{margin:20px 0}dialog footer{display:flex;justify-content:flex-end;gap:10px;padding-top:18px;border-top:1px solid var(--line)}label.field{display:grid;gap:6px;margin:16px 0}textarea{width:100%;min-height:130px;resize:vertical}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:14px 20px;background:#18334e;border:1px solid #397bb4;border-radius:10px;max-width:90vw}#toast:empty{display:none}details{margin-top:15px}summary{cursor:pointer}.document{white-space:pre-wrap;background:#0b0b0e;padding:20px;border-radius:8px}.icon{color:#8bbfff;margin-right:8px}@media(max-width:950px){main{padding:25px}.shell{grid-template-columns:190px 1fr}.columns{grid-template-columns:1fr}.section-head{align-items:flex-start;flex-direction:column}}@media(max-width:620px){.demo{flex-direction:column;align-items:flex-start}.shell{display:block}aside{padding:12px;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:8px}aside h2,aside input,aside small{display:none}aside button{padding:8px!important;width:auto;flex:1;text-align:center}main{padding:22px 16px}.entity{flex-wrap:wrap}.actions{margin-left:0;width:100%;margin-top:10px}.summary{grid-template-columns:1fr}.summary .panel{padding:12px 16px}.summary strong{display:inline;font-size:18px;margin-left:14px}.tabs{gap:20px;margin-top:18px}.section-head input{width:100%}.avatar{width:36px;height:36px}.panel{padding:16px}}
</style>
<div class="demo"><span><strong>Klikací návrh · modelová data</strong> — neovládá živou aplikaci. Vyzkoušejte Memory, O mně, Edit a stavy dat.</span><label>Scénář <select id="scenario"><option value="ready">Obsah dostupný</option><option value="history-off">Obsah dostupný, historie vypnutá</option><option value="current">Dnešní omezení: pouze nedostupná historie</option><option value="empty">Nový agent</option><option value="error">Načtení selhalo</option></select></label></div>
<div class="shell"><aside><h2>Crews & Agents</h2><input aria-label="Hledat ve stromu" placeholder="Hledat crew nebo agenta…" id="tree-search"><small>VAŠE TÝMY</small><button data-entity="crew"><span class="icon">▣</span>Copy site</button><button data-entity="agent" class="agent" aria-pressed="true"><span class="dot"></span>Kodi</button></aside>
<main><header class="entity"><div class="avatar" id="avatar">K</div><div><h1 id="name">Kodi</h1><small id="description">Vývoj a údržba webu · Copy site</small></div><div class="actions"><button class="primary" id="chat">Chat</button><button id="files">Files</button><button id="edit">✎ Edit agent</button></div></header><nav class="tabs" aria-label="Sekce detailu" id="main-tabs"></nav><div id="view"></div><p class="footer-note">Návrh informační struktury. Ukázkové znalosti, časy a metriky nejsou údaje z Dev2.</p></main></div>
<dialog id="detail"><header><h2 id="detail-title"></h2><button data-close="detail" aria-label="Zavřít detail">✕</button></header><div class="body" id="detail-body"></div><footer><button data-close="detail">Zavřít</button></footer></dialog>
<dialog id="editor"><header><div><small id="edit-context">Copy site / Kodi</small><h2 id="edit-title">Edit agent</h2></div><button data-close="editor" aria-label="Zavřít editor">✕</button></header><nav class="tabs" aria-label="Sekce editoru" id="editor-tabs"></nav><div id="editor-body"></div><footer><button data-close="editor">Zrušit</button><button class="primary" id="save">Uložit ukázku</button></footer></dialog><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);let entity='agent',tab='Memory',scope='agent',editTab='Základní',query='';
const docs={agent:[['Postup před předáním webu','Ověřit odkazy, responzivitu a výstup buildu.','Znalosti agenta','Před předáním webu ověř odkazy a chování na mobilu.\nSpusť kontrolu buildu a zaznamenej případná omezení.'],['Poznámky z poslední práce','Rozpracovaná kontrola formuláře pro kontakt.','Pracovní poznámky','Zbývá ověřit zpětnou vazbu po odeslání kontaktního formuláře.\nTyto poznámky jsou pracovní kontext, nikoliv schválené pravidlo.']],shared:[['Pravidla publikování','Změny webu před zveřejněním procházejí kontrolou.','Crew · Copy site','Každá změna před zveřejněním projde kontrolou odpovědným člověkem.'],['Jazyk zákaznických výstupů','Pro tento workspace používat češtinu.','Workspace','Zákaznické výstupy připravujeme česky.']],me:[['Preferovaný formát předání','Stručný výsledek a odkaz na změnu.','Moje pracovní preference','- delivery_format: stručný výsledek a odkaz na změnu\n\nModelový příklad deklarované preference, nikoliv úsudek o osobnosti.']]};
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){$('#toast').textContent=t;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').textContent='',4500)}
function rows(items,key){return items.map((d,i)=>`<button class="item" data-doc="${key}:${i}"><strong>${esc(d[0])}</strong><small>${esc(d[1])}</small><small>${esc(d[2])} · aktualizováno včera · ukázka</small></button>`).join('')}
function render(){
 $('#name').textContent=entity==='agent'?'Kodi':'Copy site';$('#avatar').textContent=entity==='agent'?'K':'▣';$('#description').textContent=entity==='agent'?'Vývoj a údržba webu · Copy site':'Tým pro přípravu a správu webu';$('#edit').textContent=entity==='agent'?'✎ Edit agent':'✎ Edit crew';
 document.querySelectorAll('[data-entity]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.entity===entity));
 $('#main-tabs').innerHTML=(entity==='agent'?['Overview','Work','Memory']:['Overview','Team','Work','Memory']).map(t=>`<button data-tab="${t}" aria-pressed="${tab===t}">${t}</button>`).join('');
 if(tab==='Memory')renderMemory();else if(tab==='Overview')renderOverview();else if(tab==='Team')$('#view').innerHTML='<div class="section-head"><div><h2>Členové týmu</h2><p class="muted">Role a aktuální práce na jednom místě.</p></div></div><section class="panel"><button class="item" data-entity="agent"><strong>Kodi · vývojář</strong><small>Kontrola kontaktního formuláře · otevřít agenta</small></button></section>';else $('#view').innerHTML='<div class="section-head"><div><h2>Práce</h2><p class="muted">Úkoly, výsledky a automatizace tohoto '+(entity==='agent'?'agenta':'týmu')+'.</p></div></div><section class="panel"><h3>Rozpracované</h3><button class="item" data-info="V produktu se otevře konkrétní úkol se zachovaným návratem do detailu."><strong>Ověřit kontaktní formulář</strong><small>Čeká na pokračování · Kodi · modelový úkol</small></button></section><section class="panel"><h3>Automatizace</h3><p class="muted">Zatím žádná automatizace. Její absence není chyba.</p></section>';
}
function renderMemory(){const s=$('#scenario').value;const actual=entity==='crew'&&scope==='agent'?'shared':scope;const title=actual==='agent'?'Znalosti agenta':actual==='shared'?'Sdílené znalosti':'O mně';
 let head=`<div class="section-head"><div><h2>${title}</h2><p class="muted">${actual==='me'?'Co je uloženo o vaší spolupráci a jak se to používá.':'Poznatky uchované pro další práci. Každý má svůj rozsah a původ.'}</p></div><input id="knowledge-search" aria-label="Hledat ve znalostech" placeholder="Hledat ve znalostech…" value="${esc(query)}"></div><div class="scope">${(entity==='agent'?[['agent','Znalosti agenta'],['shared','Sdílené znalosti'],['me','O mně']]:[['shared','Znalosti týmu'],['me','O mně']]).map(([k,n])=>`<button data-scope="${k}" aria-pressed="${actual===k}">${n}</button>`).join('')}</div>`;
 let content='';if(s==='current')content='<div class="notice"><strong>Aktuální obsah zde zatím nelze načíst.</strong><br>Historie změn není zapnutá. To neznamená, že agent nemá uložené znalosti.</div><section class="panel"><h3>Co můžete ověřit</h3><p class="muted">Aktuální soubory a nastavení historie může prověřit správce. Nový návrh odděluje čtení obsahu od verzování.</p><button data-info="Návrh: detail diagnostiky pro správce, s konkrétním stavem storage a historie.">Podrobnosti dostupnosti</button></section>';
 else if(s==='error')content='<section class="panel empty"><h3>Znalosti se nepodařilo načíst</h3><p class="muted">Počet ani obsah teď neznáme.</p><button id="retry">Zkusit znovu</button></section>';
 else if(s==='empty')content='<section class="panel empty"><h3>Zatím žádné uložené znalosti</h3><p class="muted">Až vzniknou pracovní poznatky, najdete je tady.</p><button class="primary" data-info="V produktu otevře existující chat s agentem. Samotné otevření nespustí žádnou práci.">Otevřít chat</button></section>';
 else{let items=docs[actual];let filtered=items.map((d,i)=>[d,i]).filter(([d])=>d.join(' ').toLowerCase().includes(query.toLowerCase()));content=`<div class="columns"><div><section class="panel"><h3>${actual==='me'?'Pracovní preference':actual==='shared'?'Tým a workspace':'Dlouhodobé znalosti a poznámky'}</h3>${filtered.length?filtered.map(([d,i])=>`<button class="item" data-doc="${actual}:${i}"><strong>${esc(d[0])}</strong><small>${esc(d[1])}</small><small>${esc(d[2])} · modelový záznam</small></button>`).join(''):'<p class="muted">Žádný záznam neodpovídá hledání.</p>'}</section>${actual==='me'?'<section class="panel"><h3>Spolupráce s Kodi</h3><p class="muted">Automatické vytváření vztahových karet zatím není zapojené. Samotné další zprávy vznik karty nezaručí.</p></section>':'<p class="muted">Návrhy nových poznatků se zde objeví, pokud budou vyžadovat schválení.</p>'}</div><div><section class="panel"><h3>${actual==='me'?'Použití osobních preferencí':'Dostupnost znalostí'}</h3><div class="statusrow"><span>Obsah</span><span>Dostupný · ukázka</span></div><div class="statusrow"><span>Historie</span><span>${s==='history-off'?'Není zapnutá':'Dostupná · ukázka'}</span></div><p class="muted" style="margin-top:16px">${actual==='me'?'Pro vlastní profil použít stejné nastavení jako v Privacy. Rozsah oprávnění a doručování musí potvrzovat backend.':'Dostupný poznatek nemusí být použitý v každém běhu. Konkrétní použití musí doložit záznam běhu.'}</p>${actual==='me'?'<button data-info="Návrh: společný self-service pohled pro vlastní user model, peer karty a preference ukládání.">Spravovat ukládání o mně</button>':'<button data-info="Návrh: zvolit běh a zobrazit doložené zdroje kontextu. Tato evidence vyžaduje doplnění backendu.">Jak se znalosti používají</button>'}</section>${actual!=='me'?'<section class="panel"><h3>Instrukce a chování</h3><p class="muted">Nastavení chování má jeden editor. Od znalostí získaných prací je oddělené.</p><button id="open-instructions">Otevřít instrukce</button></section>':''}</div></div>`}$('#view').innerHTML=head+content;
}
function renderOverview(){const s=$('#scenario').value;if(s==='empty'){$('#view').innerHTML='<section class="panel empty"><h3>Připraveno na první zadání</h3><p class="muted">Začněte rozhovorem nebo přiřazením úkolu.</p><button class="primary" data-info="V produktu otevře chat. Nevytvoří práci bez zadání.">Otevřít chat</button></section>';return}$('#view').innerHTML='<div class="notice quiet"><strong>Aktuální práce: kontrola kontaktního formuláře</strong><br>Čeká na pokračování. Není vyžadováno vaše rozhodnutí.</div><div class="summary"><section class="panel"><small>Dokončené běhy · 7 dní</small><strong>12</strong></section><section class="panel"><small>Běhy s chybou · 7 dní</small><strong>1</strong></section><section class="panel"><small>Evidované náklady · tento měsíc</small><strong>$3.40</strong></section></div><div class="columns"><section class="panel"><h3>Poslední výsledky</h3><button class="item" data-info="V produktu odkaz na konkrétní výsledek a jeho zdrojový úkol."><strong>Kontrola odkazů dokončena</strong><small>Nalezeny dva odkazy k opravě · před 2 hodinami</small></button><button class="item" data-tab="Work"><strong>Zobrazit veškerou práci →</strong></button></section><section class="panel"><h3>Poslední konverzace</h3><button class="item" data-info="V produktu otevře konkrétní existující konverzaci, se zachováním oprávnění."><strong>Vy a Kodi</strong><small>„Prosím ještě ověř mobilní zobrazení.“ · včera</small></button></section></div><button data-tab="Memory">Prohlédnout znalosti →</button>'}
function openDoc(k,i){const d=docs[k][i];$('#detail-title').textContent=d[0];$('#detail-body').innerHTML=`<span class="tag">${d[2]}</span><span class="tag">Modelový obsah</span><div class="document">${esc(d[3])}</div><p class="muted" style="margin-top:18px">${k==='me'?'Zobrazený klíč odpovídá strukturovanému profilu. Přesný odkaz na původní výrok současný backend ještě neukládá.':'Jeden dokument s vlastním rozsahem. Návrh změny a případná historie patří k tomuto dokumentu.'}</p><details><summary>Historie změn</summary><p class="muted">${$('#scenario').value==='history-off'?'Historie změn není zapnutá. Aktuální obsah je přesto dostupný.':'Ukázka: poslední aktualizace včera. Ve výsledné aplikaci budou skutečné revize a jejich rozdíly.'}</p></details><details><summary>Zdroj a technické podrobnosti</summary><p class="muted">${k==='me'?'User model · vlastní profil':k==='shared'?'Sdílený dokument · crew / workspace':'Agentový dokument · AGENT.md / daily notes'}. Jde o návrh; žádná data se nenačítají z API.</p></details>`;$('#detail').showModal()}
function openEdit(section='Základní'){editTab=section;$('#edit-title').textContent=entity==='agent'?'Edit agent':'Edit crew';$('#edit-context').textContent=entity==='agent'?'Copy site / Kodi':'Copy site';renderEditor();$('#editor').showModal()}
function renderEditor(){const sections=['Základní','Instrukce','Přístupy','Pokročilé'];$('#editor-tabs').innerHTML=sections.map(s=>`<button data-edit-tab="${s}" aria-pressed="${s===editTab}">${s}</button>`).join('');$('#editor-body').innerHTML=editTab==='Základní'?`<label class="field">Jméno<input value="${entity==='agent'?'Kodi':'Copy site'}"></label><label class="field">Účel<textarea>${entity==='agent'?'Pomáhá s vývojem a údržbou webu.':'Tým pro přípravu a správu webu.'}</textarea></label><p class="muted">Create a Edit používají stejná pole a validaci. Edit zachová existující slug.</p>`:editTab==='Instrukce'?'<span class="tag">Zdroj: vlastní instrukce · ukázka</span><label class="field">Jak má agent pracovat<textarea>Popiš výsledek práce stručně a připoj odkaz na změnu. Pokud zadání není jasné, nejdřív ověř potřebné podrobnosti.</textarea></label><p class="muted">Zdroj agent / crew / default musí být přesně rozlišený. Tento návrh neslučuje současné system_prompt a PERSONA bez backendové změny.</p>':editTab==='Přístupy'?'<section class="panel"><h3>Aplikace a dovednosti</h3><p class="muted">Efektivní přístupy zobrazují vlastní i zděděné položky. Úprava děděného přístupu vede do crew.</p><span class="tag">GitHub · zděděno z crew · ukázka</span></section>':'<section class="panel"><h3>Paměť a učení</h3><p class="muted">Používání znalostí, ukládání osobních preferencí, samostatné učení a historie jsou různé mechanismy.</p><button data-info="Ve finálním editoru se zobrazí skutečné capabilities a dopad změny. Návrh žádný přepínač serveru nemění.">Zobrazit význam nastavení</button></section>';}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.entity){entity=b.dataset.entity;scope=entity==='crew'?'shared':'agent';query='';if(tab==='Team'&&entity==='agent')tab='Overview';render()}else if(b.dataset.tab){tab=b.dataset.tab;render()}else if(b.dataset.scope){scope=b.dataset.scope;query='';render()}else if(b.dataset.doc){const[k,i]=b.dataset.doc.split(':');openDoc(k,+i)}else if(b.dataset.close)$('#'+b.dataset.close).close();else if(b.dataset.info)toast(b.dataset.info);else if(b.dataset.editTab){editTab=b.dataset.editTab;renderEditor()}else if(b.id==='edit')openEdit();else if(b.id==='open-instructions')openEdit('Instrukce');else if(b.id==='save'){toast('Ukázka dokončena. Žádné změny nebyly uloženy do Crewship.');$('#editor').close()}else if(b.id==='retry'){$('#scenario').value='ready';render()}else if(b.id==='chat')toast('V produktu se otevře společný Chat se správným kontextem.');else if(b.id==='files')toast('V produktu se otevřou Files v rozsahu vybraného agenta nebo crew.');});
$('#scenario').addEventListener('change',render);document.addEventListener('input',e=>{if(e.target.id==='knowledge-search'){query=e.target.value;const pos=e.target.selectionStart;renderMemory();$('#knowledge-search').focus();$('#knowledge-search').setSelectionRange(pos,pos)}});$('#tree-search').addEventListener('input',e=>document.querySelectorAll('aside [data-entity]').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(e.target.value.toLowerCase())));render();
</script>
</html>
