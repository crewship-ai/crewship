<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crewship — vizuální návrh</title><style>
*{box-sizing:border-box}body{margin:0;background:#060607;color:#eeeef2;font:14px system-ui,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #459bff;outline-offset:4px}button{background:#121216;border:1px solid #28282e;border-radius:20px;padding:9px 15px}button:hover{border-color:#686876;background:#1c1c24}.blue{color:#53a2ff;background:#0c1c32;border-color:#214779}.muted,small{color:#94949f}small{font-size:12px}.top{height:52px;border-bottom:1px solid #222229;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.demo{color:#b5a0ed;font-size:12px}.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 52px)}aside{background:#0c0c10;border-right:1px solid #222229;padding:24px 14px}aside button{display:flex;align-items:center;gap:10px;border:0;background:none;width:100%;text-align:left;margin:5px 0;border-radius:12px}aside .selected{background:#111d30;color:#e2edff}main{padding:34px 38px;max-width:1540px;width:100%;margin:0 auto}h1{font-size:28px;letter-spacing:-.8px;margin:0 0 5px}h2{font-size:18px;font-weight:550;margin:0 0 8px}p{line-height:1.6;margin:6px 0}header{display:flex;align-items:center;gap:18px;margin-bottom:25px}.actions{margin-left:auto;display:flex;gap:8px}.avatar{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:#6740bb;color:#eee;flex-shrink:0;font-size:19px;position:relative}.avatar.big{width:70px;height:70px;font-size:34px;box-shadow:0 0 0 7px #8d5ce510}.avatar.face:before{content:'• •';white-space:nowrap;font-size:12px;letter-spacing:2px;position:absolute;top:3px}.avatar.face:after{content:'⌣';position:absolute;bottom:0px}.avatar.big.face:before{top:5px;font-size:27px}.avatar.big.face:after{bottom:4px}.pink{background:#9d245d}.indigo{background:#414cac}.crew-icon{border-radius:13px;background:#17233b;color:#6baaff}.status{font-size:12px;color:#43d9a5;display:inline-flex;align-items:center;gap:6px}.dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}.tabs{display:flex;gap:24px;border-bottom:1px solid #25252b;margin-bottom:24px}.tabs button{border:0;background:none;border-radius:0;padding:12px 0;color:#9696a4}.tabs button.active{color:white;box-shadow:0 2px #338dff}.grid{display:grid;gap:16px}.two{grid-template-columns:1.2fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.card{background:#0e0e12;border:1px solid #222229;border-radius:23px;padding:21px;overflow:hidden}.label{font-size:11px;letter-spacing:.9px;color:#b4b4c1;text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-bottom:20px}.label svg{width:15px;height:15px;color:#9696ab}.label small{margin-left:auto;text-transform:none;letter-spacing:0}.icon{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:#152439;color:#60a7ff;flex-shrink:0}.icon.green{background:#10291f;color:#43d9a5}.icon.purple{background:#251b37;color:#be97ff}.icon.amber{background:#302513;color:#e5b762}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.row{display:flex;align-items:center;gap:12px;padding:11px 0}.row+.row{border-top:1px solid #202027}.row .end{margin-left:auto;text-align:right}.row p{margin:0}.number{font-size:30px;letter-spacing:-1px}.metric{display:flex;align-items:center;justify-content:space-between}.spark{height:42px;display:flex;align-items:end;gap:4px}.spark i{width:8px;background:#359d81;border-radius:3px 3px 0 0}.highlight{background:radial-gradient(ellipse at 100% 0,#21385160,transparent 65%),#0e0e12}.progress{height:4px;background:#232630;border-radius:6px;margin-top:20px;overflow:hidden}.progress span{display:block;height:100%;background:#459bff;width:65%}.space{margin-top:16px}.link{color:#559fff;font-size:12px}.stack{display:flex;padding-left:6px}.stack .avatar{margin-left:-6px;border:3px solid #0e0e12;width:34px;height:34px;font-size:15px}.fleet{grid-template-columns:repeat(3,1fr)}.fleet .card{text-align:left;cursor:pointer;transition:transform .15s,border-color .15s}.fleet .card:hover{transform:translateY(-2px);border-color:#476186}.fleet .card p{min-height:46px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:20px}.toolbar input{flex:1;max-width:380px}.field{display:block;color:#b2b2bf;margin:18px 0 7px;font-size:12px}input,textarea{background:#08080b;border:1px solid #2b2b33;border-radius:12px;padding:11px 13px;color:#efeff6;width:100%}textarea{height:94px;resize:vertical}.note{border-left:2px solid #8c6dd5;padding-left:15px;margin:18px 0}.chip{font-size:11px;padding:4px 8px;border-radius:7px;background:#22202e;color:#baa8e1;display:inline-block;margin:4px 4px 0 0}.section-title{display:flex;align-items:center;justify-content:space-between;margin:27px 0 12px}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px}.setting-nav button{display:flex;align-items:center;gap:12px;border-radius:12px;background:transparent;border:0;width:100%;text-align:left;padding:14px}.setting-nav button.active{background:#172034}.setting-grid{grid-template-columns:225px 1fr}.memory-grid{grid-template-columns:1fr 1fr 1fr}.memory-graphic{display:flex;gap:6px;margin:20px 0}.memory-graphic i{height:36px;width:27px;border-radius:5px;background:#8664bc33;border:1px solid #8e70c855;transform:rotate(-8deg)}.memory-graphic i:nth-child(2){height:43px;transform:rotate(0deg);background:#8664bc66}.memory-graphic i:nth-child(3){transform:rotate(8deg)}.notice{font-size:12px;color:#9999aa;margin-top:22px}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:14px 22px;background:#242332;border:1px solid #62577a;border-radius:14px;display:none;z-index:5}.hidden{display:none!important}.fleet.compact{grid-template-columns:1fr}.fleet.compact .card{display:flex;align-items:center;gap:20px;padding:15px 20px}.fleet.compact .card p{min-height:0;flex:1}.fleet.compact .card .footer{margin:0}.fleet.compact .card .row{min-width:180px}.fleet.compact .card .link{display:none}@media(max-width:1000px){.fleet{grid-template-columns:repeat(2,1fr)}.shell{grid-template-columns:170px 1fr}main{padding:24px}.two,.memory-grid{grid-template-columns:1fr}.three{gap:10px}.card{padding:17px}}@media(max-width:650px){aside{display:none}.shell{display:block}.three,.fleet,.setting-grid{grid-template-columns:1fr}main{padding:22px 16px}header{flex-wrap:wrap}.actions{margin-left:0}.top{padding:0 16px}.demo{max-width:160px;text-align:right;font-size:10px}.setting-nav{display:flex;overflow:auto}.setting-nav button{width:auto;white-space:nowrap}.fleet.compact .card{display:block}.toolbar{flex-wrap:wrap}.tabs{gap:20px}.metric .spark{height:30px}}
</style><div class="top"><b>Crewship <span class="muted"> / Crews & agents</span></b><span class="demo">Vizuální návrh · modelová data</span></div><div class="shell"><aside><button onclick="show('fleet')">⌕ &nbsp; Všechny týmy</button><small>VAŠE TÝMY</small><button onclick="show('crew')"><span class="avatar crew-icon">⌘</span>Copy site</button><button class="selected" onclick="show('agent')"><span class="avatar face"></span>Kodi <span class="status">●</span></button><button onclick="show('agent')"><span class="avatar face pink"></span>Mařena</button><button onclick="show('fleet')"><span class="avatar crew-icon">⚗</span>Lab</button></aside><main id="main"></main></div><div id="toast" role="status"></div><script>
const paths={activity:'M2 10h4l3-7 4 14 3-7h4',check:'M4 10l4 4L18 4',clock:'M10 5v5l4 2 M19 10a9 9 0 1 1-18 0 9 9 0 0 1 18 0',work:'M3 5h14v13H3z M7 5V2h6v3',memory:'M4 3h12v15H4z M7 7h6 M7 10h6 M7 13h3',chat:'M2 3h16v11H7l-5 4z',routine:'M5 5h10l-3-3 M15 15H5l3 3 M17 7v6 M3 13V7',key:'M11 5a4 4 0 1 1-8 0 4 4 0 0 1 8 0 M9 8l8 8 M14 13l3-3',team:'M8 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0 M1 18v-3a4 4 0 0 1 8 0v3 M13 4a3 3 0 0 1 0 6 M13 12a4 4 0 0 1 5 4v2',edit:'M3 14L14 3l3 3L6 17H3z',spark:'M10 1l2 6 6 3-6 2-2 6-2-6-6-2 6-3z'};
const ico=(name)=>`<svg viewBox="0 0 20 20" aria-hidden="true"><path d="${paths[name]||paths.spark}"/></svg>`;
const icon=(name,color='')=>`<span class="icon ${color}">${ico(name)}</span>`;
const label=(name,text,right='')=>`<div class="label">${ico(name)} ${text}<small>${right}</small></div>`;
const row=(name,title,sub,right='',color='')=>`<div class="row">${icon(name,color)}<div><p>${title}</p><small>${sub}</small></div><small class="end">${right}</small></div>`;
const avatar=(cls='')=>`<span class="avatar face ${cls}" aria-hidden="true"></span>`;
const stack=()=>`<div class="stack">${avatar()}${avatar('pink')}${avatar('indigo')}</div>`;
let current='agent';
function header(crew=false){return `<header><span class="avatar big ${crew?'crew-icon':'face'}">${crew?'⌘':''}</span><div><h1>${crew?'Copy site':'Kodi'}</h1><p class="muted">${crew?'Tým pro weby, které fungují.':'Z nápadu na hotový web.'}</p><span class="status"><i class="dot"></i> ${crew?'1 agent pracuje · 2 připraveni':'Pracuje'}</span> <small> · ${crew?'3 agenti':'Copy site'}</small></div><div class="actions"><button class="blue" onclick="notify('Náhled: otevře navazující chat.')">${ico('chat')} Chat</button><button onclick="show('edit')">${ico('edit')} Edit</button><button onclick="notify('Provozní akce včetně restartu patří do detailu crew.')">···</button></div></header><nav class="tabs"><button class="${current==='agent'||current==='crew'?'active':''}" onclick="show('${crew?'crew':'agent'}')">Overview</button><button onclick="notify('Work: úplný seznam úkolů, misí a rutin se zachovaným filtrem.')">Work</button><button class="${current==='memory'?'active':''}" onclick="show('memory')">Memory</button></nav>`}
function overview(crew=false){return header(crew)+`<div class="grid three">${[['check','24','Dokončené běhy','za posledních 7 dní','green'],['activity','1','Právě pracuje','Úprava hlavní stránky',''],['clock','09:00','Příští rutina','Zítra · Kontrola webu','purple']].map((m,i)=>`<div class="card">${label(m[0],m[2])}<div class="metric"><div><div class="number">${m[1]}</div><small>${m[3]}</small></div>${i===0?'<div class="spark" aria-label="Ukázka aktivity za 7 dní">'+[14,25,18,32,22,38,28].map(h=>`<i style="height:${h}px"></i>`).join('')+'</div>':icon(m[0],m[4])}</div></div>`).join('')}</div><div class="grid two space"><div class="card highlight">${label('activity','Právě se děje','Živá aktivita')}<div class="row">${avatar()}<div><h2>Nová hlavní stránka</h2><small>Kodi připravuje návrh textů a rozložení.</small></div><span class="status end">● Běží</span></div><div class="progress"><span></span></div><div class="footer"><small>Poslední krok: úprava komponent · před 12 s</small><span class="link">Otevřít běh ↗</span></div><small>Průběh kroků: 2 ze 3 · ukázka</small></div><div class="card">${label(crew?'team':'chat',crew?'Váš tým':'Poslední konverzace')}${crew?row('team','Kodi · Vývojář','Pracuje na hlavní stránce','Pracuje')+row('team','Mařena · Obsah','Připravena na další zadání','Připravena','purple'):row('chat','S vámi','„Připravil jsem dvě varianty úvodu.“','před 8 min')+row('team','S Mařenou','Podklady k tónu značky','před 32 min','purple')}</div></div><div class="section-title"><h2>Přiřazeno a propojeno</h2><small>Jen to nejdůležitější · <span class="link">Vše ve Work →</span></small></div><div class="grid three"><div class="card">${label('work','Úkoly','3 otevřené')}${row('work','Nová hlavní stránka','Probíhá','','')}${row('work','Mobilní navigace','Čeká na zpracování')}<div class="footer"><span class="link">Všechny úkoly →</span></div></div><div class="card">${label('routine','Rutiny','2 přiřazené')}${row('routine','Kontrola webu','Denně v 09:00','','purple')}${row('routine','Týdenní souhrn','Pondělí v 08:00','','purple')}<div class="footer"><span class="link">Všechny rutiny →</span></div></div><div class="card">${label('key','Přístupy','Přes Copy site')}${row('key','GitHub','Repozitář propojen','●','green')}${row('key','Vercel','Přihlašovací údaj dostupný','●','green')}<div class="footer"><span class="link">Spravovat přístupy →</span></div></div></div><div class="notice">Ukázkové počty a aktivita. Grafy se v produktu zobrazí pouze s dostupnými daty; neznámý stav nebude nula.</div>`}
const crews=[['⌘','Copy site','Weby, obsah a nasazení.','1 pracuje',''],['⚗','Lab','Prostor pro výzkum a experimenty.','Připraveno',''],['✧','Brand studio','Texty a vizuály v duchu vaší značky.','Připraveno',''],['◈','Customer care','Pomoc zákazníkům, která neztrácí kontext.','Čeká na vás','amber'],['⌁','Data team','Od dat k odpovědím.','Připraveno',''],['◎','Operations','Každodenní práce pod kontrolou.','Připraveno','']];
function fleet(){return `<header><div><h1>Vaše týmy</h1><p class="muted">Každý má svůj účel. Společně posouvají práci dál.</p></div><div class="actions"><button class="blue" onclick="notify('V produktu otevře společný editor nové crew.')">+ Crew</button></div></header><div class="toolbar"><input aria-label="Hledat týmy" placeholder="⌕  Najít tým podle názvu nebo účelu…" oninput="filter(this.value)"><button onclick="document.querySelector('.fleet').classList.toggle('compact')">☷ Karty / seznam</button><small id="count">6 týmů · modelový katalog</small></div><div class="grid fleet">${crews.map(c=>`<button class="card" data-search="${c[1]} ${c[2]}" onclick="show('crew')"><div class="row"><span class="avatar crew-icon">${c[0]}</span><h2>${c[1]}</h2></div><p class="muted">${c[2]}</p><div class="footer">${stack()}<span class="status" ${c[4]?'style="color:#e5b762"':''}><i class="dot"></i>${c[3]}</span></div><div class="footer"><small>3 agenti</small><span class="link">Otevřít tým ↗</span></div></button>`).join('')}</div><p id="empty" class="muted hidden">Žádný tým neodpovídá hledání.</p><div class="notice">Pro velké katalogy: serverové hledání, řazení a stránkování. Ukázka předvádí karty a kompaktní seznam na šesti modelových týmech.</div>`}
function memory(){return header()+`<div class="section-title"><div><h2>Co si Kodi pamatuje</h2><p class="muted">Znalosti pro další práci. Vždy s jasným určením, komu patří.</p></div><button onclick="notify('Návrh chování: načítání → potvrzeno obnovení, nebo konkrétní chyba. Zde jsou statická data.')">↻ Obnovit</button></div><div class="grid memory-grid">${[['memory','Znalosti agenta','Postupy a zkušenosti Kodiho.','4 dokumenty'],['team','Znalosti crew','Sdílený kontext týmu Copy site.','3 dokumenty'],['chat','O mně','Vaše preference. Viditelné jen vám.','2 poznatky']].map((c,i)=>`<button class="card" style="text-align:left" onclick="selectMemory(${i})">${label(c[0],c[1])}<div class="memory-graphic" aria-hidden="true"><i></i><i></i><i></i></div><h2>${c[3]}</h2><p class="muted">${c[2]}</p><span class="link">Prohlédnout →</span></button>`).join('')}</div><div class="card space" id="note"></div><div class="notice">Osobnost a instrukce jsou v Edit. Nejde o seznam naučených vzpomínek. Cizí osobní profily se v tomto přehledu nezobrazují.</div>`}
function selectMemory(i){const notes=[['Postupy pro úpravy webu','Kodi · Znalosti agenta','Před dokončením ověřit mobilní navigaci, čitelnost a odkazy. Výsledek předat s krátkým přehledem změn.'],['Jak pracujeme v Copy site','Copy site · Sdílené znalosti','Dáváme přednost jednoduché navigaci a srozumitelným textům. Každý návrh doplňujeme náhledem pro mobil.'],['Jak se mnou komunikovat','Pouze vy · Modelový osobní profil','Preferuji stručné odpovědi v češtině. U návrhů mi pomáhá konkrétní vizuální ukázka.']];const n=notes[i];document.getElementById('note').innerHTML=label('memory',n[1], 'Modelový dokument')+`<h2>${n[0]}</h2><div class="note"><p>${n[2]}</p></div><span class="chip">${i===2?'Soukromé':'Sdílený pracovní kontext'}</span><div class="footer"><small>Ukázka obsahu · není skutečná paměť</small><button onclick="downloadNote(${i})">↓ Stáhnout ukázku</button></div>`;window.demoNote=n}
function downloadNote(){const a=document.createElement('a');const url=URL.createObjectURL(new Blob(['# MODELOVÁ DATA — VIZUÁLNÍ NÁVRH\n\n'+window.demoNote[0]+'\n\n'+window.demoNote[2]],{type:'text/plain'}));a.href=url;a.download='crewship-demo-memory.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Stažena modelová poznámka. Produkční export to nenahrazuje.')}
function edit(){return `<header><div><h1>Upravit Kodiho</h1><p class="muted">Dejte mu jasnou roli. O zbytek se postará tým.</p></div><div class="actions"><button onclick="show('agent')">Zavřít návrh</button></div></header><div class="grid setting-grid"><div class="setting-nav">${[['spark','Identita'],['memory','Chování'],['activity','Model a běh'],['key','Schopnosti']].map((n,i)=>`<button class="${i===0?'active':''}" onclick="editSection(${i},this)">${icon(n[0],i===0?'purple':'')}${n[1]}</button>`).join('')}</div><div class="card" id="settings"></div></div><div class="notice">Create a Edit používají stejné sekce. Modelová pole se v tomto návrhu neukládají. Pokročilé volby patří pod rozbalení v příslušné sekci.</div>`}
function editSection(i,el){if(el){document.querySelectorAll('.setting-nav button').forEach(b=>b.classList.remove('active'));el.classList.add('active')}document.getElementById('settings').innerHTML=i===0?`<div class="row"><span class="avatar big face"></span><div><h2>Tvář vašeho agenta</h2><p class="muted">Snadno ho poznáte v týmu i konverzacích.</p><button onclick="notify('Zde se otevře existující výběr avatarů.')">Změnit avatar</button></div></div><label class="field" for="name">Jméno</label><input id="name" value="Kodi"><label class="field" for="role">Role</label><input id="role" value="Vývojář webů"><label class="field" for="purpose">S čím pomáhá</label><textarea id="purpose">Navrhuje a staví přehledné weby. Hlídá kvalitu i mobilní zobrazení.</textarea><div class="row space">${icon('team')}<div>Copy site<p><small>Sdílí prostředí a přístupy tohoto týmu.</small></p></div></div>`:i===1?label('memory','Chování')+'<h2>Jak má Kodi pracovat</h2><label class="field" for="instructions">Instrukce a osobnost</label><textarea id="instructions">Piš srozumitelně. Návrhy doplň konkrétní ukázkou a vysvětli důležité volby.</textarea><p class="muted">Naučené znalosti najdete v Memory.</p>':i===2?label('activity','Model a běh')+'<h2>Nástroje pro dobrou práci</h2>'+row('spark','Model','Vybrat poskytovatele a model','Nastavit →','purple')+row('clock','Délka běhu','Maximálně 30 minut')+'<details class="space"><summary>Pokročilé možnosti</summary><p class="muted">CLI adaptér, nástroje a paměť mezi relacemi.</p></details>':label('key','Schopnosti')+'<h2>Co má Kodi k dispozici</h2>'+row('key','GitHub','Zděděno od Copy site','Připojeno','green')+row('spark','Vývoj webu','Přiřazená dovednost','','purple')+'<p class="muted">Přístupy zděděné z crew se spravují u týmu.</p>';}
function filter(q){let count=0;document.querySelectorAll('[data-search]').forEach(c=>{const visible=c.dataset.search.toLowerCase().includes(q.toLowerCase());c.classList.toggle('hidden',!visible);if(visible)count++});document.getElementById('count').textContent=count+' týmů';document.getElementById('empty').classList.toggle('hidden',count!==0)}
function notify(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.timer);window.timer=setTimeout(()=>e.style.display='none',4000)}
function show(view){current=view;document.getElementById('main').innerHTML=view==='fleet'?fleet():view==='memory'?memory():view==='edit'?edit():overview(view==='crew');if(view==='memory')selectMemory(0);if(view==='edit')editSection(0);window.scrollTo(0,0)}show('agent');
</script></html>
