<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{cursor:pointer;color:inherit;border:1px solid var(--line);border-radius:7px;background:transparent;padding:7px 12px}button:hover{background:#1a1e26}button:disabled{opacity:.45;cursor:default}button.primary{background:#173452;border-color:#315b89;color:#c0ddff}button.quiet{border-color:transparent}button.link{color:var(--blue);border:0;padding:0;background:none;text-align:left}input,select,textarea{background:#0b0d11;color:inherit;border:1px solid #363b46;border-radius:7px;padding:9px 11px;max-width:100%}textarea{width:100%;min-height:110px;resize:vertical}input[type=checkbox]{accent-color:#7cb8ff;width:17px;height:17px}p{margin:4px 0 14px}h1,h2,h3{line-height:1.3}h1{font-size:26px;margin:0 0 5px}h2{font-size:17px;margin:0}h3{font-size:14px;margin:0 0 10px}small,.muted{color:var(--muted)}small{font-size:12px}a{color:var(--blue)}[hidden]{display:none!important}.demo{padding:8px 20px;background:#131b27;border-bottom:1px solid #2b3a4f;font-size:12px;color:#b9c8dd;display:flex;align-items:center;justify-content:space-between;gap:12px}.demo select{padding:3px 8px;font-size:12px}.toolbar{height:51px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:10px}.toolbar .brand{font-weight:600}.toolbar .left,.buttons{display:flex;gap:9px;align-items:center}.toolbar small{margin-left:8px}.layout{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 96px)}aside{background:#0e1014;border-right:1px solid var(--line);padding:19px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}aside input{width:100%;font-size:12px}aside .group{font-size:10px;letter-spacing:.09em;color:var(--muted);padding:12px 10px 3px}aside button{border-color:transparent;text-align:left;display:flex;align-items:center;gap:9px;width:100%;padding:9px}.tree-agent{padding-left:29px!important}aside button.selected{background:#162031;border-color:#294a70}aside .count{margin-left:auto;color:var(--muted);font-size:11px}.mini-avatar,.avatar{display:inline-grid;place-items:center;border-radius:9px;background:#3b3158;color:#d8c9fa;flex-shrink:0}.mini-avatar{width:26px;height:26px;font-size:12px}.avatar{width:48px;height:48px;font-size:23px;border-radius:15px}.crew-avatar{background:#182b42;color:#8ab8ef}.pink{background:#432d3e;color:#e6b6d8}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#717888;flex-shrink:0}.dot.working{background:#81b9fb}.sidebar-foot{margin-top:auto;padding:20px 10px;color:var(--muted);font-size:12px}main{padding:31px 38px 45px;max-width:1510px;width:100%;min-width:0}.entity-header{display:flex;gap:14px;align-items:center}.entity-header>div:not(.buttons){flex:1;min-width:0}.entity-header .buttons{margin-left:auto}.crumb{font-size:12px;color:var(--muted);margin-bottom:17px}.role{color:var(--muted);font-size:13px}.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin:26px 0}.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--muted);padding:10px 0}.tabs button[aria-pressed=true]{color:var(--text);border-bottom-color:var(--blue)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}.panel-head{padding:17px 20px 13px;display:flex;justify-content:space-between;gap:10px;align-items:center}.panel-body{padding:0 20px 19px}.columns{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(270px,1fr);gap:20px;align-items:start}.stack{display:grid;gap:20px}.row{padding:14px 0;border-top:1px solid var(--line);display:flex;align-items:flex-start;gap:11px}.row:first-child{border-top:0}.row .grow{flex:1;min-width:0}.row strong{font-weight:500;display:block}.row small{display:block;margin-top:3px}.row .right{margin-left:auto;white-space:nowrap}.row button.link{color:var(--text)}.row button.link:hover{color:var(--blue)}.badge{font-size:11px;border-radius:5px;padding:2px 7px;color:#afb8c8;border:1px solid #323945;display:inline-block}.badge.good{color:var(--green);border-color:#305745}.badge.blue{color:var(--blue);border-color:#365071}.badge.warn{color:var(--amber);border-color:#68512c}.section-line{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}.section-line p{margin-bottom:0}.now{display:flex;gap:13px;align-items:flex-start;border:1px solid #33465e;background:#111b28;border-radius:12px;padding:18px 21px;margin-bottom:20px}.now .grow{flex:1}.now p{margin:5px 0 0;color:#a8b5c8;font-size:13px}.signal{font-size:18px;color:var(--blue)}.notice{border:1px solid #635030;border-radius:10px;background:#211b12;padding:16px 20px;margin-bottom:20px;display:flex;gap:14px;align-items:center}.notice p{margin:3px 0 0;color:#c7b393;font-size:13px}.notice .grow{flex:1}.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;margin-bottom:23px}.stat{padding:17px 21px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat span{display:block;font-size:12px;color:var(--muted)}.stat strong{font-size:23px;font-weight:600;margin-right:9px}.stat small{font-size:11px}.capabilities{margin-top:23px;padding:17px 20px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;gap:15px;flex-wrap:wrap}.capabilities .items{display:flex;gap:8px;flex-wrap:wrap;flex:1}.capabilities .items span{font-size:12px;color:#b7bdc9}.separator{color:#535b69!important}.footer{margin-top:24px;display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted)}.empty{padding:50px 22px;text-align:center}.empty .avatar{margin-bottom:18px}.empty h2{font-size:20px;margin-bottom:9px}.empty p{max-width:450px;margin:0 auto 20px}.empty .buttons{justify-content:center;flex-wrap:wrap}.segments{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:23px}.segments button[aria-pressed=true]{background:#1c2634;border-color:#3c5577;color:#b5d4fc}.search{width:245px}.document{white-space:pre-wrap;border:1px solid var(--line);border-radius:9px;padding:20px;background:#0b0d11}.availability{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:15px;justify-content:space-between}.availability:last-child{border:0}.availability span:last-child{text-align:right}.fleet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.fleet .title-row{display:flex;gap:12px;align-items:center}.fleet .panel-body{padding-top:0}.fleet .panel-head{padding-top:21px}.crew-desc{min-height:45px;color:var(--muted);font-size:13px}.table-head{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:15px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);padding:13px 20px}.team-row{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:15px;align-items:center;padding:17px 20px;border-bottom:1px solid var(--line)}.team-row:last-child{border:0}.team-name{display:flex;gap:11px;align-items:center}.table-wrap{overflow:auto}.section-space{margin-top:22px}dialog{background:#111318;color:var(--text);border:1px solid #3b414c;border-radius:15px;width:calc(100% - 32px);max-width:740px;max-height:88vh;padding:0;overflow:auto}dialog::backdrop{background:#000b}dialog header{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:22px 25px 0}dialog header h2{font-size:21px}dialog .body{padding:20px 25px}dialog footer{border-top:1px solid var(--line);padding:15px 25px;display:flex;justify-content:flex-end;gap:9px;background:#111318;position:sticky;bottom:0}dialog .tabs{margin:10px 25px 0;gap:21px;overflow:auto}dialog .tabs button{white-space:nowrap;font-size:13px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}label.field{display:flex;flex-direction:column;gap:6px;margin-bottom:17px;font-size:13px}label.field input,label.field select{width:100%}.field small{font-size:11px}.form-section h3{font-size:15px}.checkrow{display:flex;gap:10px;align-items:center;padding:12px 0}.checkrow small{display:block}.help{background:#171e29;padding:13px 16px;border-radius:8px;color:#b5c2d5;font-size:12px}details{border-top:1px solid var(--line);padding:14px 0}summary{cursor:pointer}.more{position:relative}.menu{position:absolute;right:0;top:40px;width:175px;z-index:5;padding:5px;background:#181b22;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px #0009}.menu button{width:100%;border:0;text-align:left}.steps{display:flex;gap:8px;font-size:12px;margin-bottom:23px;flex-wrap:wrap}.steps span{color:var(--muted);padding:4px 8px}.steps .active{color:var(--blue);background:#17273c;border-radius:5px}.mobile-toggle{display:none}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);max-width:calc(100% - 28px);padding:12px 20px;border:1px solid #3b608a;background:#162940;border-radius:9px;z-index:20;font-size:13px}#toast:empty{display:none}.form-error{color:#f1b4b4;margin-bottom:10px}button:focus-visible,a:focus-visible{outline:2px solid var(--blue)}
@media(min-width:1500px){main{padding:38px 48px}.panel-head{padding-top:20px}.row{padding:17px 0}}
@media(max-width:1100px){.layout{grid-template-columns:210px 1fr}main{padding:25px}.columns{grid-template-columns:1fr}.fleet{grid-template-columns:1fr}.entity-header{flex-wrap:wrap}.entity-header .buttons{margin-left:0;width:100%}}
@media(max-width:650px){.demo{padding:9px 13px;align-items:flex-start;flex-direction:column;gap:7px}.toolbar{padding:0 12px;height:auto;min-height:52px;flex-wrap:wrap;padding-block:9px}.toolbar small{display:none}.toolbar .brand{font-size:13px}.toolbar button{font-size:12px;padding:7px 9px}.mobile-toggle{display:block}.layout{display:block;min-height:calc(100vh - 150px)}aside{display:none;border-bottom:1px solid var(--line);border-right:0}aside.open{display:flex}.sidebar-foot{display:none}main{padding:22px 16px}h1{font-size:24px}.crumb{font-size:11px}.tabs{gap:23px;margin:20px 0}.tabs button{font-size:13px}.stats{grid-template-columns:1fr}.stat{border-right:0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:11px 17px}.stat span{flex:1}.stat strong{font-size:19px;margin:0}.stat small{max-width:100px}.now,.notice{padding:16px;flex-wrap:wrap}.now .grow,.notice .grow{min-width:180px}.now button,.notice button{margin-left:0}.panel-head{padding:16px}.panel-body{padding:0 16px 16px}.section-line{align-items:flex-start;flex-wrap:wrap}.search{width:100%}.capabilities{gap:10px}.capabilities>strong{width:100%}.footer{flex-wrap:wrap}.fields{grid-template-columns:1fr;gap:0}.table-head,.team-row{grid-template-columns:1.1fr 1fr;gap:10px}.table-head>:last-child,.team-row>:last-child{grid-column:1/-1}.table-head>:last-child{display:none}dialog header{padding:20px 18px 0}dialog .body{padding:20px 18px}dialog .tabs{margin-inline:18px;gap:17px}dialog footer{padding:14px 18px}.row .right{white-space:normal;text-align:right;max-width:80px}.segments{gap:6px}.segments button{font-size:12px;padding:7px 9px}}

<body>
<div class="demo"><span><strong>Wireframe · modelová data</strong> &nbsp; Klikněte na crew, agenta, Memory nebo Edit. Změny platí jen v této ukázce.</span><label>Stav ukázky <select id="scenario"><option value="active">Aktivní tým</option><option value="attention">Vyžaduje rozhodnutí</option><option value="empty">Nový agent / tým</option><option value="error">Nedostupná data</option></select></label></div>
<header class="toolbar"><div class="left"><button class="quiet mobile-toggle" id="toggle-nav" aria-label="Otevřít navigaci" aria-expanded="false">☰</button><span class="brand">Crews & Agents</span><small>Demo workspace</small></div><div class="buttons"><button data-create="crew">+ Crew</button><button data-create="agent">+ Agent</button></div></header>
<div class="layout"><aside id="sidebar" aria-label="Crews a agenti"><input id="tree-search" aria-label="Hledat crew a agenty" placeholder="Hledat crew, agenta…"><button data-select="fleet" id="all-crews">▦ &nbsp; Všechny týmy</button><div class="group">CREWS</div><div id="tree"></div><div class="sidebar-foot">Znalosti a nastavení najdete<br>u konkrétního týmu nebo agenta.</div></aside><main id="main"></main></div>
<dialog id="detail" aria-labelledby="detail-title"><header><h2 id="detail-title"></h2><button data-close="detail" aria-label="Zavřít detail">✕</button></header><div class="body" id="detail-content"></div><footer><button data-close="detail">Zavřít</button></footer></dialog>
<dialog id="editor" aria-labelledby="editor-title"><header><div><small id="editor-context"></small><h2 id="editor-title"></h2></div><button id="close-editor" aria-label="Zavřít editor">✕</button></header><nav class="tabs" id="editor-tabs" aria-label="Sekce formuláře"></nav><div class="body" id="editor-body"></div><footer id="editor-footer"></footer></dialog>
<dialog id="discard" aria-labelledby="discard-title"><header><h2 id="discard-title">Zahodit rozepsané změny?</h2></header><div class="body"><p class="muted">Změny v tomto formuláři zatím nejsou uložené ani v ukázce.</p></div><footer><button data-close="discard">Pokračovat v úpravě</button><button id="discard-confirm">Zahodit</button></footer></dialog>
<div id="toast" role="status"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const crews=[{id:'copy',name:'Copy site',purpose:'Příprava, vývoj a správa zákaznických webů.',instructions:'Před zveřejněním změn vyžádejte kontrolu.',environment:'Standardní',network:'Omezená',tone:'crew-avatar'},{id:'lab',name:'Lab',purpose:'Výzkum, analýza a ověřování nových nápadů.',instructions:'Odlišujte ověřená fakta od hypotéz.',environment:'Standardní',network:'Omezená',tone:'crew-avatar'}];
const agents=[{id:'kodi',name:'Kodi',crew:'copy',role:'Vývojář',purpose:'Vyvíjí web a hlídá jeho technickou kvalitu.',instructions:'Předávej stručný výsledek, odkaz na změnu a výsledek ověření.',model:'Doporučený model',github:true,notifications:false,memory:true,tone:'',working:true},{id:'marena',name:'Mařena',crew:'copy',role:'Obsah a komunikace',purpose:'Připravuje texty pro web a zákazníky.',instructions:'Piš srozumitelně a drž se zadání.',model:'Doporučený model',github:false,notifications:false,memory:true,tone:'pink',working:false},{id:'mia',name:'Mia',crew:'lab',role:'Analytička',purpose:'Zpracovává podklady a porovnává možnosti.',instructions:'Uváděj zdroje a nejistoty.',model:'Doporučený model',memory:true,tone:'',working:false},{id:'leo',name:'Leo',crew:'lab',role:'Výzkumník',purpose:'Ověřuje nové nápady a možnosti.',instructions:'Rozlišuj návrhy a ověřené výsledky.',model:'Doporučený model',memory:true,tone:'pink',working:false}];
const notes={agent:[{title:'Postup před předáním webu',summary:'Kontrola odkazů, mobilního zobrazení a buildu.',scope:'Znalosti agenta',file:'AGENT.md',body:'Před předáním webu zkontroluj odkazy a zobrazení na mobilu.\n\nK výsledku přilož informaci o provedeném ověření a případných omezeních.'},{title:'Poslední pracovní poznámky',summary:'Zbývá ověřit potvrzení kontaktního formuláře.',scope:'Pracovní poznámky',file:'daily/2026-09-08.md',body:'Kontaktní formulář je připravený. Zbývá ověřit potvrzení po odeslání.\n\nToto je průběžná poznámka, nikoliv trvalé pravidlo.'}],shared:[{title:'Pravidla publikování',summary:'Změny před zveřejněním procházejí kontrolou.',scope:'Crew',file:'CREW.md',body:'Každou změnu před zveřejněním zkontroluje odpovědný člověk.'},{title:'Jazyk zákaznických výstupů',summary:'Výstupy pro tento workspace připravujeme česky.',scope:'Workspace',file:'Pracovní pravidla',body:'Zákaznické výstupy pro tento workspace připravujeme česky.'}],me:[{title:'Preferovaný formát předání',summary:'Stručný výsledek a odkaz na změnu.',scope:'Moje pracovní preference',file:'delivery_format',body:'Stručný výsledek a odkaz na změnu.\n\nModelový příklad informace uvedené uživatelem, nikoliv odhadu jeho osobnosti.'}]};
let selection='kodi',tab='Overview',scope='agent',memoryQuery='',historyOn=false,resolved=false,edit=null,serial=0;
function agent(){return agents.find(a=>a.id===selection)}function crew(){const a=agent();return crews.find(c=>c.id===(a?a.crew:selection))}function kind(){return selection==='fleet'?'fleet':agent()?'agent':'crew'}function current(){return agent()||crew()}function scenario(){return $('#scenario').value}function notify(t){$('#toast').textContent=t;clearTimeout(window.toastTimeout);window.toastTimeout=setTimeout(()=>$('#toast').textContent='',5000)}
function icon(a,big=false){return `<span class="${big?'avatar':'mini-avatar'} ${esc(a.tone||'')}">${esc(a.name.slice(0,1))}</span>`}
function select(id){selection=id;tab='Overview';scope=agents.some(a=>a.id===id)?'agent':'shared';memoryQuery='';$('#sidebar').classList.remove('open');$('#toggle-nav').setAttribute('aria-expanded','false');render()}
function tree(){const q=$('#tree-search').value.trim().toLowerCase();$('#all-crews').classList.toggle('selected',selection==='fleet');$('#tree').innerHTML=crews.map(c=>{const members=agents.filter(a=>a.crew===c.id);const crewHit=c.name.toLowerCase().includes(q);const matches=members.filter(a=>crewHit||`${a.name} ${a.role}`.toLowerCase().includes(q));if(q&&!crewHit&&!matches.length)return '';return `<button data-select="${c.id}" class="${selection===c.id?'selected':''}"><span class="mini-avatar crew-avatar">▣</span>${esc(c.name)}<span class="count">${members.length}</span></button>${matches.map(a=>`<button data-select="${a.id}" class="tree-agent ${selection===a.id?'selected':''}">${icon(a)}${esc(a.name)}<span class="count"><span class="dot ${a.working?'working':''}" aria-label="${a.working?'Pracuje':'V klidu'}"></span></span></button>`).join('')}`}).join('')||'<p class="muted" style="padding:15px">Žádný tým ani agent neodpovídá hledání.</p>'}
function render(){tree();if(kind()==='fleet'){renderFleet();return}const a=agent(),c=crew(),e=current();const sections=a?['Overview','Work','Memory']:['Overview','Team','Work','Memory'];$('#main').innerHTML=`<div class="crumb"><button class="link" data-select="fleet">Všechny týmy</button> &nbsp; / &nbsp; ${a?`<button class="link" data-select="${c.id}">${esc(c.name)}</button> &nbsp; / &nbsp; `:''}${esc(e.name)}</div><header class="entity-header">${icon(e,true)}<div><h1>${esc(e.name)}</h1><div class="role">${esc(a?a.role:'Crew')} · ${esc(e.purpose)}</div></div><div class="buttons">${a?'<button class="primary" data-preview="chat">Chat</button>':''}<button data-preview="files">Files</button><button data-edit="${selection}">✎ Edit ${a?'agent':'crew'}</button><div class="more"><button id="more" aria-label="Další akce" aria-expanded="false">⋯</button><div class="menu" id="more-menu" hidden><button data-preview="journal">Journal</button><button data-preview="runtime">Provozní podrobnosti</button></div></div></div></header><nav class="tabs" aria-label="Sekce detailu">${sections.map(t=>`<button data-tab="${t}" aria-pressed="${t===tab}">${t}</button>`).join('')}</nav><div id="view"></div><div class="footer"><span>Modelová data · návrh informační struktury</span><button class="link" data-preview="backlog">Co je potřeba dodělat →</button></div>`;
 if(tab==='Overview')renderOverview();else if(tab==='Memory')renderMemory();else if(tab==='Team')renderTeam();else renderWork()}
function unavailable(){return `<section class="panel empty"><h2>Přehled se nepodařilo načíst</h2><p class="muted">Data teď nejsou dostupná. Neznamená to, že tu žádná práce nebo znalosti nejsou.</p><button id="retry">Zkusit znovu</button></section>`}
function emptyView(){return `<section class="panel empty"><span class="avatar crew-avatar">◇</span><h2>${agent()?'Připraveno na první zadání':'Tým čeká na první práci'}</h2><p class="muted">${agent()?'Začněte rozhovorem nebo přiřaďte konkrétní úkol. Výsledky a související znalosti potom najdete tady.':'Přidejte agenta a zadejte první práci. Přehled se postupně naplní výsledky týmu.'}</p><div class="buttons">${agent()?'<button class="primary" data-preview="chat">Otevřít chat</button><button data-preview="new-task">Zadat úkol</button>':'<button class="primary" data-create="agent">+ Agent do týmu</button>'}</div></section>`}
function attention(){return scenario()==='attention'&&!resolved?`<div class="notice"><span class="signal" style="color:var(--amber)">◇</span><div class="grow"><strong>Čeká na vaše schválení</strong><p>Návrh nového pravidla publikování webu. Zkontrolujte změnu před použitím.</p></div><button data-preview="approval">Zkontrolovat návrh</button></div>`:''}
function renderOverview(){const s=scenario();if(s==='error'){$('#view').innerHTML=unavailable();return}if(s==='empty'){$('#view').innerHTML=emptyView();return}const isAgent=!!agent(),a=agent(),c=crew();const members=agents.filter(a=>a.crew===c.id);const name=a?.name||members[0]?.name||'Agent';const active=isAgent?a.working:members.some(m=>m.working);const workTitle=c.id==='lab'?'Porovnání návrhů řešení':'Kontrola kontaktního formuláře';

 const basics=()=>`${field('Jméno *','name',d.name,isAgent?'Např. Filip':'Např. Podpora zákazníků')}${field(isAgent?'Co má agent na starosti':'Účel týmu','purpose',d.purpose,'Stručně popište jeho práci.',true)}${isAgent?`<div class="fields"><label class="field">Crew<select data-field="crew">${crews.map(c=>`<option value="${c.id}" ${d.crew===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>${field('Role','role',d.role,'Např. Vývojář')}</div>`:''}`;
 if(wizard){body=`<div class="steps">${['Název a účel','Složení týmu','Souhrn'].map((s,i)=>`<span class="${step===i?'active':''}">${i+1}. ${s}</span>`).join('')}</div>`;if(step===0)body+=basics();else if(step===1)body+='<h3>Jak chcete začít?</h3><label class="checkrow"><input type="radio" name="starter" data-field="starter" value="empty" '+(d.starter==='empty'?'checked':'')+'>Prázdný tým — agenty přidám postupně</label><label class="checkrow"><input type="radio" name="starter" data-field="starter" value="pair" '+(d.starter==='pair'?'checked':'')+'>Ukázková dvojice — vývojář a editor obsahu</label><p class="muted">V produktu se zde použije stávající katalog šablon.</p>';else body+=`<h3>${esc(d.name)}</h3><p class="muted">${esc(d.purpose)||'Účel zatím není vyplněný.'}</p><div class="availability"><span>Složení</span><span>${d.starter==='pair'?'2 ukázkoví agenti':'Prázdný tým'}</span></div><div class="availability"><span>Prostředí</span><span>${d.environment}</span></div><div class="availability"><span>Síť</span><span>${d.network}</span></div><details><summary>Upravit prostředí</summary><label class="field" style="margin-top:15px">Síť<select data-field="network"><option ${d.network==='Omezená'?'selected':''}>Omezená</option><option ${d.network==='Otevřená'?'selected':''}>Otevřená</option></select></label></details><div class="help">Vytvoření v ukázce přidá tým pouze do tohoto wireframu. V produktu bude následovat stav přípravy prostředí.</div>`}
 else if(section==='Základní')body=(!id&&isAgent?'<p class="muted">Začněte základy. Stejná pole později najdete pod Edit agent.</p>':'')+basics();else if(section==='Instrukce')body=`<div class="help">Zdroj: ${d.instructions?'vlastní instrukce':'výchozí nastavení'}. Efektivní instrukce a vlastní override musí být odlišené.</div><div style="margin-top:18px">${field('Jak má pracovat','instructions',d.instructions,'Pokyny pro chování a způsob práce.',true)}</div><p class="muted">Získané znalosti najdete v Memory. Tento editor řeší instrukce.</p>`;else if(section==='Model')body='<label class="field">Model<select data-field="model">'+['Doporučený model','Rychlejší model','Důkladnější model'].map(m=>`<option ${m===d.model?'selected':''}>${m}</option>`).join('')+'</select><small>Modelové volby. Produkční Create a Edit musí používat stejný dostupný katalog.</small></label>';else if(section==='Přístupy')body=`<h3>Aplikace a dovednosti</h3><label class="checkrow"><input type="checkbox" data-field="github" ${d.github?'checked':''}><span>GitHub<small>Modelový vlastní přístup; zděděné přístupy se spravují u zdroje.</small></span></label><label class="checkrow"><input type="checkbox" data-field="notifications" ${d.notifications?'checked':''}><span>Externí oznámení<small>Oddělené od kanálů společného chatu.</small></span></label><p class="muted">Produkční editor využije existující správu integrací, skills a oprávnění.</p>`;else if(section==='Prostředí')body=`<label class="field">Prostředí<select data-field="environment"><option>Standardní</option></select></label><label class="field">Síť<select data-field="network"><option ${d.network==='Omezená'?'selected':''}>Omezená</option><option ${d.network==='Otevřená'?'selected':''}>Otevřená</option></select></label><p class="muted">Technické prostředky, image a provozní akce rozbalit podle potřeby.</p>`;else body=`<label class="checkrow"><input type="checkbox" data-field="memory" ${d.memory?'checked':''}><span>Používat dlouhodobé znalosti<small>Cílová semantika: vypnutí nemaže obsah. Vyžaduje sjednocení backendového chování.</small></span></label><details><summary>Nastavení chatu</summary><p class="muted">Návrhy otázek a formuláře zadání budou sdílet existující nastavení agenta.</p></details><details><summary>Provoz a identifikátory</summary><p class="muted">Slug, adapter a limity běhu. Existující slug se při přejmenování automaticky nemění.</p></details>`;
 $('#editor-body').innerHTML=(edit.error?`<p class="form-error" role="alert">${esc(edit.error)}</p>`:'')+body;$('#editor-footer').innerHTML=`${wizard&&step>0?'<button id="wizard-back">Zpět</button>':''}<button id="cancel-editor">Zrušit</button><button class="primary" id="save-editor">${wizard&&step<2?'Pokračovat':id?'Uložit změny':isAgent?'Vytvořit agenta':'Vytvořit crew'}</button>`;
}
function closeEditor(){if(JSON.stringify(edit.draft)!==edit.initial)$('#discard').showModal();else{$('#editor').close();edit=null}}
function submitEditor(){const isNew=!edit.id;const d=edit.draft;if(d.name.trim().length<2){edit.error='Vyplňte jméno alespoň o dvou znacích.';if(edit.type==='crew'&&!edit.id)edit.step=0;edit.section='Základní';renderEditor();$('#editor-body input')?.focus();return}edit.error='';if(edit.type==='crew'&&!edit.id&&edit.step<2){edit.step++;renderEditor();return}let id=edit.id;if(id){const arr=edit.type==='agent'?agents:crews;Object.assign(arr.find(e=>e.id===id),structuredClone(d))}else{id='demo-'+(++serial);if(edit.type==='agent')agents.push({...structuredClone(d),id,working:false,tone:''});else{crews.push({...structuredClone(d),id,tone:'crew-avatar'});if(d.starter==='pair')for(const[name,role]of[['Vývojář','Vývoj webu'],['Editor','Obsah']])agents.push({id:'demo-'+(++serial),name,crew:id,role,purpose:role,instructions:'',model:'Doporučený model',memory:true,working:false})}}$('#editor').close();edit=null;if(isNew)$('#scenario').value='empty';select(id);notify('Uloženo pouze v ukázce. Živý Crewship se nezměnil.')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.select)select(d.select);else if(d.tab){tab=d.tab;render()}else if(d.scope){scope=d.scope;memoryQuery='';renderMemory()}else if(d.note)openNote(d.note);else if(d.preview)preview(d.preview);else if(d.create)startEdit(d.create);else if(d.edit)startEdit(kind(),d.edit);else if(d.editSection)startEdit(kind(),selection,d.editSection);else if(d.editorTab){edit.section=d.editorTab;renderEditor()}else if(d.close){$('#'+d.close).close();if(d.close==='detail'&&tab==='Memory')renderMemory()}else if(b.id==='close-editor'||b.id==='cancel-editor')closeEditor();else if(b.id==='save-editor')submitEditor();else if(b.id==='wizard-back'){edit.step--;renderEditor()}else if(b.id==='discard-confirm'){$('#discard').close();$('#editor').close();edit=null}else if(b.id==='more'){const m=$('#more-menu');m.hidden=!m.hidden;b.setAttribute('aria-expanded',!m.hidden)}else if(b.id==='toggle-nav'){const open=$('#sidebar').classList.toggle('open');b.setAttribute('aria-expanded',open)}else if(b.id==='retry'){$('#scenario').value='active';render()}else if(b.id==='approve-demo'||b.id==='reject-demo'){resolved=true;$('#detail').close();render();notify(b.id==='approve-demo'?'Návrh schválený v ukázce.':'Návrh zamítnutý v ukázce.')}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.field&&edit){if(el.type==='radio'&&!el.checked)return;edit.draft[el.dataset.field]=el.type==='checkbox'?el.checked:el.value}else if(el.id==='tree-search')tree();else if(el.id==='memory-search'){memoryQuery=el.value;const pos=el.selectionStart;renderMemory();$('#memory-search').focus();$('#memory-search').setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(e.target.id==='history-demo')historyOn=e.target.checked});$('#scenario').addEventListener('change',()=>{resolved=false;render()});$('#editor').addEventListener('cancel',e=>{e.preventDefault();closeEditor()});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&$('#editor').open&&!$('#discard').open){e.preventDefault();submitEditor()}});render();
</script>
</body>
</html>
