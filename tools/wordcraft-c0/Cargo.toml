[package]
name = "wordcraft-c0-conditions"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]

[dependencies]
wordcraft-engine = { git = "https://github.com/storytold/wordcraft", rev = "7ef2633a7e84956522d1ca47b99fe6feef16c1db" }
