# Crewship -- Production Docker Compose (single binary)
# Usage: docker compose -f docker/docker-compose.prod.yml up -d
# Requires: .env file in project root (see .env.example)
#
# Default: SQLite (zero deps, embedded in crewship binary)
# Optional: Uncomment postgres service for multi-user deployments

services:
  crewship:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: crewship
    restart: unless-stopped
    ports:
      - "${CREWSHIP_PORT:-8080}:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:/data/crewship.db}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      CREWSHIP_CONTAINER_PROVIDER: docker
      CREWSHIP_STORAGE_PROVIDER: localfs
      CREWSHIP_STATE_PROVIDER: bbolt
      CREWSHIP_STORAGE_BASE_PATH: /var/lib/crewship
      CREWSHIP_LOG_PATH: /var/log/crewship
      # All Docker API calls go through docker-socket-proxy (below), which
      # filters them against an explicit allowlist. The proxy is the only
      # process with raw /var/run/docker.sock access -- mounting the raw
      # socket here would give this container full root on the host.
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    volumes:
      - crewship-data:/var/lib/crewship
      - crewship-logs:/var/log/crewship
      - crewship-db:/data
    networks:
      - crewship-internal
      - crewship-agents
    depends_on:
      docker-socket-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # docker-socket-proxy: filters the Docker API surface that the crewship
  # container can reach. Mounting /var/run/docker.sock into a container is
  # functionally equivalent to giving that container root on the host --
  # any process inside can spawn privileged containers, read every other
  # container's filesystem, or escape via `docker run --privileged`. The
  # proxy brokers a tcp API on the internal network and rejects (403)
  # everything outside the allowlist below.
  #
  # Read docs/guides/docker-socket-proxy.mdx before relying on this. The
  # short version: the proxy filters by URL path, never by request body, so
  # it CANNOT stop a `Privileged: true` container being created -- we need
  # ContainerCreate and exec to do our job at all. The workspace
  # allow_privileged_credentials flag is the fence for that, not this file.
  #
  # The list below is derived from the source and gated in CI:
  #
  #   go run ./scripts/docker-api-surface
  #
  # It fails on drift in both directions, so do not hand-edit it out of sync
  # with scripts/docker-api-surface/allowlist.go.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: crewship-docker-proxy
    restart: unless-stopped
    environment:
      # Non-GET verbs. HAProxy matches METH_GET only, so this one flag also
      # gates PUT, DELETE and HEAD -- CopyToContainer and Ping issue a HEAD.
      POST: 1
      # /containers -- ContainerCreate/Start/Stop/Remove/Inspect/List/Stats/
      # Wait/Pause/Unpause, CopyToContainer, CopyFromContainer, and
      # ExecCreate (which posts to /containers/{id}/exec, not /exec).
      CONTAINERS: 1
      # /exec -- ExecStart, ExecAttach, ExecInspect, ExecResize.
      EXEC: 1
      # /images -- ImagePull, ImageInspect, ImageList, ImageRemove.
      IMAGES: 1
      # /networks -- NetworkCreate, NetworkList (per-crew network).
      NETWORKS: 1
      # /volumes -- VolumeCreate, VolumeInspect, VolumeList, VolumeRemove.
      VOLUMES: 1
      # /info -- cgroup version and host-filesystem detection.
      INFO: 1
      # /_ping and /version -- daemon detection. The image defaults both to 1;
      # set explicitly so this file is the whole story.
      PING: 1
      VERSION: 1
      # /events -- the image defaults this to 1. We never subscribe, so turn
      # it off rather than leave an unused stream open.
      EVENTS: 0

      # --- devcontainer provisioning: opt in ------------------------------
      # Only crews carrying a devcontainer or mise config provision an image
      # (internal/api/crew_runtime_config.go:crewNeedsProvision). Leave these
      # off and such a crew fails at provisioning with a 403 on POST /commit;
      # every other crew is unaffected.
      #
      # /commit -- ContainerCommit, the last step of provisioning.
      # COMMIT: 1
      # /build and /session -- `docker build` with BuildKit, used when a crew
      # declares devcontainer FEATURES. Crewship shells out to the docker CLI
      # with DOCKER_HOST pinned here. Granting BUILD is a real widening: a
      # build runs arbitrary RUN steps against arbitrary base images.
      # BUILD: 1
      # SESSION: 1

      # Everything else stays at the image's default of 0: AUTH, SECRETS,
      # SWARM, NODES, TASKS, SERVICES, CONFIGS, PLUGINS, SYSTEM (host-wide
      # prune and disk usage), DISTRIBUTION, GRPC.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - crewship-internal

  # Uncomment for PostgreSQL mode:
  # postgres:
  #   image: postgres:18-alpine
  #   container_name: crewship-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER:-crewship}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  #     POSTGRES_DB: ${POSTGRES_DB:-crewship}
  #   volumes:
  #     - crewship-pgdata:/var/lib/postgresql/data
  #   networks:
  #     - crewship-internal
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crewship}"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

volumes:
  crewship-data:
  crewship-logs:
  crewship-db:
  # crewship-pgdata:

networks:
  crewship-internal:
    name: crewship-internal
    internal: true
  crewship-agents:
    name: crewship-agents
    internal: true
