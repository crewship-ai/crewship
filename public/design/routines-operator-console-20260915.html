<title>Routines Operator Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap">
<style>
  /* Tokens mirror app/globals.css (light on :root, dark under media + data-theme). */
  :root {
    --bg: #fcfcfc; --card: #f7f7f8; --raised: #ffffff; --border: #e6e4e6; --hair: rgba(0,0,0,.08);
    --fg: #1a1f36; --muted: #5c6178; --soft: #7c8199;
    --primary: #0E6BE8; --primary-fg: #ffffff; --primary-soft: rgba(14,107,232,.10);
    --success: #1f9d5a; --success-soft: rgba(31,157,90,.12);
    --warn: #b7791f; --warn-soft: rgba(183,121,31,.14);
    --danger: #d4442e; --danger-soft: rgba(212,68,46,.12);
    --purple: #7c4dcc; --purple-soft: rgba(124,77,204,.12);
    --shadow: 0 10px 30px rgba(20,24,40,.12);
    --sans: "Open Sans", ui-sans-serif, system-ui, sans-serif;
    --mono: Menlo, ui-monospace, "SF Mono", Consolas, monospace;
    --r: 12px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f0f14; --card: #17171e; --raised: #1e1e27; --border: #2a2a34; --hair: rgba(255,255,255,.07);
      --fg: #f2f2f5; --muted: #9c9cad; --soft: #7f7f90;
      --primary: #1E7BFE; --primary-fg: #0f0f14; --primary-soft: rgba(30,123,254,.16);
      --success: #3ec27a; --success-soft: rgba(62,194,122,.14);
      --warn: #e2ab3f; --warn-soft: rgba(226,171,63,.14);
      --danger: #ef5b4c; --danger-soft: rgba(239,91,76,.14);
      --purple: #a98bff; --purple-soft: rgba(169,139,255,.14);
      --shadow: 0 14px 40px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f0f14; --card: #17171e; --raised: #1e1e27; --border: #2a2a34; --hair: rgba(255,255,255,.07);
    --fg: #f2f2f5; --muted: #9c9cad; --soft: #7f7f90;
    --primary: #1E7BFE; --primary-fg: #0f0f14; --primary-soft: rgba(30,123,254,.16);
    --success: #3ec27a; --success-soft: rgba(62,194,122,.14);
    --warn: #e2ab3f; --warn-soft: rgba(226,171,63,.14);
    --danger: #ef5b4c; --danger-soft: rgba(239,91,76,.14);
    --purple: #a98bff; --purple-soft: rgba(169,139,255,.14);
    --shadow: 0 14px 40px rgba(0,0,0,.5);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13.5px/1.5 var(--sans); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--primary); }
  code, .mono { font-family: var(--mono); font-size: .92em; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* ---------- prototype chrome ---------- */
  .proto { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 14px; background: var(--card); border-bottom: 1px solid var(--border); font-size: 12px; }
  .proto .tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); font-weight: 600; letter-spacing: .02em; text-transform: uppercase; font-size: 10.5px; }
  .proto nav { display: flex; flex-wrap: wrap; gap: 4px; }
  .proto nav button, .proto .tog { border: 1px solid var(--border); background: transparent; border-radius: 8px; padding: 4px 9px; color: var(--muted); }
  .proto nav button[aria-current="true"], .proto .tog[aria-pressed="true"] { background: var(--primary-soft); color: var(--primary); border-color: transparent; font-weight: 600; }
  .proto .sp { flex: 1; }
  .proto .note { color: var(--muted); }

  /* ---------- app frame ---------- */
  .stage { padding: 18px 14px 40px; display: flex; justify-content: center; }
  .app { width: min(1400px, 100%); height: 860px; border: 1px solid var(--border); border-radius: 14px; background: var(--bg); overflow: hidden; display: grid; grid-template-rows: 48px 40px 1fr; container-type: inline-size; position: relative; }
  .app.phone { width: 390px; height: 844px; border-radius: 28px; border-width: 6px; }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--border); background: var(--card); }
  .topbar .brand { font-weight: 700; margin-right: 6px; }
  .topbar .crumb { color: var(--muted); }
  .topbar .sp { flex: 1; }
  .body { display: grid; grid-template-columns: 272px 1fr; min-height: 0; }
  .explorer { border-right: 1px solid var(--border); background: var(--card); padding: 12px; overflow: auto; min-height: 0; }
  .explorer .search { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; background: var(--bg); margin-bottom: 10px; }
  .explorer h4 { margin: 12px 4px 6px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); font-weight: 600; }
  .xrow { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 7px 8px; color: var(--fg); }
  .xrow:hover { background: var(--hair); }
  .xrow[aria-current="true"] { background: var(--primary-soft); }
  .xrow .nm { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .xrow .sub { display: block; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .main { overflow: auto; min-height: 0; padding: 18px 22px 40px; }
  .main > .inner { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  /* ---------- primitives ---------- */
  .icon { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; font-weight: 700; font-size: 13px; }
  .icon.sm { width: 22px; height: 22px; border-radius: 6px; font-size: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); }
  .card > .hd { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--hair); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); font-weight: 600; }
  .card > .hd .sp { flex: 1; }
  .card > .bd { padding: 12px 14px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.ok { background: var(--success-soft); color: var(--success); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--danger-soft); color: var(--danger); }
  .pill.live { background: var(--primary-soft); color: var(--primary); }
  .pill.live::before { animation: pulse 1.2s infinite; }
  .pill.muted { background: var(--hair); color: var(--muted); }
  .pill.draft { background: var(--purple-soft); color: var(--purple); }
  .pill.nodot::before { display: none; }
  @keyframes pulse { 50% { opacity: .3; } }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--border); background: var(--raised); color: var(--fg); font-weight: 600; font-size: 12.5px; white-space: nowrap; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--primary); color: var(--primary-fg); border-color: transparent; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--danger); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--fg); background: var(--hair); }
  .btn.lg { height: 38px; padding: 0 16px; font-size: 13.5px; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .btn.kebab { width: 32px; padding: 0; justify-content: center; }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--muted); }
  .soft { color: var(--soft); }
  .small { font-size: 12px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); }
  .tabs button { border: 0; background: transparent; padding: 8px 12px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
  .tabs button[aria-selected="true"] { color: var(--fg); border-color: var(--primary); }
  .tabs button .n { margin-left: 5px; color: var(--soft); font-size: 11px; }
  details.tech { border: 1px dashed var(--border); border-radius: var(--r); padding: 0 14px; color: var(--muted); }
  details.tech summary { padding: 10px 0; cursor: pointer; font-weight: 500; }
  details.tech pre { white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 11.5px; background: var(--bg); padding: 10px; border-radius: 8px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; }
  .kv dt { color: var(--soft); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
  .kv dd { margin: 0; }
  .grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; align-items: start; }
  .banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r); border: 1px solid; }
  .banner.warn { background: var(--warn-soft); border-color: transparent; }
  .banner.bad { background: var(--danger-soft); border-color: transparent; }
  .banner.ok { background: var(--success-soft); border-color: transparent; }
  .banner.live { background: var(--primary-soft); border-color: transparent; }
  .banner .t { font-weight: 600; }
  .banner .b { flex: 1; min-width: 0; }
  .banner .ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--raised); flex: none; font-weight: 700; }
  .toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-weight: 600; box-shadow: var(--shadow); animation: up .2s ease-out; z-index: 40; max-width: 90%; }
  @keyframes up { from { transform: translate(-50%, 8px); opacity: 0; } }

  /* identity header */
  .ident { display: flex; gap: 14px; align-items: flex-start; }
  .ident h1 { margin: 0; font-size: 20px; line-height: 1.25; text-wrap: balance; }
  .ident .state { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 4px; font-size: 12px; color: var(--muted); }
  .ident .purpose { margin: 8px 0 0; max-width: 68ch; }
  .ident .actions { margin-left: auto; }

  /* answers */
  .answers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
  .answers > div { padding: 12px 14px; border-right: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
  .answers > div:nth-child(3n) { border-right: 0; }
  .answers > div:nth-last-child(-n+3) { border-bottom: 0; }
  .answers .q { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--soft); font-weight: 600; margin-bottom: 4px; }
  .answers .a { line-height: 1.45; }

  /* steps */
  .steps { display: flex; flex-direction: column; }
  .step { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--hair); align-items: start; }
  .step:first-child { border-top: 0; }
  .step .who { color: var(--muted); font-size: 12px; margin-top: 2px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .step .who .tool { font-family: var(--mono); font-size: 11px; background: var(--hair); padding: 0 6px; border-radius: 5px; }
  .step .nm { font-weight: 600; }
  .step .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; font-size: 11px; position: relative; }
  .step .st { text-align: right; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .step .det { margin-top: 8px; padding: 10px 12px; border-radius: 8px; background: var(--bg); border: 1px solid var(--hair); font-size: 12.5px; }
  .step .det .kv { margin-top: 4px; }
  .step.cur { background: var(--primary-soft); }
  .step.bad { background: var(--danger-soft); }
  .step.wait { background: var(--warn-soft); }
  .step .cond { display: inline-block; margin-top: 4px; font-size: 11.5px; color: var(--warn); }
  .who .role { padding: 0 6px; border-radius: 5px; font-weight: 600; }
  .role.agent { background: var(--purple-soft); color: var(--purple); }
  .role.check { background: var(--success-soft); color: var(--success); }
  .role.human { background: var(--warn-soft); color: var(--warn); }
  .role.script { background: var(--primary-soft); color: var(--primary); }
  .role.notify { background: var(--hair); color: var(--muted); }
  .role.transform { background: var(--success-soft); color: var(--success); }
  .role.http, .role.query { background: var(--primary-soft); color: var(--primary); }
  .role.crewship, .role.code { background: var(--warn-soft); color: var(--warn); }
  .role.foreach, .role.call { background: var(--purple-soft); color: var(--purple); }
  .step .av { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 17px; background: var(--purple-soft); }
  .step .badge { position: absolute; right: -5px; bottom: -5px; min-width: 15px; height: 15px; border-radius: 999px; background: var(--card); border: 1px solid var(--border); font-size: 9px; display: grid; place-items: center; color: var(--muted); font-family: var(--mono); padding: 0 3px; }
  .phase { display: flex; align-items: center; gap: 8px; padding: 8px 14px 4px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); font-weight: 600; border-top: 1px solid var(--hair); }
  .phase:first-child { border-top: 0; }
  .phase .ln { flex: 1; height: 1px; background: var(--hair); }
  .step.nested { margin-left: 44px; border-left: 2px solid var(--purple-soft); background: transparent; }
  .step.fold .nm { color: var(--muted); font-weight: 500; }
  .step.hook { opacity: .75; }
  .step .after { font-size: 11px; color: var(--muted); }
  .step .after b { font-weight: 500; color: var(--fg); }
  .chk { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 0 6px; border-radius: 5px; background: var(--success-soft); color: var(--success); }
  /* Last run card — as in the app: tinted header by outcome */
  .lastrun { border: 1px solid var(--border); border-radius: var(--r); background: var(--card); overflow: hidden; }
  .lastrun .lh { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--hair); }
  .lastrun.ok .lh { background: linear-gradient(90deg, var(--success-soft), transparent); }
  .lastrun.bad .lh { background: linear-gradient(90deg, var(--danger-soft), transparent); }
  .lastrun.warn .lh { background: linear-gradient(90deg, var(--warn-soft), transparent); }
  .lastrun .lc { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; }
  .lastrun.ok .lc { background: var(--success-soft); color: var(--success); } .lastrun.bad .lc { background: var(--danger-soft); color: var(--danger); } .lastrun.warn .lc { background: var(--warn-soft); color: var(--warn); } .lastrun.muted .lc { background: var(--hair); color: var(--muted); }
  .lastrun .lb { padding: 10px 14px; }
  .lastrun .facts { display: grid; grid-template-columns: repeat(3, max-content); gap: 4px 22px; font-size: 11.5px; }
  .lastrun .facts dt { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--soft); }
  .lastrun .facts dd { margin: 0; font-variant-numeric: tabular-nums; }
  /* icon picker popover (as CrewIconPopover) */
  .picker { position: absolute; z-index: 5; margin-top: 6px; width: 320px; background: var(--raised); border: 1px solid var(--border); border-radius: 14px; padding: 12px; box-shadow: var(--shadow); }
  .picker .colors { display: flex; gap: 8px; justify-content: space-between; margin-bottom: 8px; }
  .picker .colors button { width: 26px; height: 26px; border-radius: 8px; border: 2px solid transparent; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
  .picker .colors button[aria-pressed="true"] { border-color: var(--primary); }
  .picker .cats { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11.5px; color: var(--muted); margin: 8px 0; }
  .picker .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; border: 1px solid var(--border); border-radius: 10px; padding: 8px; }
  .picker .grid button { height: 30px; border: 0; background: transparent; border-radius: 6px; color: var(--muted); }
  .picker .grid button:hover, .picker .grid button[aria-pressed="true"] { background: var(--primary-soft); color: var(--primary); }
  .iconbtn { border: 0; background: transparent; padding: 0; position: relative; }
  /* file tree + read-only preview (as the agent Files panel: CrewFilesScope + FilePreview) */
  .fcard.split { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(0, 1.2fr); }
  .fcard.split > .hd { grid-column: 1 / -1; }
  .tree { padding: 6px 8px; font-size: 12.5px; }
  .ftrow { display: grid; grid-template-columns: 14px 18px 1fr auto auto; gap: 6px; align-items: center; padding: 4px 6px; border-radius: 6px; border: 0; background: transparent; color: var(--fg); width: 100%; text-align: left; }
  .ftrow:hover { background: var(--hair); }
  .ftrow[aria-current="true"] { background: var(--primary-soft); color: var(--primary); }
  .ftrow .tw { color: var(--soft); font-size: 10px; }
  .ftrow .nm { font-family: var(--mono); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ftrow .use { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .ftrow .sz { font-family: var(--mono); font-size: 10.5px; color: var(--soft); white-space: nowrap; }
  .ftrow .fic { width: 18px; height: 18px; font-size: 8px; border-radius: 4px; }
  .ftrow .fo { width: 18px; height: 18px; display: grid; place-items: center; color: var(--soft); }
  .tree .root { font-family: var(--mono); font-size: 11.5px; color: var(--muted); padding: 4px 6px 6px; }
  .viewer { border-left: 1px solid var(--hair); display: grid; grid-template-rows: auto 1fr; min-height: 260px; max-height: 420px; animation: slide .18s ease-out; }
  @keyframes slide { from { transform: translateX(16px); opacity: 0; } }
  .viewer .vh { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--hair); font-size: 12px; }
  .viewer .vh .path { font-family: var(--mono); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .viewer pre { margin: 0; overflow: auto; font-family: var(--mono); font-size: 11.5px; line-height: 1.55; padding: 10px 12px; color: var(--fg); background: var(--bg); }
  .viewer pre .ln { display: inline-block; width: 28px; color: var(--soft); text-align: right; margin-right: 12px; user-select: none; }
  .viewer pre .c { color: var(--soft); } .viewer pre .k { color: var(--purple); } .viewer pre .s { color: var(--success); }
  /* large recipes: collapsed phases and the map */
  .phase.big { cursor: pointer; padding: 10px 14px; }
  .phase.big .pn { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--fg); font-size: 12.5px; }
  .phase.big .pm { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted); font-size: 12px; }
  .mapwrap { overflow: auto; padding: 12px; }
  .map { display: grid; grid-auto-flow: column; grid-auto-columns: 190px; gap: 26px; align-items: start; min-width: max-content; }
  .col { display: flex; flex-direction: column; gap: 6px; position: relative; }
  .col + .col::before { content: ""; position: absolute; left: -26px; top: 14px; width: 26px; height: 1px; background: var(--border); }
  .col .ch { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); font-weight: 600; padding: 0 2px 4px; }
  .node { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px; align-items: center; border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; background: var(--card); text-align: left; color: var(--fg); font-size: 12px; width: 100%; }
  .node:hover { border-color: var(--muted); }
  .node .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .x { font-family: var(--mono); font-size: 10.5px; color: var(--primary); }
  .node .av2 { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 13px; background: var(--purple-soft); }
  .node .ic2 { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 10px; background: var(--hair); color: var(--muted); }
  .node.ok { border-left: 3px solid var(--success); } .node.bad { border-left: 3px solid var(--danger); } .node.wait { border-left: 3px solid var(--warn); } .node.live { border-left: 3px solid var(--primary); }

  /* list */
  .rows { display: flex; flex-direction: column; }
  .row { display: grid; grid-template-columns: 1fr 190px 150px 24px; gap: 12px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--hair); text-align: left; background: transparent; border-left: 0; border-right: 0; border-bottom: 0; color: var(--fg); width: 100%; }
  .row:first-child { border-top: 0; }
  .row:hover { background: var(--hair); }
  .row .id { display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
  .row .nm { font-weight: 600; display: flex; gap: 8px; align-items: center; }
  .row .pp { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .how { color: var(--muted); font-size: 12px; }
  .row .chev { color: var(--soft); text-align: right; }

function validate() {

    ${filesCard(r)}`; })() : `<div class="card"><div class="bd muted">The lead agent is still drafting the steps from your description. Open the chat to finish, or publish once they look right.</div></div>`}

/* ---------- run page ---------- */
function viewRun() {
  const r = routine(); const x = S.runs.find((q) => q.id === S.runId);
  const order = ["extract", "verify", "decide", "post", "notify"];
  const stepState = (s) => {
    const i = order.indexOf(s.id), cur = order.indexOf(x.at || "notify");
    if (x.state === "completed") return x.skipped?.includes(s.id) ? "skip" : "ok";
    if (x.state === "stopped") return i < cur ? "ok" : i === cur ? "skip" : "skip";
    if (x.state === "failed") return i < cur ? "ok" : i === cur ? "bad" : "skip";
    if (x.state === "waiting") return i < cur ? "ok" : i === cur ? "wait" : "";
    return i < cur ? "ok" : i === cur ? "live" : "";
  };
  const head = {
    waiting: `<div class="banner warn"><span class="ic">?</span><div class="b"><div class="t">Finance needs to decide</div><div class="small">The invoice total (12 480 CZK) is over the auto-approve limit (${esc(x.inputs.auto_approve_limit)} CZK). Nothing has been posted yet. This is the same decision shown in Inbox. Expires in 23 h 56 min.</div></div></div>`,
    running: `<div class="banner live"><span class="ic">▶</span><div class="b"><div class="t">Work in progress · step ${order.indexOf(x.at) + 1} of 5, “${esc(r.steps[order.indexOf(x.at)].name)}”</div><div class="small">${x.at === "extract" ? "Nora is reading the PDF with pdf-read and ocr." : "Vale is checking the extracted numbers against 4 rules."}</div></div><button class="btn danger" type="button" onclick="act('stopSheet')">Stop</button></div>`,
    failed: `<div class="banner bad"><span class="ic">✕</span><div class="b"><div class="t">Stopped at step 2, “Check the extraction”</div><div class="small">${esc(x.plain)}</div><div class="small" style="margin-top:6px"><b>Kept:</b> what Nora read (below). <b>Not done:</b> Finance was not asked, nothing was posted, #finance was not told.</div></div></div>`,
    completed: `<div class="banner ok"><span class="ic">✓</span><div class="b"><div class="t">Done · ${esc(x.posted || "finished")}</div><div class="small">${x.decided ? esc(x.decided) + " · " : ""}${x.skipped?.includes("decide") ? "Under the limit, so Finance was not asked. " : ""}${x.inputs.notify_finance === "true" ? "#finance was told." : "#finance was not told (turned off for this run)."}</div></div></div>`,
    stopped: `<div class="banner"><span class="ic">■</span><div class="b"><div class="t">Stopped</div><div class="small">${esc(x.stopReason || "Pending work was cancelled. What already happened is not undone.")}</div></div></div>`,
  }[x.state];
  const canRunAgain = ["failed", "completed", "stopped"].includes(x.state);
  return `
    <button class="btn ghost" type="button" onclick="act('back')" style="align-self:flex-start">‹ Back to ${esc(r.name)}</button>
    <div class="card"><div class="bd"><div class="ident">${icon(r)}
      <div style="min-width:0;flex:1"><h1>${esc(r.name)} <span class="muted" style="font-weight:400">· run</span></h1>
        <div class="state">${pill(x.state)} <span>started ${esc(x.started)}</span><span>· ${esc(x.by)}</span><span>· recipe <b>v${x.v}</b>${x.v < r.published ? ` <span class="soft">(v${r.published} is published now)</span>` : ""}</span>${x.took ? `<span>· took ${esc(x.took)}</span>` : ""}</div></div>
      <div class="actions">
        ${x.state === "waiting" ? `<button class="btn lg primary" type="button" onclick="act('decide',true)">Approve</button><button class="btn lg" type="button" onclick="act('decide',false)">Reject</button><button class="btn lg ghost danger" type="button" onclick="act('stop')">Stop run</button>` : ""}
        ${x.state === "running" ? `<button class="btn lg danger" type="button" onclick="act('stop')">Stop run</button>` : ""}
        ${canRunAgain ? `<button class="btn lg primary" type="button" onclick="act('runSheet',${JSON.stringify(x.inputs).replace(/"/g, "&quot;")},'v${r.published}')">Run again</button>` : ""}
        ${x.state === "failed" ? `<button class="btn lg" type="button" onclick="act('askFix')">Ask the lead to fix it</button>` : ""}
      </div></div></div></div>
    ${head}
    ${x.state === "waiting" ? `<div class="card"><div class="hd">Your decision</div><div class="bd" style="display:flex;flex-direction:column;gap:10px">
      <dl class="result"><dt>Supplier</dt><dd>${esc(x.extracted.supplier)}</dd><dt>Total</dt><dd>${esc(x.extracted.total)}</dd><dt>VAT id</dt><dd>${esc(x.extracted.vat)}</dd><dt>Due</dt><dd>${esc(x.extracted.due)}</dd><dt>Checks</dt><dd style="font-family:var(--sans)">4 of 4 passed</dd></dl>
      <div class="field"><label>Note for the record <span class="ty">optional</span></label><input type="text" placeholder="e.g. Approved — PO 2026-118"></div>
      <div class="actions"><button class="btn primary" type="button" onclick="act('decide',true)">Approve and post</button><button class="btn" type="button" onclick="act('decide',false)">Reject — do not post</button><span class="small muted">One answer counts; a second answer from Inbox is refused.</span></div>
    </div></div>` : ""}
    ${x.state === "failed" ? `<div class="card"><div class="hd">What to do next</div><div class="bd small" style="display:flex;flex-direction:column;gap:6px">
      <div>• <b>If the invoice is wrong</b>: fix or replace the file, then <a href="#" onclick="act('runSheet',${JSON.stringify(x.inputs).replace(/"/g, "&quot;")},'v${r.published}');return false">run again</a> — a new run, it does not resume this one.</div>
      <div>• <b>If the rule is too strict</b>: <a href="#" onclick="act('askFix');return false">ask the lead agent</a> to change the check, or edit it with the CLI. Either way you get a draft to publish.</div>

    <div class="card"><div class="hd"><span>What happened, step by step</span><span class="sp"></span><span class="seg"><button type="button" aria-pressed="true">List</button><button type="button">Map</button></span></div>
      <div class="steps">${r.steps.map((s, i) => { const st = stepState(s); return `
        <div class="step ${st === "bad" ? "bad" : st === "wait" ? "wait" : st === "live" ? "cur" : ""}">${stepIcon(s, st)}
          <div><div class="nm">${esc(s.name)}</div>
            <div class="who">${stepBits(s)}</div>
            ${stepDetail(s, st, x)}
          </div>
          <span class="st">${{ ok: "Done", bad: `Failed · ${x.attempts || 1} attempts`, wait: "Waiting · 4 min", live: "Running…", skip: x.state === "completed" ? "Skipped · under the limit" : "Not run", "": "Not yet" }[st]}</span>
        </div>`; }).join("")}</div></div>
    <details class="tech"><summary>Inputs used for this run</summary><pre>${Object.entries(x.inputs).map(([k, v]) => `${k}: ${v === "" ? "(empty)" : v}`).join("\n")}</pre></details>

${x.raw ? "error: " + esc(x.raw) : ""}

}
function stepDetail(s, st, x) {
  if (s.id === "extract" && ["ok", "live"].includes(st)) return `<div class="det">${st === "live" ? `<div class="agentline"><span class="t">10:41:03</span><span>Opened <span class="tool">pdf-read</span> on ${esc(x.inputs.invoice_path.split("/").pop())}</span></div><div class="agentline"><span class="t">10:41:09</span><span>Page 2 is a scan → <span class="tool">ocr</span></span></div><div class="agentline"><span class="t">10:41:14</span><span>Extracting line items…</span></div>` : x.extracted ? `<dl class="result"><dt>Supplier</dt><dd>${esc(x.extracted.supplier)}</dd><dt>Total</dt><dd>${esc(x.extracted.total)} · ${x.extracted.lines} lines</dd><dt>VAT id</dt><dd>${esc(x.extracted.vat)}</dd><dt>Due</dt><dd>${esc(x.extracted.due)}</dd></dl><div class="small muted" style="margin-top:6px">Used pdf-read, ocr · 1 attempt · 38 s</div>` : ""}</div>`;
  if (s.id === "verify" && x.checks) return `<div class="det">${s.rules.map((r, i) => `<div>${x.checks[i] ? `<span style="color:var(--success)">✓</span>` : `<span style="color:var(--danger)">✕</span>`} ${esc(r)}${!x.checks[i] ? ` — <b>12 480 ≠ 12 840</b>` : ""}</div>`).join("")}${st === "bad" ? `<div class="small muted" style="margin-top:6px">Tried 3 times: fast → balanced → strong model. Same numbers each time.</div>` : st === "live" ? `<div class="small muted" style="margin-top:6px">Checking…</div>` : ""}</div>`;
  if (s.id === "decide" && st === "wait") return `<div class="det">Waiting for Finance approvers since ${esc(x.started.split(", ")[1])} · <a href="#" onclick="return false">also in Inbox</a></div>`;
  if (s.id === "decide" && x.decided) return `<div class="det">${esc(x.decided)}</div>`;
  if (s.id === "post" && x.posted) return `<div class="det">${esc(x.posted)} · ERP answered 201 · 1 attempt<div class="small muted" style="margin-top:4px">Ran ${fileChip("scripts/ledger-post.go")} with <code>go run</code> · exit 0 · 1.2 s · <a href="#" onclick="return false">stdout ↗</a></div></div>`;
  return "";
}

    <div class="bd">${body.html}</div>
    <div class="ft">${body.foot}</div></section></div>`;

function sheetRun() {
  const r = routine(); const errs = S.errors; const n = Object.keys(errs).length; const isOnce = false;
  const versions = [`v${r.published}`]; if (S.sheet.prefill) versions.push("v2");
  return {
    title: `Run ${esc(r.name)}`,
    sub: `Uses <b>${esc(S.sheet.version)}</b>${r.draft ? ` — the unpublished draft r${r.draft.rev} is not used` : ""} · a new run is added to History`,
    html: `
      <div style="display:flex;flex-wrap:wrap;gap:6px"><span class="pchip set"><span class="g">▣</span>Version ${esc(S.sheet.version)}</span><span class="pchip"><span class="g">👥</span>Crew · Finance</span><span class="pchip"><span class="g">✋</span>Finance decides above the limit</span><span class="pchip"><span class="g">$</span>≈ $0.05</span><span class="pchip"><span class="g">⏱</span>≈ 2 min</span></div>
      ${S.sheet.prefill ? `<div class="field"><label>Version</label><select onchange="act('setSheet','version',this.value)">${versions.map((v) => `<option ${v === S.sheet.version ? "selected" : ""}>${v}${v === `v${r.published}` ? " · published" : " · what the earlier run used"}</option>`).join("")}</select><div class="hint">Values below are copied from the earlier run. A new run repeats the work; it does not resume the earlier one.</div></div>` : ""}
      ${n ? `<div class="errsum" role="alert">${n === 1 ? "1 answer needs a fix" : n + " answers need a fix"} — see below.</div>` : ""}
      ${r.inputs.map((i) => {
        const v = S.form[i.name] ?? ""; const e = errs[i.name]; const changed = v !== i.default;
        const ctl = i.type === "select" ? `<select id="f-${i.name}" onchange="act('field','${i.name}',this.value)">${i.options.map((o) => `<option ${o === v ? "selected" : ""}>${o}</option>`).join("")}</select>`
          : i.type === "boolean" ? `<label class="check"><input type="checkbox" id="f-${i.name}" ${v === "true" ? "checked" : ""} onchange="act('field','${i.name}',this.checked?'true':'false')"> ${v === "true" ? "Yes" : "No"}</label>`
          : `<input id="f-${i.name}" type="text" value="${esc(v)}" aria-invalid="${!!e}" aria-describedby="h-${i.name}${e ? " e-" + i.name : ""}" oninput="act('field','${i.name}',this.value)" onblur="act('blur','${i.name}')" ${i.type === "number" ? 'inputmode="decimal"' : ""}>`;
        return `<div class="field"><label for="f-${i.name}">${esc(i.label)} ${i.required ? `<span class="req" aria-hidden="true">*</span>` : ""}<span class="ty">${i.type === "number" ? "number" : i.format === "absolute_path" ? "path" : i.type === "boolean" ? "" : i.type === "select" ? "choice" : "text"}</span></label>${ctl}${i.hint ? `<div class="hint" id="h-${i.name}">${esc(i.hint)}</div>` : ""}${e ? `<div class="err" id="e-${i.name}" role="alert">${esc(e)}</div>` : ""}${changed && i.type !== "boolean" && i.default !== "" ? `<div class="chg">Changed from the recipe default (${esc(i.default)}) · <button type="button" onclick="act('restore','${i.name}')">Restore default</button></div>` : ""}</div>`;
      }).join("")}
      <div class="small muted" style="border-top:1px solid var(--hair);padding-top:10px"><b>This run will:</b> read the file with Nora, check it with Vale, ask Finance if the total is over ${esc(S.form.auto_approve_limit || "?")} CZK, write to the ERP ledger and ${S.form.notify_finance === "true" ? "post to #finance" : "stay quiet"}. Stopping does not undo the ledger write. Estimated cost ≈ $0.05.</div>
      <p class="small soft">Prototype tip: a limit of 9000 or the path <code>invoices/x.pdf</code> shows field errors. Any valid limit under 12 480 sends the simulated run to Finance.</p>`,
    foot: `<span class="hint">Esc closes · nothing has started</span><button class="btn lg" type="button" onclick="act('sheetClose')">Cancel</button><button class="btn lg primary" type="button" onclick="act('submitRun')">▶ Run now</button>`,
  };
}

- rule: currency in [CZK, EUR]
+ rule: currency in [CZK, EUR, USD]</pre></details>`,
    foot: `<span class="hint">Nothing runs on publish</span><button class="btn lg ghost" type="button" onclick="act('discardDraft')">Discard draft</button><button class="btn lg" type="button" onclick="act('sheetClose')">Not now</button><button class="btn lg primary" type="button" onclick="act('publish')">Publish v${r.published + 1}</button>`,
  };
}
/* Edit — only what the DSL lets a person change without files: identity (appearance endpoint, saved at once),
   inputs (InputSpec), result labels (OutputSpec), limits (max_cost_usd, concurrency, execution_tier, guardrails,
   estimates), slash command (SlashSpec). Steps, checks, hooks, scripts and prompts are CLI / lead. */
function sheetDetails() {
  const r = routine(); const sh = S.sheet;
  const defChanged = !!sh.promptsDirty || JSON.stringify(sh.inputs) !== JSON.stringify(r.inputs) || JSON.stringify(sh.limits) !== JSON.stringify(r.limits || {}) || JSON.stringify(sh.slash) !== JSON.stringify(r.slash || {});
  const sec = sh.section;
  const agentSteps = [...(r.steps || []), ...(r.steps || []).flatMap((s) => s.children || [])].filter((s) => s.role === "agent");
  if (!sh.prompts) sh.prompts = Object.fromEntries(agentSteps.map((s) => [s.id, s.prompt || ""]));
  const nav = [["identity", "Identity"], ["inputs", `Inputs · ${sh.inputs.length}`], ["prompts", `Agent prompts · ${agentSteps.length}`], ["limits", "Limits"], ["slash", "Slash command"], ["steps", "Steps & files"]];
  const typeLabel = (i) => i.type === "select" ? "choice" : i.format === "absolute_path" ? "path" : i.type;
  const body = {
    identity: `<div style="display:flex;gap:14px;align-items:flex-start"><span style="position:relative"><button class="iconbtn" type="button" onclick="S.picker=!S.picker;render()">${icon(r)}</button>${S.picker ? iconPicker(r) : ""}</span><div style="flex:1;display:flex;flex-direction:column;gap:12px">
      <div class="field"><label for="d-name">Name</label><input id="d-name" type="text" value="${esc(sh.name)}" oninput="act('setSheet','name',this.value)"></div>
      <div class="field"><label for="d-purpose">Purpose <span class="ty">shown in the list and to the lead</span></label><textarea id="d-purpose" rows="3" oninput="act('setSheet','purpose',this.value)">${esc(sh.purpose)}</textarea></div>
      <div class="small muted">Icon and colour save at once. Name and purpose save at once too — they do not change how the routine runs.</div></div></div>`,
    inputs: `<div class="small muted">The questions asked before a run. Label, hint, default, required, choices and number bounds are editable; the technical name and type stay (steps refer to them).</div>
      ${sh.inputs.map((i, ix) => `<div class="card"><div class="bd" style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="pchip"><span class="g">⌘</span><span class="mono">${esc(i.name)}</span></span><span class="pchip"><span class="g">⌁</span>${typeLabel(i)}</span>${i.min != null || i.max != null ? `<span class="pchip"><span class="g">↕</span>${i.min ?? "…"} – ${i.max ?? "…"}</span>` : ""}<label class="check small" style="margin-left:auto"><input type="checkbox" ${i.required ? "checked" : ""} onchange="act('editInput',${ix},'required',this.checked)"> Required</label></div>
        <div class="field"><label>Label</label><input type="text" value="${esc(i.label)}" oninput="act('editInput',${ix},'label',this.value)"></div>
        <div class="field"><label>Default${i.type === "boolean" ? " (checked = yes)" : ""}</label>${i.type === "select" ? `<select onchange="act('editInput',${ix},'default',this.value)">${i.options.map((o) => `<option ${o === i.default ? "selected" : ""}>${o}</option>`).join("")}</select>` : i.type === "boolean" ? `<label class="check"><input type="checkbox" ${i.default === "true" ? "checked" : ""} onchange="act('editInput',${ix},'default',this.checked?'true':'false')"> ${i.default === "true" ? "Yes" : "No"}</label>` : `<input type="text" value="${esc(i.default)}" oninput="act('editInput',${ix},'default',this.value)">`}</div>
        <div class="field"><label>Hint <span class="ty">shown under the field</span></label><input type="text" value="${esc(i.hint || "")}" oninput="act('editInput',${ix},'hint',this.value)"></div>
        ${i.type === "select" ? `<div class="field"><label>Choices</label><div class="chips">${i.options.map((o) => `<button type="button" aria-pressed="true">${esc(o)} ✕</button>`).join("")}<button type="button">+ add</button></div></div>` : ""}
      </div></div>`).join("")}
      <button class="btn" type="button">+ Add a question</button>`,
    prompts: `<div class="small muted">What each agent is asked, word for word (the step's <code>prompt</code>). Placeholders like <code>{{ inputs.invoice_path }}</code> are filled in at run time. A change becomes a draft. Tools, skills and the agent itself are set in the CLI.</div>
      ${agentSteps.map((s) => `<div class="card"><div class="bd" style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;gap:8px;align-items:center">${stepAvatar(s)}<div><b>${esc(s.name)}</b><div class="small muted">${esc(s.who)}${(s.tools || []).length ? " · tools: " + s.tools.map(esc).join(", ") : ""}${s.checker ? " · checked by " + esc(s.checker) : ""}</div></div></div><textarea rows="4" oninput="S.sheet.prompts['${s.id}']=this.value;S.sheet.promptsDirty=true">${esc(sh.prompts[s.id])}</textarea></div></div>`).join("")}`,
    limits: `<div class="banner warn" style="padding:8px 12px"><div class="b small">Sketch — which of these belong in the web is not decided yet; every field maps to an existing DSL setting.</div></div><div class="field"><label>Cost cap per run <span class="ty">stops a run that goes over; work already done is paid</span></label><input type="text" inputmode="decimal" value="${sh.limits.cost || ""}" placeholder="no cap" oninput="act('setSheet','limits',{...S.sheet.limits,cost:Number(this.value)||0})"></div>
      <div class="field"><label>Runs at the same time</label><div class="chips"><button type="button" aria-pressed="${!sh.limits.concurrency}" onclick="act('setSheet','limits',{...S.sheet.limits,concurrency:''})">Unlimited</button><button type="button" aria-pressed="${!!sh.limits.concurrency}" onclick="act('setSheet','limits',{...S.sheet.limits,concurrency:'${esc(r.slug)}',maxConcurrent:1})">One at a time</button></div><div class="hint">“One at a time” queues a new start until the running one finishes.</div></div>
      <div class="field"><label>Model tier for agent steps <span class="ty">preferred → fallback</span></label><div class="chips">${["fast", "balanced", "strong"].map((t) => `<button type="button" aria-pressed="${sh.limits.tier?.includes(t)}">${t}</button>`).join("")}</div><div class="hint">A step's own model override wins. Fallback is used when the preferred tier fails its checks.</div></div>
      <div class="field"><label>Suspicious text in inputs</label><div class="chips">${[["block", "Block the run"], ["sanitize", "Clean it and continue"], ["log", "Only log it"]].map(([k, l]) => `<button type="button" aria-pressed="${sh.limits.guardrail === k}" onclick="act('setSheet','limits',{...S.sheet.limits,guardrail:'${k}'})">${l}</button>`).join("")}</div></div>
      <div class="field"><label>Estimates shown before a run</label><div style="display:flex;gap:8px"><input type="text" placeholder="cost, e.g. 0.4" value="${sh.limits.estCost || ""}"><input type="text" placeholder="duration, e.g. 25 min" value="${esc(sh.limits.estDur || "")}"></div><div class="hint">Planning hints only; not enforced.</div></div>`,
    slash: `<label class="check"><input type="checkbox" ${sh.slash.enabled ? "checked" : ""} onchange="act('setSheet','slash',{...S.sheet.slash,enabled:this.checked})"> Offer this routine in chat and the CLI as a slash command</label>
      <div class="field"><label>Command</label><input type="text" value="${esc(sh.slash.label)}" oninput="act('setSheet','slash',{...S.sheet.slash,label:this.value})" ${sh.slash.enabled ? "" : "disabled"}><div class="hint">Typing it opens the same questions as Run.</div></div>`,
    steps: `<div class="card"><div class="hd">Steps, checks, hooks, scripts, agent prompts</div><div class="bd small muted">Read-only in the web. ${r.steps ? r.steps.length : 0} steps${r.hooks ? ", 2 hooks" : ""}, ${(r.files || []).length} files. Change them with the CLI (<code>crewship routine draft ${esc(r.slug)}</code>, files with <code>crewship crew files save</code>) or by asking the lead agent; the result arrives here as a draft to publish. <a href="#" onclick="act('setSheet','kind','cli');return false">Show me how</a></div></div>
      <div class="files">${(r.files || []).map((f) => `<div class="frow">${fileGlyph(f.path)}<div><div class="p">${esc(f.path)}</div><div class="w">${esc(f.what)}</div></div><div class="u small muted">Used by <b>${esc(nameOf(r, f.by))}</b></div><div class="m">${esc(f.updated)}</div></div>`).join("")}</div>`,
  }[sec];
  return {
    title: `Edit ${esc(r.name)}`, sub: "",
    html: `<div class="fchips" role="tablist">${nav.map(([k, l]) => `<button type="button" role="tab" aria-pressed="${sec === k}" onclick="act('editSection','${k}')">${l}</button>`).join("")}</div>${body}`,
    foot: `<span class="hint">${defChanged ? `Inputs, prompts, limits or slash changed → saved as draft r${(r.draft?.rev || 0) + 1}, published v${r.published} keeps running` : "Identity applies at once; definition changes become a draft"}</span><button class="btn lg" type="button" onclick="act('sheetClose')">Cancel</button><button class="btn lg primary" type="button" onclick="act('saveDetails')">${defChanged ? "Save draft" : "Save"}</button>`,
  };
}
function sheetPlan() {
  const r = routine(); const sh = S.sheet; const s = r.schedules.find((x) => x.id === sh.id);
  return {
    title: s.kind === "repeat" ? "Repeating schedule" : "One-time start", sub: `${esc(r.name)} · ${esc(s.tz)}`,
    html: `
      ${s.kind === "repeat" ? `<div class="field"><label>Days</label><div class="chips">${[["weekdays", "Weekdays"], ["daily", "Every day"], ["custom", "Custom…"]].map(([k, l]) => `<button type="button" aria-pressed="${sh.days === k}" onclick="act('setSheet','days','${k}')">${l}</button>`).join("")}</div></div>
      <div class="field"><label for="p-time">At</label><input id="p-time" type="text" value="${esc(sh.time)}" oninput="act('setSheet','time',this.value)"><div class="hint">Europe/Prague · next start: Tue 16 Sept 2026, 08:00</div></div>` : `<div class="field"><label>When</label><input type="text" value="${esc(s.label)}"></div>`}
      <div class="field"><label>Which version</label><div class="chips"><button type="button" aria-pressed="${sh.uses === "latest"}" onclick="act('setSheet','uses','latest')">Latest published (now v${r.published})</button><button type="button" aria-pressed="${sh.uses !== "latest"}" onclick="act('setSheet','uses','v${s.kind === "once" ? "2" : r.published}')">Pin to v${s.kind === "once" ? "2" : r.published}</button></div><div class="hint">“Latest” follows every publish. “Pinned” keeps running the same version until you change it.</div></div>
      <div class="card"><div class="hd">Answers used for these starts</div><div class="bd small">${Object.entries(s.preset).map(([k, v]) => `<div><b>${esc(k.replace(/_/g, " "))}</b>: ${esc(v)}</div>`).join("")}<div class="muted" style="margin-top:6px">Checked against the version above — a publish that breaks them is refused with a link here.</div></div></div>
      <label class="check"><button class="switch" role="switch" aria-checked="${sh.enabled}" onclick="act('setSheet','enabled',${!sh.enabled})"></button> ${sh.enabled ? "On — starts automatically" : "Off — nothing starts automatically"}</label>`,
    foot: `${s.kind === "once" ? `<button class="btn lg ghost danger" type="button" onclick="act('planRemove')">Remove</button>` : ""}<span class="hint"></span><button class="btn lg" type="button" onclick="act('sheetClose')">Cancel</button><button class="btn lg primary" type="button" onclick="act('planSave')">Save</button>`,
  };
}
function sheetNew() {
  const drafts = S.routines.filter((x) => x.draft);
  return { title: "New routine", sub: "Every way in ends as a draft you read here and publish when it looks right.",
    html: `${drafts.length ? `<div class="small muted">Continue a draft</div><div class="chips">${drafts.map((d) => `<button type="button" onclick="act('select','${d.slug}')">${esc(d.name)} · r${d.draft.rev}</button>`).join("")}</div>` : ""}<div style="display:flex;flex-direction:column;gap:10px">${waysIn()}</div>`,
    foot: `<span class="hint">Esc closes</span><button class="btn lg" type="button" onclick="act('sheetClose')">Cancel</button>` };
}
function sheetDescribe() {
  const c = S.chat; const started = c.msgs.length > 0;
  // Before the first message the dialog is laid out like New issue: title, brief, property chips, ⌘↵ footer.
  if (!started && !S.sheet.fix) return { title: "New routine · Describe it", sub: "",
    html: `<input class="bigtitle" placeholder="Routine name" aria-label="Routine name" oninput="S.sheet.name=this.value">
      <textarea class="bigdesc" id="c-goal" aria-label="What should happen" oninput="act('setChat',this.value)" placeholder="What should happen, for whom, and when? What does a good result look like, and which files, folders or rules matter?"></textarea>
      <a href="#" class="small" onclick="return false">Use a routine brief template</a>
      <div style="display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--hair);padding-top:12px"><span class="pchip"><span class="g">👥</span>Crew · Finance</span><span class="pchip"><span class="g">🕒</span>Schedule · not set</span><span class="pchip"><span class="g">⌘</span>Inputs · let the lead propose</span><span class="pchip"><span class="g">✋</span>Needs approval · choose</span><span class="pchip"><span class="g">🏷</span>Labels</span></div>
      <p class="small muted" style="margin:0">The lead agent drafts the steps from this and asks back in chat. Nothing runs and nothing is published until you say so.</p>`,
    foot: `<span class="hint"><span class="kbd">⌘↵</span> to create · <span class="kbd">Esc</span> to cancel</span><button class="btn lg" type="button" onclick="act('sheetClose')">Cancel</button><button class="btn lg primary" type="button" onclick="act('describeSend')">Create draft with the lead</button>` };
  return { title: S.sheet.fix ? "Ask the lead to fix it" : `Describe it · ${esc(S.sheet.name || "New routine")}`, sub: S.sheet.fix ? "The failed run is attached. You get a draft, not a live change." : "The lead asks back, then saves a draft you read here.",
    html: `<div class="chat">${c.msgs.map((m) => `<div class="msg ${m.me ? "me" : ""}">${m.w ? `<div class="w">${esc(m.w)}</div>` : ""}${esc(m.text)}${m.link ? ` <a href="#" onclick="act('select','${m.link}');return false">Open the draft ›</a>` : ""}</div>`).join("") || `<div class="msg"><div class="w">Lead agent</div>I have the failed run open. What should change?</div>`}</div>
      <div class="field"><label for="c-goal">Your message</label><textarea id="c-goal" rows="3" oninput="act('setChat',this.value)" placeholder="${S.sheet.fix ? "e.g. Add a 1 % tolerance" : "Answer the lead, or add detail"}"></textarea></div>`,
    foot: `<span class="hint">Nothing runs from chat · you publish</span><button class="btn lg" type="button" onclick="act('sheetClose')">Close</button><button class="btn lg primary" type="button" onclick="act('describeSend')">Send</button>` };
}
function sheetFork() {
  return { title: "Copy an existing routine", sub: "The copy is a draft with a new name. Schedules and history stay with the original.",
    html: S.routines.filter((x) => x.published).map((x) => `<button class="tile" type="button" onclick="act('fork','${x.slug}')">${icon(x)}<span><b>${esc(x.name)}</b><span class="d">${esc(x.purpose)}</span><span class="d">v${x.published} · ${esc(x.how)}</span></span></button>`).join(""),
    foot: `<button class="btn lg" type="button" onclick="act('setSheet','kind','new')">‹ Back</button>` };
}
function sheetCli() {
  const r = routine();
  return { title: "Build it with the CLI", sub: "Scripts, agent behaviour and checks live in files. The web shows the result and publishes it.",
    html: `<div class="small">1 · Get the current version (or a starter) as a file:</div><pre class="cmd">crewship routine get ${esc(r.slug)} --format yaml > ${esc(r.slug)}.yaml
# new routine: crewship routine init my-routine</pre>
      <div class="small">1b · Put the scripts a step runs on the crew share (they show up under “Files this routine runs”):</div><pre class="cmd">crewship crew files save finance shared/scripts/ledger-post.go --file ./ledger-post.go</pre>
      <div class="small">2 · Edit steps, checks, scripts; check it without running anything:</div><pre class="cmd">crewship routine validate ${esc(r.slug)}.yaml
crewship routine fixture-test ${esc(r.slug)}.yaml   # transforms on sample data</pre>
      <div class="small">3 · Save it as a draft — it appears on the routine page as “Draft r&lt;n&gt; · CLI”:</div><pre class="cmd">crewship routine draft save ${esc(r.slug)}.yaml</pre>
      <div class="small">4 · Publish here in the web (review + confirm), or with the CLI:</div><pre class="cmd">crewship routine save ${esc(r.slug)}.yaml --publish</pre>
      <p class="small muted">The exact flags are in <code>docs/cli/routine.mdx</code>; step 3 uses the existing drafts API, step 4 the existing save path with its test gate.</p>`,
    foot: `<button class="btn lg" type="button" onclick="act('sheetClose')">Close</button>` };
}
function sheetStop() {
  return { title: "Stop this run?", sub: "",
    html: `<p>Pending work is asked to stop. What already happened — a ledger write, a message — is not undone. Recorded results stay in History.</p>`,
    foot: `<button class="btn lg" type="button" onclick="act('sheetClose')">Keep running</button><button class="btn lg danger" type="button" onclick="act('stop')">Stop run</button>` };
}

$("#phone").addEventListener("click", (e) => { const b = e.currentTarget; b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true"); render(); });
$("#reset").addEventListener("click", () => { load(); render(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.sheet) { S.sheet = null; S.chat = null; render(); } });
