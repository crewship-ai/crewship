const basic={name:'GitHub incident brief',description:'Read the status feed and prepare a concise, evidence-based brief.',version:3,team:'Ops',steps:[{id:'fetch',title:'Read the status feed',kind:'http',icon:'globe',who:'Service request',description:'Fetch the latest incident data from GitHub Status.',input:'Feed URL',output:'Incident data',instructions:'GET the configured feed. Require a successful response before continuing.',check:'HTTP 200 · response size limit',source:'https://www.githubstatus.com/api/v2/incidents/unresolved.json'},{id:'report',title:'Write the incident brief',kind:'agent_run',icon:'bot',who:'Riley · Agent',description:'Summarize severity, affected services and a safe next action.',input:'Incident data',output:'Incident brief',instructions:'Use only the incident data from the previous step. Describe severity, affected services, current state and one safe next action. State when there are no active incidents. Keep the brief under 140 words.',check:'At least 40 characters · no secret values',source:'Read the status feed → Incident data'}]};
const complex=clone(basic);complex.name='Incident review and delivery';complex.description='Collect data, prepare a brief, ask for review and deliver the approved result.';complex.steps=[clone(basic.steps[0]),{id:'normalize',title:'Normalize the incident data',kind:'script',icon:'terminal',who:'Python · Ops container',description:'Prepare consistent records before the agent reads them.',input:'Incident data',output:'Normalized records',source:'Read the status feed → Incident data',instructions:'scripts/normalize_incidents.py',check:'File available · compatible interpreter'}, {...clone(basic.steps[1]),source:'Normalize the incident data → Normalized records',input:'Normalized records'}, {id:'approval',title:'Review the proposed brief',kind:'wait',icon:'shield',who:'Human decision · Inbox',description:'Review the brief before any delivery takes place.',input:'Incident brief',output:'Decision',source:'Write the incident brief → Incident brief',instructions:'Is this brief accurate enough to share with the team?',check:'Wait for a decision · no delivery while waiting',condition:'Only when an incident is present'}, {id:'deliver',title:'Deliver the approved brief',kind:'notify',icon:'send',who:'Team notification',description:'Share the approved result and keep its source links.',input:'Approved brief',output:'Delivery receipt',source:'Review the proposed brief → Decision',instructions:'Send the approved brief to the Ops team.',check:'Delivery recorded',condition:'Only after approval'}];
let current=clone(basic),draft=null,runRecipe=clone(basic),selected=1,screen='recipe',phase='unverified',scenario='simple',runNumber=24,versionRows=[3,2,1],scheduleMode='Month',plans=[],sidebarOpen=false;
let toastTimer,runCursor=1;let versionSnapshots={1:clone(basic),2:clone(basic),3:clone(basic)};
const phases={queued:['Queued','info','Waiting for capacity','No steps have started.'],running:['Running','info','Writing the brief','The source was read successfully.'],success:['Completed','good','Result verified','The report and completion confirmation are available.'],unverified:['Result not verified','bad','Completion confirmation missing','The steps finished and a report exists. The run is still recorded as failed.'],waiting:['Waiting for you','warn','Review the proposed brief','Delivery will start only after approval.'],failed:['Failed','bad','Could not read the source','No report was produced. Inspect the failed request before running again.'],cancelled:['Stopped','warn','Stopped by you','Completed work is retained. No further steps will start.'],interrupted:['Interrupted','bad','Execution was interrupted','Inspect recorded work before starting another run.']};
const active=()=>draft|| (screen==='run'?runRecipe:current);
function stepState(i){if(screen!=='run')return ['','ready',''];if(phase==='queued')return ['Queued','ready',''];if(phase==='failed')return i===0?['Failed','failed','bad']:['Not run','skipped',''];if(phase==='waiting'){const w=runRecipe.steps.findIndex(s=>s.kind==='wait');return i<w?['Done','complete','good']:i===w?['Waiting','waiting','warn']:['Not started','ready',''];}if(phase==='running')return i<runCursor?['Done','complete','good']:i===runCursor?['Running','running','info']:['Not started','ready',''];if(['cancelled','interrupted'].includes(phase))return i===0?['Done','complete','good']:['Not completed','skipped',''];return ['Done','complete','good'];}
const statusIcon=s=>s==='complete'?'check':s==='failed'?'alert':s==='running'?'play':s==='waiting'?'clock':s==='skipped'?'pause':'clock';
function stepCard(s,i,style='normal'){const [label,cl,tone]=stepState(i);const compact=style==='compact';return `<button type="button" class="step ${cl} ${selected===i?'selected':''} ${style==='map'?'map-node':''}" data-action="select" data-index="${i}" aria-label="${esc(s.title)}" aria-pressed="${selected===i}"><div class="step-top"><span class="step-icon">${icon(s.icon)}</span><div class="grow"><div class="step-title"><span class="number">${i+1}.</span> ${esc(s.title)}</div><div class="step-sub">${esc(s.who)}</div></div><span class="step-status ${tone}">${screen==='run'?icon(statusIcon(cl)):''}${label}</span></div>${!compact?`<p class="description">${esc(s.description)}</p>${style!=='map'?`<div class="io"><span class="chip">${esc(s.input)}</span>${icon('arrow')}<span class="chip">${esc(s.output)}</span></div>${s.condition?`<p class="check">${icon('branch')} ${esc(s.condition)}</p>`:''}`:''}`:''}</button>`;}
function outputPreview(full=false){const incident=active().steps.some(s=>s.kind==='wait');return `<div class="result-preview"><div class="row between"><span class="eyebrow">Report preview</span><span class="badge">Markdown</span></div><h2 style="margin-top:12px">GitHub incident brief</h2><span class="badge good">${incident?'One incident in the illustrative feed':'No active incidents in the sample feed'}</span><p>${incident?'The illustrative feed reports delayed build notifications. Review the source update before deciding on a response.':'The sample status feed contains no unresolved incidents. No action is recommended from this data alone.'}</p>${full?'<table><tr><td class="muted">Affected services</td><td>'+ (incident?'Example build notifications':'None reported') +'</td></tr><tr><td class="muted">Recommended action</td><td>Continue monitoring</td></tr><tr><td class="muted">Source</td><td>GitHub Status feed</td></tr></table>':''}<p class="caption">Illustrative content · not a live report</p></div>`;}
function inspector(){const a=active(),s=a.steps[selected];if(!s)return `<div class="box"><div class="box-body"><h3>Select a step</h3><p>See its task, source, expected result and checks.</p></div></div>`;
 const run=screen==='run', edit=!!draft;
 return `<div class="inspector stack"><div class="box"><div class="box-title"><span>${edit?'Edit step':run?'Step evidence':'Step details'}</span><span class="badge">${selected+1} / ${a.steps.length}</span></div><div class="box-body">${edit?`<label>Step name<input data-field="title" value="${esc(s.title)}"></label>`:`<h3>${esc(s.title)}</h3>`}<p class="small-line">${s.kind==='agent_run'?'<span class="avatar">Ri</span> ':icon(s.icon)} ${esc(s.who)}</p>${edit&&s.kind==='agent_run'?'<label>Responsible agent<select data-field="who"><option>Riley · Agent</option><option>Casey · Agent</option></select></label>':''}<label>${s.kind==='script'?'Script in the crew container':s.kind==='http'?'Request':'Task'}</label>${edit?`<textarea aria-label="Step instructions" data-field="instructions">${esc(s.instructions)}</textarea>`:`<p class="small-line">${esc(s.instructions)}</p>`}<div class="divider"></div><label>Uses</label>${edit?`<button class="btn small" data-action="mapping">${icon('branch')}${esc(s.source)} ${icon('chevron')}</button>`:`<span class="chip">${esc(s.source)}</span>`}<label>${run?'Recorded response':'Produces'}</label><p class="small-line">${esc(s.output)} ${run?`<button class="small" data-action="step-output">View response ${icon('arrowup')}</button>`:''}</p><label>Checks</label><p class="small-line">${icon('shield')} ${esc(s.check)}</p>${s.condition?`<label>Condition</label><p class="small-line">${esc(s.condition)}</p>`:''}${run?`<div class="divider"></div><p class="caption">Attempt 1 · ${stepState(selected)[0]}</p><button class="small" data-action="activity">${icon('history')}Activity for this step</button>`:''}<details style="margin-top:16px"><summary class="caption">${edit?'Advanced settings':'Technical details'}</summary><p class="small-line">Step ID: ${esc(s.id)}<br>Kind: ${esc(s.kind)}<br>Recipe version: v${a.version}</p>${edit?'<button class="small" data-action="code">Open source</button>':''}</details>${edit?'<div class="divider"></div><button class="danger small" data-action="remove-step">Remove step</button>':''}</div></div>${run?resultCard():''}</div>`;}
function resultCard(){if(['queued','running','failed','cancelled','interrupted'].includes(phase))return `<div class="box"><div class="box-title">Result</div><div class="box-body"><h3>${phase==='running'||phase==='queued'?'Not available yet':'No final verified result'}</h3><p>Recorded step responses remain available. A stopped or failed run does not imply that nothing happened.</p></div></div>`;return `<div class="box"><div class="box-title"><span>Incident brief</span><span class="badge ${phase==='success'?'good':'warn'}">${phase==='success'?'Verified':'Unverified'}</span></div><div class="box-body"><p class="small-line">A report was produced.${phase==='unverified'?' Its completion confirmation is missing.':''}</p><button class="btn small" data-action="result">${icon('file')}Open report</button>${phase==='waiting'?'<button class="primary small" data-action="review">Review now</button>':''}</div></div>`;}
function documentLayout(){const a=active();return `<div class="workspace"><section><div class="work-head"><div><h2>The recipe, from start to result</h2><p>${a.steps.length} steps · ${screen==='run'?'Same recipe, recorded execution':'Select a step to inspect it'}</p></div>${draft?'<button class="small" data-action="add">'+icon('plus')+'Add step</button>':''}</div><div class="start-end">${icon('play')}<strong>${screen==='run'?'Started manually':'When someone starts it'}</strong><span class="grow"></span><button class="small" data-action="inputs">${screen==='run'?'Used inputs':'1 start-form question'} ${icon('chevron')}</button></div><div class="connector"></div>${a.steps.map((s,i)=>`${stepCard(s,i)}<div class="connector">${i<a.steps.length-1?'<span>passes its result forward</span>':''}</div>`).join('')}${!a.steps.length?'<div class="empty"><h2>What should happen first?</h2><p>Add an agent task, a script or a service request.</p><button class="primary" data-action="add">Add the first step</button></div>':''}<div class="start-end">${icon('file')}<div class="grow"><strong>Incident brief</strong><p class="caption">${screen==='run'?phases[phase][2]:'Expected result · report and completion confirmation'}</p></div><button class="small" data-action="${screen==='run'?'result':'output-contract'}">${screen==='run'?'Open result':'Inspect'} ${icon('chevron')}</button></div>${draft?'<button class="add" data-action="add">'+icon('plus')+'Add step</button>':''}</section><aside>${inspector()}</aside></div>`;}
function mapLayout(){const a=active(),n=a.steps.length;const points=n<=2?[[27,40],[73,67]]:a.steps.map((_,i)=>[i%2?72:28,18+i*(66/Math.max(n-1,1))]);const line=points.map((p,i)=>i===0?`M 100 55 L ${p[0]*8} ${p[1]*5.8}`:` L ${p[0]*8} ${p[1]*5.8}`).join('')+' L 690 545';return `<div class="workspace"><section><div class="work-head"><div><h2>Workflow map</h2><p>${a.steps.length} steps · ${screen==='run'?'Executed recipe · positions retained':'Select a node to inspect or edit'}</p></div>${draft?'<button class="small" data-action="add">'+icon('plus')+'Add step</button>':''}</div><div class="flowmap ${n>2?'complex':''}"><svg class="edges" viewBox="0 0 800 580" preserveAspectRatio="none" aria-hidden="true"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#77869b"/></marker></defs><path d="${line}" stroke="#4875ac" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>${n>2?'<path d="M224 295 C440 250 560 380 690 545" fill="none" stroke="#6c627b" stroke-dasharray="5 5"/><text x="475" y="370" fill="#aaa2b6" font-size="12">No incident: skip review</text>':''}</svg><div class="map-anchor" style="left:13%;top:9%">${icon('play')} ${screen==='run'?'Manual start':'Start + inputs'}</div>${a.steps.map((s,i)=>{const card=stepCard(s,i,'map');return card.replace('class="step','style="left:'+points[i][0]+'%;top:'+points[i][1]+'%;" class="step')}).join('')}<button class="map-anchor" style="left:84%;top:94%" data-action="${screen==='run'?'result':'output-contract'}">${icon('file')} Incident brief</button></div><div class="legend"><span>${icon('arrow')} Data dependency</span><span>${icon('branch')} Condition</span><span class="grow"></span><button class="small" data-action="map-help">Map guide</button></div></section><aside>${inspector()}</aside></div>`;}
function studioLayout(){const a=active();return `<div class="work-head"><div><h2>Routine workspace</h2><p>Step navigation stays in place while you inspect, edit or follow a run.</p></div><button class="small" data-action="inputs">${icon('list')}${screen==='run'?'Used inputs':'Start form'}</button></div><div class="studio"><nav class="step-list" aria-label="Workflow steps">${a.steps.map((s,i)=>stepCard(s,i,'compact')).join('')}${draft?'<button class="add" data-action="add">'+icon('plus')+'Add step</button>':''}</nav><section class="center">${inspector().replace(resultCard(),'')}${screen==='run'&&['success','unverified','waiting'].includes(phase)?outputPreview():''}</section><aside class="right"><div><h3>Responsible team</h3><p class="row"><span class="avatar">Ri</span>Ops · Riley</p></div><div><h3>${screen==='run'?'Run context':'Start'}</h3><p>${screen==='run'?'Manual · Today, 09:30<br>Executed recipe v'+runRecipe.version:'On demand<br>1 optional question'}</p></div><div><h3>Deliverable</h3><p>Incident brief<br>Text report with evidence</p><button class="btn small" data-action="${screen==='run'?'result':'output-contract'}">${icon('file')}${screen==='run'?'Open report':'Result contract'}</button></div><div style="margin-top:22px"><h3>Connections</h3><p>${icon('globe')} GitHub Status<br>${icon('key')} Team agent access</p><button class="small" data-action="connections">Inspect access</button></div><div style="margin-top:22px"><h3>Activity</h3><p>Same execution events as the Activity workspace.</p><button class="small" data-action="activity">Open related activity ${icon('arrowup')}</button></div></aside></div>`;}

function calendar(){const days=scheduleMode==='Day'?1:scheduleMode==='3 days'?3:scheduleMode==='Week'?7:35;return `<div class="row between wrap"><div><h2>Schedule</h2><p class="caption">September 2026 · Europe/Prague</p></div><div class="row wrap">${['Day','3 days','Week','Month','Year'].map(m=>`<button class="small ${m===scheduleMode?'btn info':'quiet'}" data-action="calendar-view" data-mode="${m}">${m}</button>`).join('')}<button class="primary small" data-action="schedule-add">${icon('plus')}Add schedule</button></div></div>${scheduleMode==='Year'?`<div class="year-grid">${['January','February','March','April','May','June','July','August','September','October','November','December'].map(m=>`<button class="month-tile" data-action="calendar-view" data-mode="Month"><strong>${m}</strong><span class="caption">Open month · sample 2026</span></button>`).join('')}</div>`:`<div class="calendar" style="grid-template-columns:repeat(${Math.min(days,7)},minmax(0,1fr))">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].slice(0,Math.min(days,7)).map(x=>`<div class="dayname">${x}</div>`).join('')}${Array.from({length:days},(_,i)=>{let date=days===35?i:7+i;return `<button class="day ${date===8?'today':''}" data-action="schedule-add" data-day="${date>=1&&date<=30?date:9}"><span>${date>=1&&date<=30?date:' '}</span>${plans.filter(p=>p.day===date).map(p=>`<span class="event">${icon('workflow')}${esc(p.time)} · Incident brief</span>`).join('')}</button>`}).join('')}</div>`}<div class="box" style="margin-top:17px"><div class="box-title">Planned starts</div><div class="box-body">${plans.length?plans.map(p=>`<div class="row between" style="margin:6px 0"><span>${icon('workflow')} ${p.repeat==='Once'?`September ${p.day} at ${esc(p.time)}`:`${esc(p.repeat)} at ${esc(p.time)}`}</span><button class="small danger" data-action="remove-plan" data-plan="${p.id}">Remove</button></div>`).join(''):'<p>No scheduled starts in this sample. Add one by choosing a day.</p>'}</div></div>`;}

button class="${screen==='schedule'?'active':''}" data-action="screen" data-screen="schedule">Schedule</button><button class="${screen==='versions'?'active':''}" data-action="screen" data-screen="versions">Versions</button><span class="spacer"></span>${run?`<label class="row caption">Demo state <select id="phase" aria-label="Demo execution state">${Object.entries(phases).map(([k,x])=>`<option value="${k}" ${phase===k?'selected':''} ${k==='waiting'&&!runRecipe.steps.some(s=>s.kind==='wait')?'disabled':''}>${x[0]}</option>`).join('')}</select></label>`:'<button data-action="show-run">Inspect sample run</button>'}</nav>${['recipe','run'].includes(screen)?contextStrip()+(V==='a'?documentLayout():V==='b'?mapLayout():studioLayout()):screen==='history'?history():screen==='versions'?versions():calendar()}${draft?`<footer class="editbar"><div class="grow"><strong style="font-size:12px">${current.version===0?'New routine draft':'Editing recipe · new version'}</strong><p>Changes stay in this draft. Saving does not start work.</p></div><button class="small" data-action="edit-identity">Identity</button><button class="small" data-action="discard">Discard</button><button class="primary small" data-action="save">${icon('check')}${current.version===0?'Create routine':'Save version'}</button></footer>`:''}</main></div>`;}

function modal(title,body,footer=''){const d=document.getElementById('modal');d.innerHTML=`<div class="modal-head"><span class="entity-icon" style="width:29px;height:29px">${icon('workflow')}</span><h2 id="modal-title" class="grow">${title}</h2><button data-action="close" aria-label="Close dialog">${icon('close')}</button></div><div class="modal-body">${body}</div><div class="modal-foot"><button data-action="close">Cancel</button>${footer}</div>`;if(!d.open)d.showModal();}
function close(){document.getElementById('modal').close();}
function showResult(){const noResult=['failed','queued','running','cancelled','interrupted'].includes(phase);modal('Run result',noResult?`<h3>No final verified report</h3><p style="margin-top:10px">${phases[phase][3]} Recorded responses can be inspected from the corresponding step.</p>`:`${phase==='unverified'?'<div class="outcome-notice"><strong>Report exists. Completion was not confirmed.</strong><p>The engine records this run as failed because the agent did not supply a recognized completion outcome. Do not treat this report as verified.</p></div>':''}${outputPreview(true)}`,noResult?'':`<button class="btn" data-action="download">Download sample</button>${phase==='waiting'?'<button class="primary" data-action="review">Review decision</button>':''}`);}
const library=[['agent_run','bot','Agent task','Give an agent a goal and clear inputs.'],['http','globe','Call a service','Read data through an HTTP request.'],['script','terminal','Run a script','Use a prepared file in the crew container.'],['transform','branch','Prepare data','Map and reshape step results.'],['code','code','Expression','Evaluate supported CEL or expr logic.'],['wait','shield','Human decision','Pause for an Inbox approval.'],['foreach','repeat','For each item','Repeat a defined body over a collection.'],['call_pipeline','workflow','Another routine','Reuse a published recipe.'],['query','search','Workspace query','Read supported workspace records.'],['notify','send','Notification','Deliver a message to a supported target.'],['crewship','grid','Crewship action','Use a registered workspace action.']];
function addModal(){modal('Add a step','<p>Choose what should happen. Conditions and dependencies are configured on the step, not as an invented execution type.</p><div class="library">'+library.map(([kind,ic,title,desc])=>`<button data-action="add-kind" data-kind="${kind}">${icon(ic)}<span><strong>${title}</strong><p>${desc}</p></span></button>`).join('')+'</div>');}
function startModal(){modal('Start '+esc(current.name),`<p>Review the input for this execution. The recipe stays unchanged.</p><label style="margin-top:16px">Feed URL<input id="run-url" type="url" value="https://www.githubstatus.com/api/v2/incidents/unresolved.json"></label><div class="readiness">${icon('shield')}<div><strong>Sample readiness summary</strong><p>Ops · Riley · 1 source · recipe v${current.version}. This prototype does not check real connections.</p></div></div><p class="caption">Starting opens a run in the same workspace and keeps the recipe layout in place.</p>`,`<button class="primary" data-action="confirm-start">${icon('play')}Start demo run</button>`);}
function editIdentity(){modal('Routine identity',`<label>Name<input id="identity-name" value="${esc(draft.name)}"></label><label>Purpose<textarea id="identity-description">${esc(draft.description)}</textarea></label><label>Team<select id="identity-team"><option>Ops</option><option>Quality</option></select></label><p class="caption">Icon, team and agent ownership remain explicit. This prototype uses sample identities.</p>`,`<button class="primary" data-action="apply-identity">Apply to draft</button>`);}
function openSchedule(day=9){modal('Schedule this routine',`<label>Routine<input value="${esc(current.name)}" readonly></label><div class="row"><label class="grow">September 2026 · day<input id="schedule-day" type="number" min="1" max="30" value="${day}"></label><label class="grow">Time<input id="schedule-time" type="time" value="09:00"></label></div><label style="margin-top:15px">Repeat<select id="schedule-repeat"><option>Once</option><option>Every weekday</option><option>Every Monday</option><option>Every weekend</option></select></label><p class="caption">Europe/Prague · This adds an illustrative calendar entry only.</p>`,`<button class="primary" data-action="save-plan">Add to demo calendar</button>`);}
function demoEvents(){const events=[['09:30','Run requested','Recipe v'+runRecipe.version+' · manual']];if(phase==='queued')return [...events,['09:30','Waiting for capacity','No step has started']];if(phase==='failed')return [...events,['09:30','Source request failed','HTTP 503 · subsequent steps did not start']];events.push(['09:30','Source response received','Read the status feed · attempt 1']);if(phase==='running')return [...events,['09:30','Step running',runRecipe.steps[runCursor]?.title||'Current step']];if(phase==='cancelled'||phase==='interrupted')return [...events,['09:30',phase==='cancelled'?'Run stopped':'Execution interrupted','Earlier recorded work is retained']];events.push(['09:30','Report produced','Riley · Write the incident brief']);return [...events,['09:30',phase==='waiting'?'Human decision requested':phase==='success'?'Completion confirmed':'Completion confirmation missing',phase==='waiting'?'Same decision as Inbox':phase==='success'?'Recorded checks passed':'Report retained · result not verified']];}
function review(){modal('Review the proposed brief',`<p>Same decision and execution identity as Inbox. Delivery is still waiting.</p><div style="margin-top:15px">${outputPreview(true)}</div><label style="margin-top:15px">Review note<textarea id="review-note" placeholder="Explain a correction or approval…"></textarea></label>`,`<button class="btn" data-action="request-changes">Request changes</button><button class="primary" data-action="approve">Approve demo result</button>`);}
function navigate(next){if(draft){modal('Keep editing or discard?', '<p>This draft has not been published. Navigation must not silently discard your work.</p>',`<button class="primary" data-action="discard-navigate" data-screen="${next}">Discard and continue</button>`);return;}screen=next;render();}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const act=el.dataset.action;
 if(act==='close'){close();return;}if(act==='select'){selected=+el.dataset.index;render();if(innerWidth<720)document.querySelector(V==='c'?'.center':'.workspace>aside')?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});return;}
 if(act==='screen'){navigate(el.dataset.screen);return;}if(act==='sidebar'){sidebarOpen=!sidebarOpen;render();return;}
 if(act==='show-run'){if(draft){navigate('run');return;}screen='run';phase='unverified';runNumber=24;runRecipe=clone(scenario==='simple'?basic:complex);selected=1;render();return;}
 if(act==='edit'){draft=clone(current);screen='recipe';render();return;}if(act==='discard'){modal('Discard this draft?','<p>The published recipe and its historical runs will stay unchanged.</p>','<button class="primary" data-action="confirm-discard">Discard draft</button>');return;}
 if(act==='confirm-discard'||act==='discard-navigate'){draft=null;if(current.version===0)current=clone(basic);screen=el.dataset.screen||'recipe';selected=Math.min(selected,current.steps.length-1);close();render();return;}
 if(act==='save'){if(!draft?.name.trim()||!draft.steps.length){toast('Give the recipe a name and add at least one step.');return;}const nextVersion=current.version+1;current=clone(draft);current.version=nextVersion;versionSnapshots[current.version]=clone(current);versionRows=[current.version,...versionRows.filter(v=>v<current.version)];draft=null;close();render();toast('Demo version saved. No real routine was changed or started.');return;}
 if(act==='add'){if(!draft){draft=clone(current);screen='recipe';}addModal();return;}
 if(act==='add-kind'){const [kind,ic,title]=library.find(x=>x[0]===el.dataset.kind);const s={id:kind+'_'+(draft.steps.length+1),title,kind,icon:ic,who:kind==='agent_run'?'Riley · Agent':'Configured action',description:'Describe what this step should achieve.',input:'Choose input',output:'Step result',source:'Choose a source',instructions:kind==='script'?'scripts/example.py':'Define this step’s task.',check:kind==='foreach'?'Nested approval waits are not supported by the current engine.':'Configure the result checks'};const insertAt=Math.min(selected+1,draft.steps.length);draft.steps.splice(insertAt,0,s);selected=insertAt;close();render();toast('Step added to the local draft. Configure its task and inputs.');return;}
 if(act==='remove-step'){if(selected<draft.steps.length-1){modal('Reconnect dependent steps first','<p>A later step may use this result. Choose a replacement source before deleting it. This prevents a visually valid but broken recipe.</p>');return;}draft.steps.splice(selected,1);selected=Math.max(0,selected-1);render();return;}
 if(act==='mapping'){modal('Choose a source',`<p>Only start-form answers and earlier results are offered.</p><div class="library"><button data-action="map-value" data-value="Start form → Feed URL">${icon('list')}Feed URL</button>${draft.steps.slice(0,selected).map(s=>`<button data-action="map-value" data-value="${esc(s.title+' → '+s.output)}">${icon(s.icon)}${esc(s.title)} → ${esc(s.output)}</button>`).join('')}</div>`);return;}
 if(act==='map-value'){draft.steps[selected].source=el.dataset.value;draft.steps[selected].input=el.dataset.value.split(' → ').pop();close();render();return;}
 if(act==='start'){if(draft){toast('Save the draft before starting a run.');return;}startModal();return;}
 if(act==='confirm-start'){const field=document.getElementById('run-url');if(!field.checkValidity()){field.reportValidity();return;}runRecipe=clone(current);runRecipe.usedUrl=field.value;screen='run';phase='running';runCursor=Math.min(1,runRecipe.steps.length-1);runNumber++;selected=Math.min(1,runRecipe.steps.length-1);close();render();toast('Demo run started in the same workspace. Use Demo state to explore outcomes.');return;}
 if(act==='history-run'){runRecipe=clone(scenario==='simple'?basic:complex);runNumber=+el.dataset.run;runRecipe.version=runNumber===24?3:2;phase=el.dataset.phase;screen='run';selected=1;render();return;}
 if(act==='result'){showResult();return;}
 if(act==='download'){const blob=new Blob(['# GitHub incident brief\n\nIllustrative wireframe content, not a real run output.\n\nNo active incidents in the sample feed.\n'],{type:'text/markdown'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='sample-incident-brief.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Downloaded an illustrative report.');return;}
 if(act==='review'){review();return;}if(act==='approve'){phase='running';runCursor=Math.max(0,runRecipe.steps.length-1);selected=runCursor;close();render();toast('Demo approval recorded; delivery is now the next step.');return;}
 if(act==='request-changes'){if(!document.getElementById('review-note').value.trim()){toast('Add a review note explaining what needs correction.');return;}close();modal('Correction recorded in the sample','<p>The proposal keeps the original decision and report as evidence. Automatic correction requires an explicitly authored branch or the existing Issue review contract; it is not invented by this UI.</p>');return;}
 if(act==='stop'){modal('Stop this demo run?','<p>Completed work will remain in the run. External actions already performed cannot be undone by stopping.</p>','<button class="primary" data-action="confirm-stop">Stop demo run</button>');return;}if(act==='confirm-stop'){phase='cancelled';close();render();return;}
 if(act==='activity'||act==='app-link'){const target=el.dataset.target||'Activity';modal(target==='Activity'?'Activity · run #'+runNumber:target,`<p>${target==='Activity'?'The same run and step identities connect these events to the routine.':'This is a navigation preview, not a connection to the live '+target+' workspace.'}</p><div class="timeline">${demoEvents().map(x=>`<div class="event-row"><span class="time">${x[0]}</span><div><strong>${x[1]}</strong><p>${x[2]}</p></div></div>`).join('')}</div><p class="caption" style="margin-top:12px">Illustrative event history. Production must show only recorded events.</p>`);return;}
 if(act==='step-output'){const s=active().steps[selected];const st=stepState(selected);modal('Step response · '+esc(s?.title||'Source'),st[1]==='failed'?'<div class="outcome-notice"><strong>Source request failed</strong><p>Sample: HTTP 503. The next step was not started.</p></div>':st[1]!=='complete'?'<p>No completed response is available for this step in this sample state.</p>':s.kind==='agent_run'?outputPreview(true):'<div class="notice">Recorded response preview · illustrative JSON</div><pre class="drawer-code">{ "incidents": [], "source": "GitHub Status" }</pre>');return;}
 if(act==='inputs'){modal(screen==='run'?'Inputs used for run #'+runNumber:'What you provide',`<label>Feed URL<input ${screen==='run'?'readonly':''} value="${esc(runRecipe.usedUrl||basic.steps[0].source)}"></label><p>This is an optional field with a default. ${screen==='run'?'These values belong to the historical run.':'Typed questions, choices and defaults remain in the start-form editor.'}</p>`,screen==='run'?'':'<button class="primary" data-action="form-preview">Preview questions</button>');return;}
 if(act==='form-preview'){modal('Start form · preview','<label>Feed URL<input value="https://www.githubstatus.com/api/v2/incidents/unresolved.json"></label><label>Report detail<select><option>Concise</option><option>Detailed</option></select></label><label>Additional instructions<textarea placeholder="Optional context…"></textarea></label><p class="caption">Illustrates existing typed controls. These sample fields are not written to the recipe.</p>');return;}
 if(act==='output-contract'){modal('Expected result',`<label>Result name<input value="Incident brief" ${draft?'':'readonly'}></label><label>Format<select ${draft?'':'disabled'}><option>Readable report</option>Structured data</option>File collection</option></select></label><div class="readiness">${icon('shield')}<p>Explicit completion confirmation and result checks determine whether the result is ready. An agent stopping is not proof of a verified result.</p></div><p class="caption">Proposed result editor. Output mappings and artifact contracts require implementation; this is a design preview.</p>`);return;}
 if(act==='connections'){modal('Connections and access','<div class="stack"><div class="box"><div class="box-body"><h3>GitHub Status</h3><p>HTTP source · public endpoint · no service secret</p></div></div><div class="box"><div class="box-body"><h3>Ops · Riley</h3><p>Agent model access belongs to the team. A client chooses the connection, not a secret value.</p></div></div></div><p style="margin-top:15px">Production must distinguish configured, verified, missing and unavailable. No live credential check happens in this prototype.</p>');return;}
 if(act==='code'){modal('Recipe source · advanced',`<p>The visual draft and source must describe the same recipe. Unsupported fields must survive visual edits.</p><pre class="drawer-code">${esc(JSON.stringify({name:active().name,version:active().version,steps:active().steps.map(s=>({id:s.id,type:s.kind,display_title:s.title}))},null,2))}</pre><p class="caption">Illustrative source summary, not an executable exported DSL.</p>`);return;}
 if(act==='edit-identity'){editIdentity();return;}if(act==='apply-identity'){draft.name=document.getElementById('identity-name').value;draft.description=document.getElementById('identity-description').value;draft.team=document.getElementById('identity-team').value;close();render();return;}
 if(act==='calendar-view'){scheduleMode=el.dataset.mode;render();return;}if(act==='schedule-add'){openSchedule(+el.dataset.day||9);return;}
 if(act==='save-plan'){const day=document.getElementById('schedule-day'),time=document.getElementById('schedule-time');if(!day.checkValidity()||!time.value){day.reportValidity();return;}plans.push({id:Date.now(),day:+day.value,time:time.value,repeat:document.getElementById('schedule-repeat').value});close();render();toast('Added to the sample calendar. No real schedule was created.');return;}
 if(act==='remove-plan'){plans=plans.filter(p=>p.id!==+el.dataset.plan);render();return;}
 if(act==='version'){const version=+el.dataset.version;const snapshot=versionSnapshots[version]||basic;modal('Recipe version '+version,`<p>Historical definition · immutable after publication.</p><div class="box" style="margin-top:15px"><div class="box-body"><h3>${esc(current.name)}</h3><p>${snapshot.steps.map(s=>esc(s.title)).join(' → ')}</p></div></div><p style="margin-top:15px">Restore prepares a draft. It must not replace the definition attached to an existing run.</p>`,`<button class="primary" data-action="restore" data-version="${version}">Use as a new draft</button>`);return;}
 if(act==='restore'){draft=clone(versionSnapshots[+el.dataset.version]||(scenario==='simple'?basic:complex));draft.version=+el.dataset.version;screen='recipe';selected=0;close();render();toast('Historical recipe copied into a draft. Nothing published.');return;}
 if(act==='new'){modal('New routine',`<p>Start with the goal. You can add the team and refine steps in the same workspace.</p><label style="margin-top:15px">Name<input id="new-name" placeholder="What will this routine do?"></label><label>Goal<textarea id="new-goal" placeholder="Describe the work and the result you want…"></textarea></label><div class="library"><button data-action="create-demo" data-method="ai">${icon('bot')}<span><strong>Draft with AI</strong><p>Review a proposed recipe before saving.</p></span></button><button data-action="create-demo" data-method="template">${icon('workflow')}<span><strong>Use a template</strong><p>Start from the incident brief sample.</p></span></button></div>`,`<button class="primary" data-action="create-demo" data-method="manual">Build it yourself</button>`);return;}
 if(act==='create-demo'){const method=el.dataset.method;current=clone(basic);current.name=document.getElementById('new-name').value||'New routine';current.description=document.getElementById('new-goal').value||'Describe the result this routine should deliver.';current.version=0;if(method==='manual')current.steps=[];draft=clone(current);screen='recipe';selected=0;close();render();toast(method==='ai'?'Illustrative AI draft prepared locally. No model was called.':'Local draft created. Add or edit steps without another wizard.');return;}
 if(act==='filter'){document.querySelectorAll('.sidebar .side-item').forEach(b=>b.classList.toggle('active',b===el));document.querySelectorAll('.routine-item').forEach((r,i)=>r.hidden=el.dataset.filter!=='All'&&i>1);toast('Sample filter: '+el.dataset.filter);return;}
 if(act==='sample-routine'){if(el.dataset.name===current.name){navigate('recipe');return;}modal(esc(el.dataset.name),'<p>The prototype concentrates on one comparable routine so the three layouts can be assessed fairly. The live catalog would open the selected routine here.</p>');return;}
 if(act==='map-help'){modal('How to read this map','<p>Each node is one recipe step. Solid links carry dependencies and results. Dashed links show conditions. A run adds recorded states to the same positions; it does not turn into a different trace viewer.</p>');}
});
document.addEventListener('input',e=>{if(e.target.dataset.field&&draft){draft.steps[selected][e.target.dataset.field]=e.target.value;}if(e.target.id==='search-routines'){const q=e.target.value.toLowerCase();document.querySelectorAll('.routine-item').forEach(n=>n.hidden=!n.textContent.toLowerCase().includes(q));}});
document.addEventListener('change',e=>{if(e.target.id==='scenario'){if(draft){e.target.value=scenario;toast('Save or discard the current draft before switching the sample.');return;}scenario=e.target.value;current=clone(scenario==='simple'?basic:complex);runRecipe=clone(current);selected=1;phase='unverified';plans=[];render();}if(e.target.id==='phase'){phase=e.target.value;if(phase==='waiting')selected=runRecipe.steps.findIndex(s=>s.kind==='wait');render();}if(e.target.dataset.field&&draft)draft.steps[selected][e.target.dataset.field]=e.target.value;});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('tr[data-action]'))e.target.click();});
const initialMode=window.location.hash.slice(1);if(initialMode==='edit'){draft=clone(current);}else if(initialMode==='run'){screen='run';}else if(['history','schedule','versions'].includes(initialMode)){screen=initialMode;}
render();
</script></body></html>
