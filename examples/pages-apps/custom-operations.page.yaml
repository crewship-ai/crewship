  - path: src/main.tsx
    encoding: utf8
    content: |
      import React, { useState } from 'react'
      import { createRoot } from 'react-dom/client'
      import { usePageSnapshot, getPanelHistory, runAction, getActionStatus, type PanelHistory } from '@crewship/pages'
      import './style.css'

      type Service = { name: string; state: string; label?: string }
      function App() {
        const page = usePageSnapshot()
        const [tab, setTab] = useState('Overview')
        const [filter, setFilter] = useState('')
        const [history, setHistory] = useState<PanelHistory | null>(null)
        const [busy, setBusy] = useState(false)
        const [error, setError] = useState('')
        const [starting, setStarting] = useState(false)
        const [pending, setPending] = useState('')
        const [runMessage, setRunMessage] = useState('')
        const services = page?.panels.find(p => p.id === 'services')
        const data = services?.data as { items?: Service[] } | undefined
        const items = data?.items ?? []
        const metric = (name: string) => items.find(item => item.name === name)
        const fleetPanel = page?.panels.find(p => p.id === 'fleet')
        const fleetData = fleetPanel?.data as { rows?: { crew: string; container: string | null; status: string; cpu: string | null; memory: string | null }[] } | undefined
        const fleetRows = fleetData?.rows ?? []
        const memory = page?.panels.find(p => p.id === 'memory')
        const sample = memory?.data as { value?: number; unit?: string; sparkline?: number[] } | undefined
        const values = sample?.sparkline ?? []
        const max = Math.max(...values, 1)
        const min = Math.min(...values, 0)
        const points = values.map((v, i) => `${24 + i * 552 / Math.max(values.length - 1, 1)},${150 - (v - min) / (max - min || 1) * 120}`).join(' ')
        const snapshotTime = services?.producedAt ? new Date(services.producedAt).toLocaleString('en-US') : null
        const cards = [
          { label: 'Crews in workspace', value: metric('Crews in workspace')?.label ?? '—', icon: '◫', detail: 'Live workspace inventory' },
          { label: 'Ops memory', value: metric('Ops memory used')?.label ?? '—', icon: '▥', detail: 'Measured inside the container' },
          { label: 'Ops CPU', value: metric('Ops CPU used')?.label ?? '—', icon: '◉', detail: 'Measured over this run' },
          { label: 'Running containers', value: metric('Running containers')?.label ?? '—', icon: '▤', detail: 'Across workspace crews' },
        ]
        async function loadHistory() {
          setBusy(true); setError('')
          try { setHistory(await getPanelHistory('services', { limit: 10 })); setTab('History') }
          catch (e) { setError(e instanceof Error ? e.message : 'Could not load history.') }
          finally { setBusy(false) }
        }
        async function refresh() {
          setStarting(true); setError('')
          try {
            const receipt = await runAction('services', 'refresh')
            setPending(receipt.pending_id)
            setRunMessage('Collection queued. The dashboard updates when the routine finishes.')
          } catch (e) { setError(e instanceof Error ? e.message : 'Could not start collection.') }
          finally { setStarting(false) }
        }
        async function checkRun() {
          setStarting(true); setError('')
          try {
            const result = await getActionStatus(pending)
            setRunMessage(`Request: ${result.pending_status}. Run: ${result.run_status || 'waiting to start'}.`)
          } catch (e) { setError(e instanceof Error ? e.message : 'Run status is unavailable.') }
          finally { setStarting(false) }
        }
        return <main className="lab">
          <div className="topline"><span className="brand"><i className="logo">C</i><strong>CREWSHIP</strong><b>/</b> LAB</span><span className="pill"><span className="pulse"/> LIVE WORKSPACE DEMO</span></div>
          <header className="hero">
            <div className="intro"><div className="eyebrow">YOUR AGENT FLEET, IN VIEW</div><h1>See your crews<br/><span>at work.</span></h1><p>A live Crewship Page showing every crew container's CPU and memory, plus a detailed sample from Ops. Refresh it with a governed routine.</p><div className="hero-tags"><span>CREWS</span><span>CONTAINERS</span><span>ROUTINES</span><span>PAGES</span></div></div>
            <div className="hero-panel"><div className="hero-panel-top"><span>LIVE SIGNAL</span><span className="signal"><i/> OPS CREW</span></div><div className="hero-panel-value">{metric('Ops memory used')?.label ?? '—'}</div><div className="hero-panel-caption">memory used in the running Ops container</div><div className="hero-panel-bars">{values.map((value, index) => <span key={index} style={{ height: `${Math.max(12, value / max * 100)}%` }}/>)}</div><div className="hero-panel-foot">{snapshotTime ? `Last sample · ${snapshotTime}` : 'Waiting for the first sample'}</div></div>
          </header>
          <div className="toolbar"><nav aria-label="Dashboard view">{['Overview', 'Fleet', 'History'].map(t => <button key={t} className={tab === t ? 'active' : ''} onClick={() => setTab(t)}>{t}</button>)}</nav><div className="controls"><button className="secondary" disabled={busy || !services} onClick={loadHistory}>{busy ? 'Loading…' : 'View history'}</button><button className="primary" disabled={starting || !services} onClick={refresh}>{starting ? 'Starting…' : 'Refresh live data'} <span>↗</span></button></div></div>
          {error && <p role="alert" className="error">{error}</p>}{pending && <div className="run-status"><p role="status">{runMessage}</p><button className="secondary" disabled={starting} onClick={checkRun}>Check run</button></div>}
          <div className="freshness"><span><i className={`dot ${services?.state === 'fresh' ? '' : 'old'}`}/>{snapshotTime ? `Snapshot · ${snapshotTime}` : 'Waiting for the first snapshot'}</span><span>{services?.state === 'fresh' ? 'Within 3-minute freshness target' : 'Refresh to collect current values'}</span></div>
          {tab === 'Overview' && <><section className="stats">{cards.map(card => <article key={card.label}><div className="stat-top"><span>{card.label}</span><i>{card.icon}</i></div><strong>{card.value}</strong><div className="stat-bottom">{card.detail}</div></article>)}</section><section className="lower"><article className="chart"><div className="section-title"><div><small>OPS CREW · CONTAINER</small><h2>Memory during the last collection</h2></div><span className="measure">{sample?.value?.toLocaleString('en-US') ?? '—'} <small>{sample?.unit ?? 'MB'}</small></span></div><svg viewBox="0 0 600 180" role="img" aria-label="Ops container memory readings"><defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop stopColor="#4f8cff" stopOpacity=".30"/><stop offset="1" stopColor="#4f8cff" stopOpacity="0"/></linearGradient></defs>{[30, 75, 120, 165].map(y => <line key={y} x1="0" y1={y} x2="600" y2={y} stroke="#263856" strokeDasharray="4 6"/>)}{values.length > 1 && <><polygon points={`24,175 ${points} 576,175`} fill="url(#fill)"/><polyline points={points} fill="none" stroke="#78adff" strokeWidth="3" strokeLinejoin="round"/></>}</svg><div className="chart-foot"><span>{values.length ? `${values.length} real readings from one run` : 'No sample yet'}</span><span>Source: Ops cgroup v2</span></div></article><article className="note"><span className="eyebrow">ONE PAGE, REAL CREWSHIP DATA</span><h2>A working dashboard for your agent fleet.</h2><p>This Page is built from versioned React source. A routine collects container data, writes panel snapshots, and keeps its run history in Crewship.</p><div className="flow"><span>Ops container</span><b>→</b><span>Routine</span><b>→</b><span>Page</span></div><button onClick={() => setTab('Fleet')}>Explore the crews <span>→</span></button></article></section></>}
          {tab === 'Fleet' && <article className="table-card"><div className="section-title"><div><small>WORKSPACE INVENTORY</small><h2>Crew containers</h2></div><input aria-label="Filter crews" placeholder="Filter crews or containers…" value={filter} onChange={e => setFilter(e.target.value)}/></div><p>Live container status, CPU and memory from the Crewship runtime. A dash means the runtime could not measure that value.</p>{fleetRows.length ? <><p className="mobile-hint">Swipe the table to see CPU and memory →</p><div className="table-scroll"><table><thead><tr><th>Crew</th><th>Container</th><th>Status</th><th>CPU</th><th>Memory</th></tr></thead><tbody>{fleetRows.filter(row => `${row.crew} ${row.container ?? ''}`.toLowerCase().includes(filter.toLowerCase())).map((row, index) => <tr key={`${row.crew}:${row.container ?? 'none'}:${index}`}><td>{row.crew}</td><td>{row.container ?? '—'}</td><td><span className={`fleet-state ${row.status === 'running' ? 'running' : ''}`}>{row.status}</span></td><td>{row.cpu ?? '—'}</td><td>{row.memory ?? '—'}</td></tr>)}</tbody></table></div></> : <div className="empty">{metric('Crews in workspace')?.label === 'Unavailable' ? 'Crew telemetry is temporarily unavailable.' : 'No crew containers were found in the last collection.'}</div>}</article>}
          {tab === 'History' && <article className="table-card"><div className="section-title"><div><small>AUDIT TRAIL</small><h2>Snapshot history</h2></div></div><p>Snapshots are loaded through the authorized Pages SDK. Viewing history does not start a run.</p>{history ? <table><thead><tr><th>Revision</th><th>Created at</th><th>Content</th></tr></thead><tbody>{history.items.map(x => <tr key={x.sequence}><td>#{x.sequence}</td><td>{new Date(x.producedAt).toLocaleString('en-US')}</td><td><details><summary>View snapshot</summary><pre>{JSON.stringify(x.data, null, 2)}</pre></details></td></tr>)}</tbody></table> : <button className="secondary" disabled={busy} onClick={loadHistory}>Load history</button>}</article>}
          <footer><span>CREWSHIP LAB <b>×</b> PAGES</span><span>Live samples · governed routine · versioned application</span></footer>
        </main>
      }
      createRoot(document.getElementById('root')!).render(<App />)
  - path: src/style.css
    encoding: utf8
    content: |
      :root{color-scheme:dark;--lab-bg:#080e1b;--lab-surface:#101a2c;--lab-surface-raised:#15213a;--lab-border:#253653;--lab-text:#eef4ff;--lab-muted:#9aabc9;--lab-blue:#528cff;--lab-blue-light:#8cb8ff;--lab-blue-soft:#1d3155}
      *{box-sizing:border-box}
      body{margin:0;background:var(--lab-bg);color:var(--lab-text);font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:14px}
      button,input{font:inherit}
      button{cursor:pointer;transition:transform 160ms ease,filter 160ms ease,background-color 160ms ease}
      button:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}
      button:active:not(:disabled){transform:translateY(0)}
      button:disabled{cursor:wait;opacity:.55}
      button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--lab-blue-light);outline-offset:4px}
      .lab{max-width:1510px;min-height:100vh;margin:auto;padding:28px clamp(20px,4vw,58px) 38px;background:radial-gradient(ellipse 72% 480px at 91% 0%,#142853 0%,transparent 78%),var(--lab-bg)}
      .topline,.brand,.pill,.hero-panel-top,.toolbar,.controls,.freshness,.stat-top,.section-title,.chart-foot,footer,.flow,.fleet-row{display:flex;align-items:center}
      .topline{justify-content:space-between;color:var(--lab-muted);font-size:11px;letter-spacing:1.8px}
      .brand{gap:14px}.brand strong{color:var(--lab-text);letter-spacing:2px}.brand b{color:#60779f;font-weight:400}
      .logo{display:grid;place-items:center;width:30px;height:30px;border:1px solid #4e80d1;border-radius:9px;color:var(--lab-blue-light);font-style:normal;font-weight:700;box-shadow:0 0 22px #407eff25}
      .pill{gap:9px;border:1px solid #31538a;border-radius:100px;padding:7px 12px;color:var(--lab-blue-light);background:#1424408a;font-size:10px;letter-spacing:1.3px}
      .pulse,.dot{width:7px;height:7px;border-radius:50%;background:var(--lab-blue);box-shadow:0 0 12px #5995ff9c}
      .hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.72fr);gap:42px;align-items:end;padding:56px 0 42px}
      .eyebrow,.section-title small{color:var(--lab-blue-light);font-size:10px;font-weight:700;letter-spacing:2.3px}
      h1{margin:14px 0 16px;font-size:clamp(43px,6vw,83px);line-height:1.03;letter-spacing:-4px;font-weight:650}
      h1 span{color:var(--lab-blue-light)}
      p{color:var(--lab-muted);line-height:1.7}
      .intro p{max-width:560px;font-size:15px}
      .hero-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:30px}.hero-tags span{padding:7px 10px;border:1px solid #29436d;border-radius:5px;color:#8eaad5;background:#13244191;font-size:10px;letter-spacing:1.2px}
      .hero-panel{min-height:262px;padding:23px 27px;border:1px solid #315088;border-radius:17px;background:linear-gradient(150deg,#1b3159,#101b2e 66%);box-shadow:0 22px 60px #0005,inset 0 1px #6d9cff26}
      .hero-panel-top{justify-content:space-between;font-size:10px;color:#a9bde1;letter-spacing:1.7px}.signal{color:#b8d3ff;letter-spacing:1px}.signal i{display:inline-block;width:6px;height:6px;background:#66a2ff;border-radius:50%;margin-right:5px;box-shadow:0 0 12px #66a2ff}
      .hero-panel-value{margin-top:19px;color:#fff;font-size:clamp(36px,4vw,54px);font-weight:600;letter-spacing:-2px}.hero-panel-caption{color:#a9bcdb;font-size:12px}.hero-panel-bars{height:54px;display:flex;gap:7px;align-items:end;margin:18px 0 16px}.hero-panel-bars span{flex:1;max-width:32px;background:linear-gradient(#87b7ff,#467de0);border-radius:3px 3px 0 0;opacity:.8}.hero-panel-foot{border-top:1px solid #3d5880;padding-top:12px;color:#8fa8ce;font-size:11px}
      .toolbar{justify-content:space-between;gap:16px;border-top:1px solid var(--lab-border);border-bottom:1px solid var(--lab-border);padding:12px 0}
      nav{display:flex;gap:5px}nav button{border:0;background:transparent;padding:10px 17px;border-radius:8px;color:var(--lab-muted)}nav button.active{background:var(--lab-blue-soft);color:#e8f1ff;box-shadow:inset 0 0 0 1px #41659e}
      .controls{gap:9px}.primary,.secondary{border-radius:8px;padding:10px 14px;font-weight:600}.primary{border:1px solid #7daeff;background:var(--lab-blue);color:#fff;box-shadow:0 7px 22px #2968da3c}.primary span{margin-left:13px}.secondary{border:1px solid #3b5379;background:#111e32;color:#c5daff}
      .freshness{justify-content:space-between;gap:12px;padding:22px 0;color:var(--lab-muted);font-size:11px}.freshness>span:first-child{display:flex;align-items:center;gap:9px}.dot{display:inline-block;flex:none}.dot.old{background:#d69a4b;box-shadow:0 0 10px #d69a4b88}
      .error{color:#ff9eac}.run-status{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.run-status p{font-size:12px}
      .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
      article{border:1px solid var(--lab-border);border-radius:13px;background:linear-gradient(155deg,#121f34,#0f192a)}
      .stats article{min-height:174px;padding:21px}.stat-top{justify-content:space-between;color:#a9bbd8;font-size:12px}.stat-top i{display:grid;place-items:center;width:28px;height:28px;border:1px solid #35517d;border-radius:8px;background:#1a3156;color:#9ec1ff;font-size:18px;font-style:normal}.stats strong{display:block;margin:22px 0 12px;color:#f5f8ff;font-size:clamp(22px,2.4vw,34px);font-weight:600;letter-spacing:-1px;overflow-wrap:anywhere}.stat-bottom{color:#8296b8;font-size:11px}
      .lower{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(290px,.8fr);gap:16px;margin-top:16px}.chart,.note,.table-card{padding:25px}.section-title{justify-content:space-between;gap:18px}h2{font-size:21px;font-weight:600;letter-spacing:-.5px;margin:7px 0 0}.measure{font-size:25px;white-space:nowrap}.measure small{font-size:12px;color:var(--lab-muted)}.chart svg{width:100%;display:block;margin:24px 0 12px;max-height:190px}.chart-foot{justify-content:space-between;gap:10px;color:#869cc0;font-size:11px}.note{background:linear-gradient(145deg,#1a3155,#111d32 72%)}.note h2{font-size:25px;line-height:1.18;margin:19px 0}.note p{font-size:12px}.flow{gap:9px;flex-wrap:wrap;margin:24px 0;color:#c5d7f6;font-size:11px}.flow span{border:1px solid #3c5e91;border-radius:7px;padding:8px 9px;background:#183057}.flow b{color:#7caaff}.note button{border:0;background:none;color:#9dc1ff;padding:0;font-weight:600}.note button span{margin-left:16px}
      .table-card{min-height:270px}.table-card .section-title{align-items:end}.table-card input{border:1px solid #3a5277;border-radius:8px;background:#0b1729;color:var(--lab-text);padding:10px 12px}.table-card>p{font-size:12px}.table-scroll{overflow-x:auto}.fleet-state{display:inline-block;border:1px solid #5a4b38;border-radius:100px;padding:4px 8px;color:#edc58b;background:#392a1e;font-size:11px;white-space:nowrap}.fleet-state.running{border-color:#34558a;background:#193050;color:#a8c9ff}.empty{padding:25px 0;color:var(--lab-muted)}.mobile-hint{display:none}
      table{width:100%;border-collapse:collapse;text-align:left;margin-top:20px}th,td{padding:13px 10px;border-bottom:1px solid var(--lab-border);font-size:12px}th{color:var(--lab-muted);font-weight:500}summary{cursor:pointer;color:#a8caff}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-width:600px}
      footer{justify-content:space-between;gap:15px;border-top:1px solid var(--lab-border);margin-top:29px;padding-top:18px;color:#6f85aa;font-size:10px;letter-spacing:1px}footer b{padding:0 8px;color:#729be0}
      @keyframes page-enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.hero,.toolbar,.stats article,.lower article,.table-card{animation:page-enter 320ms ease-out both}.stats article:nth-child(2){animation-delay:35ms}.stats article:nth-child(3){animation-delay:70ms}.stats article:nth-child(4){animation-delay:105ms}
      @media(max-width:950px){.hero{grid-template-columns:1fr;gap:25px;padding:40px 0 30px}.hero-panel{max-width:540px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.lower{grid-template-columns:1fr}}
      @media(max-width:630px){.lab{padding:18px 16px 28px}.pill{display:none}h1{letter-spacing:-2px}.toolbar{align-items:stretch;flex-direction:column}.toolbar nav,.controls{justify-content:space-between}.toolbar nav button{flex:1;padding:10px 6px}.controls button{flex:1}.stats{gap:9px}.stats article{padding:15px;min-height:155px}.chart,.note,.table-card{padding:17px}.freshness>span:last-child{display:none}.chart-foot,footer{flex-wrap:wrap}.table-card .section-title{align-items:stretch;flex-direction:column}.table-card input{width:100%}.table-scroll table{min-width:630px}.mobile-hint{display:block!important;color:#a8c9ff!important}}
      @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}button:hover:not(:disabled),button:active:not(:disabled){transform:none}}
