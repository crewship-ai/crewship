  - path: src/main.tsx
    encoding: utf8
    content: |
      import React, { useState } from 'react'
      import { createRoot } from 'react-dom/client'
      import { usePageSnapshot, getPanelHistory, runAction, getActionStatus, type PanelHistory } from '@crewship/pages'
      import './style.css'

      type Service = { name: string; state: string; label?: string }
      function App() {
        const page = usePageSnapshot()
        const [tab, setTab] = useState('Přehled')
        const [filter, setFilter] = useState('')
        const [history, setHistory] = useState<PanelHistory | null>(null)
        const [busy, setBusy] = useState(false)
        const [error, setError] = useState('')
        const [starting, setStarting] = useState(false)
        const [pending, setPending] = useState('')
        const [runMessage, setRunMessage] = useState('')
        const services = page?.panels.find(p => p.id === 'services')
        const data = services?.data as { items?: Service[] } | undefined
        const items = data?.items ?? []
        const memory = page?.panels.find(p => p.id === 'memory')
        const metrics = memory?.data as { value?: number; unit?: string; sparkline?: number[] } | undefined
        const values = metrics?.sparkline ?? []
        const max = Math.max(...values, 1)
        const min = Math.min(...values, 0)
        const points = values.map((v,i) => `${24 + i * 552 / Math.max(values.length - 1, 1)},${150 - (v-min)/(max-min || 1)*120}`).join(' ')
        async function loadHistory() {
          setBusy(true); setError('')
          try { setHistory(await getPanelHistory('services', { limit: 10 })); setTab('Historie') }
          catch(e) { setError(e instanceof Error ? e.message : 'Historii se nepodařilo načíst.') }
          finally { setBusy(false) }
        }
        async function refresh() {
          setStarting(true); setError('')
          try {
            const receipt = await runAction('services','refresh')
            setPending(receipt.pending_id)
            setRunMessage('Požadavek přijat do fronty. Nová data se zobrazí po dokončení měření.')
          } catch(e) { setError(e instanceof Error ? e.message : 'Měření se nepodařilo spustit.') }
          finally { setStarting(false) }
        }
        async function checkRun() {
          setStarting(true); setError('')
          try {
            const result = await getActionStatus(pending)
            setRunMessage(`Stav požadavku: ${result.pending_status}. Běh: ${result.run_status || 'čeká na spuštění'}.`)
          } catch(e) { setError(e instanceof Error ? e.message : 'Stav není dostupný.') }
          finally { setStarting(false) }
        }
        return <main>
          <div className="topline"><span><i className="logo">C</i> CREWSHIP <b>/</b> OPERATIONS LAB</span><span className="pill">CUSTOM PAGE · OPS</span></div>
          <header><div className="intro"><div className="eyebrow">VAŠE DATA. VAŠE APLIKACE.</div><h1>Provoz pod kontrolou<span>.</span></h1><p>Živý přehled kontejneru Ops. Routine sbírá data bez LLM; tlačítkem můžeš spustit nové měření.</p></div><div className="hero-number"><span>01</span><small>první vlastní aplikace</small></div></header>
          <div className="toolbar"><nav>{['Přehled','Služby','Historie'].map(t => <button key={t} className={tab===t?'active':''} onClick={()=>setTab(t)}>{t}</button>)}</nav><div className="controls"><button className="secondary" disabled={busy || !services} onClick={loadHistory}>{busy?'Načítám…':'Načíst historii'}</button><button className="primary" disabled={starting || !services} onClick={refresh}>{starting?'Zpracovávám…':'Obnovit měření'} <span>↗</span></button></div></div>
          {error && <p role="alert" className="error">{error}</p>}{pending && <div className="run-status"><p role="status">{runMessage}</p><button className="secondary" disabled={starting} onClick={checkRun}>Stav běhu</button></div>}
          <div className="freshness"><span className={`dot ${services?.state === 'fresh'?'':'old'}`}/>{services?.producedAt ? `Snapshot · ${new Date(services.producedAt).toLocaleString('cs-CZ')}` : 'Čekáme na první snapshot'}<span>{services?.state === 'fresh' ? 'Aktuální podle SLA' : 'Data potřebují obnovit'}</span></div>
          {tab==='Přehled' && <><section className="stats">{items.map((item,i)=><article key={item.name}><div className="stat-top"><span>{item.name}</span><span className="stat-icon">{['◈','▤','◷','↗'][i%4]}</span></div><strong>{item.label ?? 'Bez údaje'}</strong><div className="stat-bottom"><span className={`badge ${item.state}`}>{item.state==='ok'?'V pořádku':item.state==='warning'?'Pozornost':item.state}</span><small>kontejner Ops</small></div></article>)}</section>
          <section className="lower"><article className="chart"><div className="section-title"><div><small>POSLEDNÍ MĚŘENÍ KONTEJNERU</small><h2>Využitá paměť</h2></div><span className="measure">{metrics?.value?.toLocaleString('cs-CZ') ?? '—'} <small>{metrics?.unit ?? 'MB'}</small></span></div><svg viewBox="0 0 600 180" role="img" aria-label="Vzorek využité paměti"><defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop stopColor="var(--crewship-page-accent,#8adfbb)" stopOpacity=".28"/><stop offset="1" stopColor="var(--crewship-page-accent,#8adfbb)" stopOpacity="0"/></linearGradient></defs>{[30,75,120,165].map(y=><line key={y} x1="0" y1={y} x2="600" y2={y} stroke="var(--crewship-page-accent,#273530)" strokeDasharray="4 6"/>)}{values.length>1 && <><polygon points={`24,175 ${points} 576,175`} fill="url(#fill)"/><polyline points={points} fill="none" stroke="var(--crewship-page-accent,#8adfbb)" strokeWidth="3" strokeLinejoin="round"/></>}</svg><div className="chart-foot"><span>{values.length} vzorků z posledního běhu</span><span>Zdroj: routine v Ops</span></div></article>
          <article className="note"><span className="eyebrow">POSTAVENO PRO VÁŠ TÝM</span><h2>Dashboard je teprve začátek.</h2><p>Účetnictví, databáze nebo nasazování. Agent vytvoří rozhraní podle toho, co váš tým potřebuje.</p><ul><li>Vlastní layout a komponenty</li><li>Data přes Crewship SDK</li><li>Verzovaný zdrojový projekt</li></ul><button onClick={()=>setTab('Služby')}>Prohlédnout data <span>→</span></button></article></section></>}
          {tab==='Služby' && <article className="table-card"><div className="section-title"><h2>Služby a prostředky</h2><input aria-label="Filtrovat služby" placeholder="Filtrovat služby…" value={filter} onChange={e=>setFilter(e.target.value)}/></div><table><thead><tr><th>Název</th><th>Poslední hodnota</th><th>Stav vzorku</th></tr></thead><tbody>{items.filter(x=>x.name.toLowerCase().includes(filter.toLowerCase())).map(x=><tr key={x.name}><td>{x.name}</td><td>{x.label}</td><td><span className={`badge ${x.state}`}>{x.state}</span></td></tr>)}</tbody></table></article>}
          {tab==='Historie' && <article className="table-card"><h2>Historie snapshotů</h2><p>Načtená přes autorizované SDK. Tlačítko nespouští nový sběr dat.</p>{history ? <table><thead><tr><th>Revize</th><th>Čas vytvoření</th><th>Obsah</th></tr></thead><tbody>{history.items.map(x=><tr key={x.sequence}><td>#{x.sequence}</td><td>{new Date(x.producedAt).toLocaleString('cs-CZ')}</td><td><details><summary>Zobrazit snapshot</summary><pre>{JSON.stringify(x.data,null,2)}</pre></details></td></tr>)}</tbody></table> : <button className="primary" disabled={busy} onClick={loadHistory}>Načíst historii</button>}</article>}
          <footer><span>CREWSHIP PAGES <b>×</b> VLASTNÍ REACT APLIKACE</span><span>Ukázka · zkontrolovaný kód · žádné externí zdroje</span></footer>
        </main>
      }
      createRoot(document.getElementById('root')!).render(<App />)
  - path: src/style.css
    encoding: utf8
    content: |
      *{box-sizing:border-box}body{margin:0;background:var(--crewship-page-background,#0c1210);color:var(--crewship-page-text,#edf4ef);font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:14px}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}main{max-width:1450px;margin:auto;padding:28px 38px}.topline{display:flex;align-items:center;justify-content:space-between;color:var(--crewship-page-muted,#a2b2a8);font-size:11px;letter-spacing:1.6px}.topline>span:first-child{display:flex;align-items:center;gap:14px}.topline b{color:var(--crewship-page-border,#405249)}.logo{display:grid;place-items:center;width:27px;height:27px;border:1px solid var(--crewship-page-muted,#81cdaa);border-radius:8px;font-style:normal;color:var(--crewship-page-accent,#a5ecc8)}.pill{border:1px solid var(--crewship-page-border,#34493d);border-radius:30px;padding:7px 11px;color:var(--crewship-page-accent,#a6d9bc);font-size:9px}header{display:flex;align-items:center;justify-content:space-between;padding:40px 0 30px;gap:20px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--crewship-page-accent,#a3c9b2);font-weight:600}h1{font-size:clamp(30px,4.4vw,60px);font-weight:500;letter-spacing:-2px;margin:13px 0 14px;line-height:1.05}h1 span{color:var(--crewship-page-accent,#9fe5bd)}p{color:var(--crewship-page-muted,#92a79a);line-height:1.75;max-width:560px}.hero-number{display:flex;flex-direction:column;text-align:right}.hero-number>span{font-size:84px;letter-spacing:-8px;line-height:1;color:var(--crewship-page-border,#263c2e)}.hero-number small{font-size:10px;color:var(--crewship-page-muted,#748b7c);margin-top:8px}.toolbar{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--crewship-page-border,#27372e);border-bottom:1px solid var(--crewship-page-border,#27372e);padding:12px 0}nav{display:flex;gap:6px}nav button{border:0;background:none;padding:9px 18px;border-radius:7px;color:var(--crewship-page-muted,#94a89a)}nav .active{background:var(--crewship-page-border,#263a2d);color:var(--crewship-page-accent,#c7f5d8)}.primary{border:0;border-radius:7px;background:var(--crewship-page-accent,#beeccc);color:var(--crewship-page-surface,#183021);padding:10px 16px;font-weight:600}.primary span{margin-left:12px}.freshness{display:flex;gap:8px;align-items:center;color:var(--crewship-page-muted,#9aae9e);font-size:11px;margin:21px 0}.freshness>span:last-child{margin-left:auto;color:var(--crewship-page-muted,#6e8979)}.dot{width:6px;height:6px;border-radius:50%;background:var(--crewship-page-accent,#9be0b7)}.dot.old{background:#cda767}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}article{background:var(--crewship-page-background,#121c16);border:1px solid var(--crewship-page-border,#2a3b30);border-radius:12px}.stats article{padding:20px}.stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--crewship-page-muted,#a3b6aa);font-size:12px}.stat-icon{color:var(--crewship-page-accent,#a0c6af);font-size:20px}.stats strong{display:block;font-size:clamp(17px,2.2vw,29px);font-weight:500;margin:22px 0;letter-spacing:-.7px}.stat-bottom{display:flex;justify-content:space-between;align-items:center;gap:6px}.badge{display:inline-block;padding:4px 8px;border-radius:5px;background:var(--crewship-page-border,#283f30);color:var(--crewship-page-accent,#a5d7b6);font-size:10px}.badge.warning{background:#413826;color:#dcc08b}.stat-bottom small{color:var(--crewship-page-muted,#647e6d);font-size:10px}.lower{display:grid;grid-template-columns:1.65fr 1fr;gap:16px;margin-top:18px}.chart{padding:24px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px}.section-title small{font-size:9px;letter-spacing:1.5px;color:var(--crewship-page-muted,#8fae9b)}h2{font-size:20px;font-weight:500;letter-spacing:-.5px;margin:8px 0 14px}.measure{font-size:24px}.measure small{font-size:12px;letter-spacing:0}.chart svg{width:100%;display:block;margin-top:22px;max-height:190px}.chart-foot{display:flex;justify-content:space-between;color:var(--crewship-page-muted,#718c7b);font-size:10px;margin-top:12px;gap:12px}.note{padding:26px;background:radial-gradient(ellipse at top right,var(--crewship-page-border,#243f2c),var(--crewship-page-surface,#142019) 70%)}.note h2{font-size:26px;max-width:270px;margin-top:18px}.note p{font-size:12px}.note ul{list-style:none;padding:0;color:var(--crewship-page-accent,#aec5b6);font-size:12px;line-height:2.2}.note li:before{content:'✓';color:var(--crewship-page-accent,#b6e2c2);margin-right:10px}.note button{background:none;color:var(--crewship-page-accent,#cdf0d8);border:0;padding:5px 0}.note button span{margin-left:20px}footer{display:flex;justify-content:space-between;border-top:1px solid var(--crewship-page-border,#25392c);margin-top:30px;padding-top:18px;color:var(--crewship-page-muted,#6d8575);font-size:9px;letter-spacing:1px}footer b{padding:0 9px}.table-card{padding:25px;min-height:300px}.table-card input{background:var(--crewship-page-background,#0d1710);border:1px solid var(--crewship-page-border,#3c5544);color:var(--crewship-page-accent,#e5f5e9);padding:10px;border-radius:7px}table{border-collapse:collapse;width:100%;text-align:left}th{color:var(--crewship-page-muted,#819e8c);font-size:11px;font-weight:400}td,th{padding:16px 10px;border-bottom:1px solid var(--crewship-page-border,#26392d)}td{font-size:12px}pre{white-space:pre-wrap;max-width:600px;overflow-wrap:anywhere}summary{cursor:pointer;color:var(--crewship-page-accent,#bce6c8)}.error{color:#f5b6a5}@media(max-width:850px){main{padding:22px}.stats{grid-template-columns:repeat(2,1fr)}.lower{grid-template-columns:1fr}.hero-number{display:none}.freshness>span:last-child{display:none}footer{gap:20px;line-height:1.8}}@media(max-width:500px){main{padding:15px}.pill{display:none}.toolbar{gap:12px;flex-wrap:wrap}nav button{padding:8px 10px}.stats article{padding:14px}.stat-bottom small{display:none}.section-title{flex-wrap:wrap}}

      .controls,.run-status{display:flex;align-items:center;gap:10px}.secondary{background:transparent;color:var(--crewship-page-accent,#b4d1be);border:1px solid var(--crewship-page-border,#365440);border-radius:7px;padding:9px 12px}.run-status p{font-size:12px}.run-status{flex-wrap:wrap}

      /* Shared appearance is inherited from the workspace. The layout remains local. */
      :root {color:var(--crewship-page-text,#edf5ef);background:var(--crewship-page-background,#0c1410)}
      .primary {background:var(--crewship-page-accent,#9fe5bd);color:var(--crewship-page-on-accent,#000)}
      button {cursor:pointer;transition:transform 160ms ease,filter 160ms ease,background-color 160ms ease}
      button:hover:not(:disabled) {filter:brightness(1.08);transform:translateY(-1px)}
      button:active:not(:disabled) {transform:translateY(0)}
      button:disabled {cursor:wait;opacity:.65}
      button:focus-visible,input:focus-visible,summary:focus-visible {outline:2px solid var(--crewship-page-accent,#9fe5bd);outline-offset:4px}
      @keyframes page-enter {from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
      .hero,.toolbar,.stats article,.lower article,.table-card {animation:page-enter 320ms ease-out both}
      .stats article:nth-child(2) {animation-delay:35ms}
      .stats article:nth-child(3) {animation-delay:70ms}
      .stats article:nth-child(4) {animation-delay:105ms}
      .lower article {animation-delay:120ms}
      @media (prefers-reduced-motion:reduce) {
       *,*::before,*::after {animation:none!important;transition:none!important;scroll-behavior:auto!important}
       button:hover:not(:disabled),button:active:not(:disabled) {transform:none}
      }
