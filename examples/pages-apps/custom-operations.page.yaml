format: crewship-page-bundle/v2
page:
  name: Crewship Lab
  slug: custom-operations
  description: A live blue dashboard for your Crewship fleet, with per-container CPU and memory plus a detailed Ops resource sample.
  panels:
  - id: services
    schema: status.v1
    title: Crewship fleet and Ops resources
    owner: crew/ops
    producer: routine/pages-operations-sample
    sla_seconds: 180
    span: 12
    actions:
    - id: refresh
      kind: call
      label: Refresh metrics
      confirm:
        title: Refresh Crewship Lab now?
        body: The routine reads the Ops container and workspace crew telemetry, then updates this Page. It changes no configuration and uses no model.
      routine: pages-operations-sample
  - id: memory
    schema: metric.v1
    title: Ops container memory used
    owner: crew/ops
    producer: routine/pages-operations-sample
    sla_seconds: 180
    span: 12
  - id: fleet
    schema: table.v1
    title: Crew containers and resources
    owner: crew/ops
    producer: routine/pages-operations-sample
    sla_seconds: 180
    span: 12
references:
- ref: crew/ops
  kind: crew
  bindable: true
  used_by:
  - services
  - memory
  - fleet
- ref: routine/pages-operations-sample
  kind: routine
  bindable: true
  used_by:
  - services
  - memory
  - fleet
metadata:
  exported_at: '2026-09-09T10:18:30Z'
  panel_count: 3
