# A complete Crewship example: an hourly English-language brief built from a
# real public Czech news feed and published to a typed Page. No secrets live
# here; agents bind the workspace's existing ANTHROPIC_API_KEY slot.

apiVersion: crewship/v1
kind: Crew
metadata:
  name: Newsroom
  slug: news-crew
  description: Hourly English-language brief from the public Seznam News feed.
  icon: newspaper
  color: blue
spec:
  credentials:
    # Slot declaration only. Re-apply binds the active workspace credential;
    # the OAuth/CLI token value never enters this file.
    - env: ANTHROPIC_API_KEY
      provider: ANTHROPIC
      type: AI_CLI_TOKEN
      label: Anthropic Claude Code CLI token
  files:
    - src: scripts/seznam_rss_extract.py
      dest: shared/scripts/seznam_rss_extract.py
    - src: scripts/limit_page_text.py
      dest: shared/scripts/limit_page_text.py
  devcontainer:
    # Keep this explicit because network policy lives in the same block. A
    # plain Ubuntu image has no Claude Code binary and fails every agent_run
    # with exit 127; these are the product's verified default runtime pieces.
    image: mcr.microsoft.com/devcontainers/javascript-node:22-bookworm
    env:
      PATH: /home/agent/.local/bin:/home/agent/.local/share/mise/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    features:
      "ghcr.io/devcontainers/features/common-utils:2":
        username: agent
        uid: "1001"
        gid: "1001"
        installZsh: false
        upgradePackages: false
      "ghcr.io/devcontainers-extra/features/claude-code:2": {}
    memory_mb: 4096
    cpus: 2
    network_mode: restricted
    allowed_domains:
      - www.seznamzpravy.cz
  agents:
    - slug: news-research-lead
      name: Research Lead
      role_title: Newsroom Lead
      agent_role: LEAD
      cli_adapter: CLAUDE_CODE
      llm: { provider: ANTHROPIC, model: claude-sonnet-5 }
      tool_profile: MINIMAL
      memory_enabled: true
      env_refs: [ANTHROPIC_API_KEY]
      prompt: |
        You lead the news brief. Protect source fidelity and clearly separate a
        feed headline from interpretation. Use only facts present in the
        supplied source and write in English.

    - slug: news-data-collector
      name: Data Collector
      role_title: Feed Collector
      agent_role: AGENT
      cli_adapter: CLAUDE_CODE
      llm: { provider: ANTHROPIC, model: claude-sonnet-5 }
      tool_profile: MINIMAL
      memory_enabled: true
      env_refs: [ANTHROPIC_API_KEY]
      prompt: |
        Extract only entries present in the supplied RSS/XML feed. Preserve
        exact source titles and URLs, remove technical XML fields and
        duplicates, and write in English.

    - slug: news-analyst
      name: Analyst
      role_title: News Analyst
      agent_role: AGENT
      cli_adapter: CLAUDE_CODE
      llm: { provider: ANTHROPIC, model: claude-haiku-4-5 }
      tool_profile: MINIMAL
      memory_enabled: true
      env_refs: [ANTHROPIC_API_KEY]
      prompt: |
        Select at most ten important, diverse topics from the supplied entries.
        Add no facts absent from the input and preserve source links. Write in
        English.

    - slug: news-report-writer
      name: Report Writer
      role_title: Brief Writer
      agent_role: AGENT
      cli_adapter: CLAUDE_CODE
      llm: { provider: ANTHROPIC, model: claude-haiku-4-5 }
      tool_profile: MINIMAL
      memory_enabled: true
      env_refs: [ANTHROPIC_API_KEY]
      prompt: |
        Turn the verified selection into a concise English Crewship Page brief.
        Give every item a title and one sentence. Do not include URLs because
        narrative.v1 rejects them. Avoid conversational openings and offers of
        further help.

---
apiVersion: crewship/v1
kind: Routine
metadata:
  name: Seznam News Brief
  slug: seznam-news-brief
  labels:
    crew: news-crew
spec:
  dsl_version: "1.0"
  description: Fetch the Seznam News RSS feed hourly and publish a source-grounded English brief.
  estimated_cost_usd: 0.06
  estimated_duration_seconds: 240
  max_cost_usd: 0.25
  egress_targets:
    - www.seznamzpravy.cz
  steps:
    - id: fetch-rss
      type: http
      http:
        method: GET
        url: https://www.seznamzpravy.cz/rss
        headers:
          User-Agent: Crewship-News-Monitor/1.0
          Accept: application/rss+xml, application/xml, text/xml
        max_response_bytes: 60000

    - id: collect
      type: script
      needs: [fetch-rss]
      script:
        path: scripts/seznam_rss_extract.py
        interpreter: python3
        args: ["{{ steps.fetch-rss.output }}"]

    - id: select
      type: agent_run
      agent_slug: news-analyst
      needs: [collect]
      prompt: |
        Select at most six important stories from the entries below. Avoid
        duplicate topics and preserve the title and URL of every selected
        entry. Use only the supplied feed.

        Candidates:
        {{ steps.collect.output }}

    - id: write
      type: agent_run
      agent_slug: news-report-writer
      needs: [select]
      prompt: |
        Create a concise English Page brief. Start with "Updated: just now".
        Then write one numbered item per story with its title and one short
        sentence. Do not include URLs. Use only the supplied selection and keep
        the complete output under 1,800 characters.

        Selection:
        {{ steps.select.output }}

    - id: limit
      type: script
      needs: [write]
      script:
        path: scripts/limit_page_text.py
        interpreter: python3
        args: ["{{ steps.write.output }}"]

    - id: publish
      type: crewship
      action: page.write
      needs: [limit]
      args:
        page: seznam-news-brief
        panel: brief
        data:
          verdict: Seznam News Brief
          blocks:
            - kind: paragraph
              text: "{{ steps.limit.output }}"

  schedules:
    - name: Každou hodinu
      cron: "0 * * * *"
      timezone: Europe/Prague
      enabled: true

---
apiVersion: crewship/v1
kind: Page
metadata:
  name: Seznam News Brief
  slug: seznam-news-brief
  description: Automatically refreshed, source-grounded hourly news brief.
spec:
  panels:
    - id: brief
      schema: narrative.v1
      title: Current top stories
      icon: alert
      owner: crew/news-crew
      producer: routine/seznam-news-brief
      sla: 2h
      span: 12
